<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景十五種畫風：融合版總覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#F2EFE8;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:44px 40px 48px}
  h1{font:900 40px/1.2 "Noto Sans TC";letter-spacing:.04em}
  p.sub{margin-top:10px;font:400 22px/1.5 "Noto Sans TC";color:#57534D}
  .grid{margin-top:30px;display:grid;grid-template-columns:repeat(5,1fr);gap:28px 24px}
  figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}
  figcaption{margin-top:10px;font:700 21px/1.3 "Noto Sans TC"}
  figcaption span{display:block;margin-top:4px;font-weight:400;font-size:18px;color:#57534D}
  figcaption i{font-style:normal;color:#8A5A22;font-weight:700}
</style>
</head>
<body>
  <h1>插畫場景：十五種畫風（融合版）</h1>
  <p class="sub">背景是一個地方、底材鋪滿全頁；物件包圍而不並排；文字在場景裡。版面依內容：人物、步驟、地點、時間軸、標註用 C，高紋理的條列用 B（內生題箋）。</p>
  <div class="grid">
    <figure><img src="img/C-scene.jpg" alt=""><figcaption>紙黏土　C<span>三個人各在自己的位置</span></figcaption></figure>
    <figure><img src="img/hand-C.jpg" alt=""><figcaption>手繪　C<span>同一個房間，墨線與錯位色塊</span></figcaption></figure>
    <figure><img src="img/neon-C.jpg" alt=""><figcaption>霓虹　C<span>同一個房間，燈管；標題在招牌框裡</span></figcaption></figure>
    <figure><img src="img/retro-C.jpg" alt=""><figcaption>01 復古卡通　C<span>一格膠片就是一個時段</span></figcaption></figure>
    <figure><img src="img/crayon-C.jpg" alt=""><figcaption>02 兒童手繪　C<span>一條小路走過三個地方</span></figcaption></figure>
    <figure><img src="img/sketch-C.jpg" alt=""><figcaption>03 素描　C<span>每條說明拉線到它說的零件</span></figcaption></figure>
    <figure><img src="img/cave-C.jpg" alt=""><figcaption>04 山洞岩畫　C<span>四個角色圍著同一頭野牛</span></figcaption></figure>
    <figure><img src="img/egypt-C.jpg" alt=""><figcaption>05 埃及壁畫　C <i>建議生圖</i><span>一層分欄就是一個步驟</span></figcaption></figure>
    <figure><img src="img/han-C.jpg" alt=""><figcaption>06 漢畫像石拓片　C<span>四格就是四站，文字在榜題裡</span></figcaption></figure>
    <figure><img src="img/maya-C.jpg" alt=""><figcaption>07 瑪雅抄本　C <i>建議生圖</i><span>一頁就是一季</span></figcaption></figure>
    <figure><img src="img/shadow-C.jpg" alt=""><figcaption>08 皮影戲　C<span>三組戲偶就是三幕</span></figcaption></figure>
    <figure><img src="img/ukiyoe-B.jpg" alt=""><figcaption>09 浮世繪　B<span>和紙題箋</span></figcaption></figure>
    <figure><img src="img/vangogh-B.jpg" alt=""><figcaption>10 梵谷筆觸　B<span>微半透明的釉</span></figcaption></figure>
    <figure><img src="img/scream-B.jpg" alt=""><figcaption>11 吶喊　B<span>畫裡吊著的木牌</span></figcaption></figure>
    <figure><img src="img/pixel-C.jpg" alt=""><figcaption>12 8bit 像素　C<span>每一階就是一關</span></figcaption></figure>
  </div>
</body>
</html>
