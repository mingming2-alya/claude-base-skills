<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>融合規則示範：四張重排</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#ECEAE4;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:40px 40px 48px}
  h1{font:900 38px/1.2 "Noto Sans TC"}
  p.sub{margin-top:8px;font:400 21px/1.5 "Noto Sans TC";color:#57534D}
  .row{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  h2{margin-top:34px;font:900 25px/1.3 "Noto Sans TC"}
  h2 span{font-weight:400;font-size:20px;color:#57534D;margin-left:12px}
  .row{margin-top:12px}
  figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}
  figcaption{margin-top:8px;font:700 19px/1.4 "Noto Sans TC";color:#3A3732}
</style>
</head>
<body>
  <h1>融合規則示範：四張重排（左：原版，右：新版）</h1>
  <p class="sub">依使用者的三個建議：全頁同源底紋與筆觸、物件與文字結構互動、高紋理畫風用內生題箋。版面依內容：步驟用 C，高紋理的條列用 B。</p>
  <h2>埃及壁畫　C<span>石灰岩鋪滿全頁；四層分欄就是四個步驟，色帶當分隔，象形欄連起文字與畫面</span></h2>
  <div class="row"><figure><img src="../illustration-renderings/img/05-egypt.jpg" alt=""><figcaption>原版：左文右圖，壁畫被框成一幅畫</figcaption></figure><figure><img src="img/egypt-C.jpg" alt=""><figcaption>新版</figcaption></figure></div>
  <h2>8bit 像素　C<span>天空與地面鋪滿全頁；每一階就是一關，說明掛在各自的台階上方</span></h2>
  <div class="row"><figure><img src="../illustration-renderings/img/12-pixel.jpg" alt=""><figcaption>原版：條列在左、台階在右，靠數字對照</figcaption></figure><figure><img src="img/pixel-C.jpg" alt=""><figcaption>新版</figcaption></figure></div>
  <h2>梵谷筆觸　B<span>筆觸鋪滿全頁；文字寫在一層微半透明的釉上，底下的星空仍看得見；分隔線也是筆觸</span></h2>
  <div class="row"><figure><img src="../illustration-renderings/img/10-vangogh.jpg" alt=""><figcaption>原版：左半邊刻意壓暗、筆觸變平，像切出來的空白區</figcaption></figure><figure><img src="img/vangogh-B.jpg" alt=""><figcaption>新版</figcaption></figure></div>
  <h2>浮世繪　B<span>版畫鋪滿全頁；文字寫在畫裡的和紙題箋上，條目之間是印刷的雙線，浪花打上題箋一角</span></h2>
  <div class="row"><figure><img src="../illustration-renderings/img/09-ukiyoe.jpg" alt=""><figcaption>原版：右半邊是一張直切的版畫</figcaption></figure><figure><img src="img/ukiyoe-B.jpg" alt=""><figcaption>新版</figcaption></figure></div>
</body>
</html>
