<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景：三種融合版面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#ECEAE4;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:40px 40px 48px}
  h1{font:900 38px/1.2 "Noto Sans TC"}
  p.sub{margin-top:8px;font:400 21px/1.5 "Noto Sans TC";color:#57534D}
  .grid{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:30px 28px}
  figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}
  figcaption{margin-top:10px;font:900 23px/1.3 "Noto Sans TC"}
  figcaption span{display:block;margin-top:4px;font:400 19px/1.5 "Noto Sans TC";color:#57534D}
</style>
</head>
<body>
  <h1>插畫場景：背景與元素為什麼分家，三種融合版面</h1>
  <p class="sub">同一頁內容、同一套紙黏土材質、同一個左上光源。只改版面：場景是不是一個「地方」、物件在不在同一個面上、文字在不在場景裡。</p>
  <div class="grid">
    <figure><img src="../style-moodboard-v5/img/01a-illustration-clay.jpg" alt=""><figcaption>原版（v5）<span>物件全擠在右側四成；馬克杯與便利貼浮在半空；背景是一片漸層、不是地方；左邊文字區空著。</span></figcaption></figure>
    <figure><img src="img/A-wrap.jpg" alt=""><figcaption>A　全景環繞：整張是桌面<span>俯視的一張桌子，物件從四邊進來、被邊緣裁切，影子都落在同一張桌面；文字直接寫在桌面中央的光裡。</span></figcaption></figure>
    <figure><img src="img/B-board.jpg" alt=""><figcaption>B　文字在物件上：佈告欄<span>標題與總結寫在釘上去的紙，三個人是三張卡片；識別證、行事曆、便利貼也釘在同一塊板上，旁邊是牆上的時鐘與架上的盆栽。</span></figcaption></figure>
    <figure><img src="img/C-scene.jpg" alt=""><figcaption>C　內容住進場景：三個人各在自己的位置<span>一個有牆、窗、地板的空間；導師在你的電腦旁、主管指著週五、夥伴在咖啡機邊，各自的說明就站在頭上。</span></figcaption></figure>
  </div>
</body>
</html>
