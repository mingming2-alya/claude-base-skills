<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景：補另一種明暗（四張示範）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#F2EFE8;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:44px 40px 48px}
  h1{font:900 40px/1.2 "Noto Sans TC";letter-spacing:.04em}
  p.sub{margin-top:10px;font:400 22px/1.5 "Noto Sans TC";color:#57534D}
  .row{margin-top:34px}
  .row h2{font:700 26px/1.3 "Noto Sans TC";letter-spacing:.03em}
  .row h2 span{margin-left:14px;font-weight:400;font-size:21px;color:#57534D}
  .pair{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}
  figcaption{margin-top:8px;font:400 19px/1.3 "Noto Sans TC";color:#57534D}
  figcaption b{color:#22201C}
  figcaption i{font-style:normal;color:#8A5A22;font-weight:700}
</style>
</head>
<body>
  <h1>插畫場景：補另一種明暗（四張示範）</h1>
  <p class="sub">版面不動，只換明暗。變暗不等於夜晚：只換光線，或用材質本身的深色款；月亮星星跟著內容走。B 版面寫字的載體跟著變深。左邊是原有的，右邊是新補的。</p>
  <div class="row">
    <h2>紙黏土　淺 → 深<span>換光線：拉上百葉窗、關掉大燈，只留檯燈與螢幕的暖光，往右逐漸變暗</span></h2>
    <div class="pair">
      <figure><img src="img/C-scene.jpg" alt=""><figcaption><b>原有：淺色</b>　粉彩黏土，白天的房間</figcaption></figure>
      <figure><img src="img/C-scene-dark.jpg" alt=""><figcaption><b>新補：深色</b>　<i>C-scene-dark</i>　黏土亮面轉暖、暗面轉冷</figcaption></figure>
    </div>
  </div>
  <div class="row">
    <h2>霓虹　深 → 淺<span>換光線：店裡燈全開的白漆磚牆；燈管照樣亮著，看得到支架、投影與電極盒</span></h2>
    <div class="pair">
      <figure><img src="img/neon-C.jpg" alt=""><figcaption><b>原有：深色</b>　暗磚牆；窗裡的月亮已拿掉（時間記號跟著內容走）</figcaption></figure>
      <figure><img src="img/neon-C-light.jpg" alt=""><figcaption><b>新補：淺色</b>　<i>neon-C-light</i>　色光收成光暈，亮芯是一條淡色細線</figcaption></figure>
    </div>
  </div>
  <div class="row">
    <h2>漢畫像石拓片　淺 → 深<span>材質深色款：烏金拓。人物凹刻成灰白剪影，刻線發白；瓦當維持黑色，不做成像月亮的淺色圓盤</span></h2>
    <div class="pair">
      <figure><img src="img/han-C.jpg" alt=""><figcaption><b>原有：淺色</b>　宣紙上的墨拓</figcaption></figure>
      <figure><img src="img/han-C-dark.jpg" alt=""><figcaption><b>新補：深色</b>　<i>han-C-dark</i>　整張重墨，黑亮</figcaption></figure>
    </div>
  </div>
  <div class="row">
    <h2>浮世繪　淺 → 深<span>材質深色款：藍摺絵，只用藍的濃淡套印；題箋改墨地，字白抜き</span></h2>
    <div class="pair">
      <figure><img src="img/ukiyoe-B.jpg" alt=""><figcaption><b>原有：淺色</b>　和紙題箋</figcaption></figure>
      <figure><img src="img/ukiyoe-B-dark.jpg" alt=""><figcaption><b>新補：深色</b>　<i>ukiyoe-B-dark</i>　和紙的白只留在雪頂、帆、浪花；朱只留在關鍵字、燈籠、印</figcaption></figure>
    </div>
  </div>
</body>
</html>
