<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>梵谷筆觸深色版（B）｜創意工作坊：深鈷藍的白天天空，字寫在一層薄釉上</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=block">
<link rel="stylesheet" href="../../illustration-renderings/src/base.css">
<style>
  :root{--bg:#1F4288;--ink:#F6EBC8;--ink2:#EFE3BD;--sub:#CFC6A6;--accent:#F4C542}
  .bn{font:900 30px/1 "Chiron GoRound TC";fill:#1A2F5E}
</style>
</head>
<body>
<div class="slide">
  <svg class="scene" id="scene" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <nav aria-label="章節"><span>目標</span><b>工作坊流程</b><span>分組</span><span>產出</span></nav>
  <div class="copy">
    <h2>創意工作坊</h2>
    <p class="key">好點子不是等來的，是<em>一輪一輪磨出來的</em>。</p>
  </div>
  <ul class="items">
    <li><svg class="badge" viewBox="0 0 104 104" data-n="1" aria-hidden="true"></svg><div><strong>先發散</strong><span>十分鐘寫滿三十張便利貼</span></div></li>
    <li><svg class="badge" viewBox="0 0 104 104" data-n="2" aria-hidden="true"></svg><div><strong>再收斂</strong><span>每人三票，選出最想做的</span></div></li>
    <li><svg class="badge" viewBox="0 0 104 104" data-n="3" aria-hidden="true"></svg><div><strong>做原型</strong><span>當天就做出能試的版本</span></div></li>
  </ul>
</div>
<script>
let seed = 3;
const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t ^= t + Math.imul(t ^ t >>> 7, 61 | t); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const pick = a => a[Math.floor(rand() * a.length)];
// strokes are batched per layer and colour; each batch gets a shadow and a highlight
const layers = [];
let L = -1;
const layer = () => { layers.push({}); L++; };
function st(x, y, a, len, col, w) {
  const dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2, k = col + '|' + w;
  (layers[L][k] ||= []).push(`M${(x - dx).toFixed(1)} ${(y - dy).toFixed(1)}L${(x + dx).toFixed(1)} ${(y + dy).toFixed(1)}`);
}
const lighten = (hex, t) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - t) + 255 * t).toString(16).padStart(2, '0')).join('');

// the sky: a flow field with a few vortices, calm over the text
const vort = [[1330, 300, 1, 150], [1660, 220, -.85, 110], [1180, 170, .55, 90], [1760, 520, .6, 100], [470, 330, .9, 170], [760, 760, -.7, 130]];
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function flow(x, y) {
  const k = 1;
  let vx = 1, vy = .18 * Math.sin(x * .004 + y * .007);
  for (const [cx, cy, s, r] of vort) { const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy) + 1, f = k * s * r * r * 2.4 / (d * d + r * r); vx += -dy / d * f; vy += dx / d * f; }
  return Math.atan2(vy, vx);
}
layer();
for (let y = 6; y < 1080; y += 15) for (let x = 6; x < 1920; x += 15) {
  const px = x + (rand() - .5) * 10, py = y + (rand() - .5) * 10, calm = false;
  let col;
  if (calm) col = pick(['#1C3870', '#1F3D78', '#22417C', '#1A3366', '#24467F']);
  else {
    const near = vort.some(([cx, cy, , r]) => Math.hypot(px - cx, py - cy) < r * 1.1);
    col = near ? pick(['#3E70BC', '#5C8FD6', '#9CC3E8', '#3264B0', '#7FB0DD']) : pick(['#1F4590', '#2752A0', '#2E5DAE', '#1D3F86', '#3A6BBA', '#4677C4']);
  }
  st(px, py, flow(px, py) + (rand() - .5) * .25, 18 + rand() * 14, col, calm ? 7 : 8 + Math.round(rand() * 2));
}
// daytime, as the workshop is: no stars or moon; white clouds turn in two of the vortices and one sun burns where the moon was
layer();
const ring = (cx, cy, R, pal) => { for (let r = 6; r <= R; r += 8) { const n = Math.max(5, Math.round(2 * Math.PI * r / 13)); for (let k = 0; k < n; k++) { const t = k / n * Math.PI * 2 + rand() * .2; st(cx + Math.cos(t) * r, cy + Math.sin(t) * r, t + Math.PI / 2, 14, pal(r / R), 7); } } };
const CLOUD = typeof CLOUD_PAL !== 'undefined' ? CLOUD_PAL : [['#E9EEF2', '#F4F6F8'], ['#BFD3E6', '#D5E2EE', '#9CC3E8']];
// clouds are long, as in his daytime fields: strokes laid along flattened ellipses, not round like a moon
const cloud = (cx, cy, Rx, Ry) => { for (let f = .12; f <= 1; f += .14) { const n = Math.max(6, Math.round(2 * Math.PI * Rx * f / 15)); for (let k = 0; k < n; k++) { const t = k / n * Math.PI * 2 + rand() * .15, x = cx + Math.cos(t) * Rx * f, y = cy + Math.sin(t) * Ry * f; st(x, y, Math.atan2(Math.cos(t) * Ry, -Math.sin(t) * Rx), 15, f < .6 ? pick(CLOUD[0]) : pick(CLOUD[1]), 7); } } };
cloud(1320, 300, 170, 48); cloud(1150, 160, 120, 36);
ring(1770, 170, 92, f => f < .35 ? '#FFF6C8' : f < .7 ? pick(['#F8E08A', '#F4C542']) : pick(['#F4C542', '#E8A33A']));
for (let k = 0; k < 28; k++) { const t = k / 28 * Math.PI * 2; st(1770 + Math.cos(t) * 122, 170 + Math.sin(t) * 122, t, 28, pick(['#F4C542', '#E8C860', '#F8E08A']), 7); }
// cypress, like a dark flame
layer();
for (let y = 330; y < 1090; y += 9) {
  const w = 74 * Math.pow((y - 330) / 750, .6) + 6 * Math.sin(y * .05), c = 1036 + 18 * Math.sin((y - 330) * .01);
  for (let x = c - w; x < c + w; x += 10) st(x + (rand() - .5) * 6, y, -Math.PI / 2 + .7 * Math.sin(y * .03 + x * .04), 20 + rand() * 10, pick(['#1F3B2A', '#2E5A3A', '#16301F', '#3D6B45', '#0F2418', '#4A5E2E']), 8);
}
// the table and today's tools
layer();
for (let y = 892; y < 1090; y += 11) for (let x = 1170; x < 1930; x += 15) st(x + (rand() - .5) * 8, y + 4 * Math.sin(x * .02), (rand() - .5) * .3, 22 + rand() * 10, pick(['#C8862F', '#E0A84A', '#9A5E22', '#B07030', '#D99A3E']), 8);
// a lightbulb that glows
for (let r = 108; r <= 196; r += 9) { const n = Math.round(2 * Math.PI * r / 14); for (let k = 0; k < n; k++) { const t = k / n * Math.PI * 2 + rand() * .2, x = 1530 + Math.cos(t) * r, y = 610 + Math.sin(t) * r; if (y < 740) st(x, y, t + Math.PI / 2, 15, r < 140 ? pick(['#F8E08A', '#F4C542']) : r < 170 ? pick(['#E8C860', '#9CC3E8']) : pick(['#7FB0DD', '#5C8FD1']), 7); } }
layer();
for (let y = 520; y < 760; y += 8) for (let x = 1430; x < 1630; x += 8) {
  const dx = x - 1530, dy = y - 610, inBall = Math.hypot(dx, dy) < 94, inNeck = y > 660 && y < 756 && Math.abs(dx) < 40 + (756 - y) * .45;
  if (inBall || inNeck) { const d = Math.hypot(dx, dy) / 94; st(x + (rand() - .5) * 4, y + (rand() - .5) * 4, Math.atan2(dy, dx) + Math.PI / 2, 13, d < .45 ? '#FFF8D8' : d < .75 ? pick(['#FFF0A8', '#F8E08A']) : pick(['#F4C542', '#E8A33A']), 7); }
}
for (let y = 762; y < 830; y += 9) for (let x = 1494; x < 1568; x += 11) st(x, y, (rand() - .5) * .2, 14, pick(['#8FA6B4', '#5E7486', '#B5C6D0']), 8);
for (let k = 0; k < 6; k++) st(1512 + k * 7, 640 - Math.abs(k - 2.5) * 8, 1.2, 16, '#E8742E', 4);
// sticky notes and a cup
const note = (cx, cy, rot, cols) => { const a = rot * Math.PI / 180; for (let v = -44; v <= 44; v += 9) for (let u = -44; u <= 44; u += 12) st(cx + u * Math.cos(a) - v * Math.sin(a), cy + u * Math.sin(a) + v * Math.cos(a), a + (rand() - .5) * .2, 16, pick(cols), 8); for (const [u0, v0, u1, v1] of [[-48, -48, 48, -48], [48, -48, 48, 48], [48, 48, -48, 48], [-48, 48, -48, -48]]) for (let t = 0; t <= 1; t += .25) { const u = u0 + (u1 - u0) * t, v = v0 + (v1 - v0) * t; st(cx + u * Math.cos(a) - v * Math.sin(a), cy + u * Math.sin(a) + v * Math.cos(a), a + (u0 === u1 ? Math.PI / 2 : 0), 26, '#1A2F5E', 5); } };
note(1700, 930, -8, ['#F4D35E', '#F8E08A', '#E8C860']); note(1812, 966, 10, ['#F2A65A', '#E8873E', '#F4B370']); note(1632, 1000, 4, ['#9BD18B', '#7FBF73', '#B4DDA0']);
for (let y = 804; y < 912; y += 6) for (let x = 1286; x < 1392; x += 7) st(x + (rand() - .5) * 3, y, Math.PI / 2 + (rand() - .5) * .25, 12, pick(['#E9EEF2', '#BFD3E6', '#D5E2EE', '#F4F6F8']), 8);
for (let y = 800; y <= 914; y += 12) { st(1282, y, Math.PI / 2, 16, '#1A2F5E', 5); st(1394, y, Math.PI / 2, 16, '#1A2F5E', 5); }
for (let x = 1286; x <= 1390; x += 13) st(x, 916, 0, 18, '#1A2F5E', 5);
for (let k = 0; k < 10; k++) { const t = -Math.PI / 2 + k / 9 * Math.PI; st(1400 + Math.cos(t) * 30, 856 + Math.sin(t) * 30, t + Math.PI / 2, 14, '#BFD3E6', 8); }
for (let k = 0; k < 3; k++) for (let j = 0; j < 6; j++) st(1306 + k * 30 + 8 * Math.sin(j * 1.2), 790 - j * 16, Math.PI / 2 + .5 * Math.cos(j * 1.2), 14, '#E9EEF2', 4);
// signature frame: a border of thick strokes
layer();
const fr = ['#8A5A22', '#B8862F', '#D9A84A', '#6E4416', '#A4732A'];
for (let x = 0; x < 1930; x += 13) { st(x, 9 + rand() * 6, 0, 24, pick(fr), 9); st(x, 1071 - rand() * 6, 0, 24, pick(fr), 9); }
for (let y = 0; y < 1090; y += 13) { st(9 + rand() * 6, y, Math.PI / 2, 24, pick(fr), 9); st(1911 - rand() * 6, y, Math.PI / 2, 24, pick(fr), 9); }

const draw = Ly => {
  let o = '';
  const keys = Object.keys(Ly);
  o += `<path d="${keys.map(k => Ly[k].join('')).join('')}" stroke="#0B1530" stroke-opacity=".38" stroke-width="8" stroke-linecap="round" fill="none" transform="translate(1.8 2)"/>`;
  keys.forEach(k => { const [col, w] = k.split('|'); o += `<path d="${Ly[k].join('')}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`; });
  keys.forEach(k => { const [col, w] = k.split('|'); o += `<path d="${Ly[k].join('')}" stroke="${lighten(col, .45)}" stroke-opacity=".45" stroke-width="${(w * .32).toFixed(1)}" stroke-linecap="round" fill="none" transform="translate(-1.2 -1.4)"/>`; });
  return o;
};
let out = '<defs><filter id="frost" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="7"/></filter>'
  + '<clipPath id="glaze"><rect x="96" y="34" width="896" height="918" rx="36"/></clipPath></defs>';
out += '<rect width="1920" height="1080" fill="#1F4288"/><g id="paint">' + draw(layers[0]) + draw(layers[1]) + '</g>';
// the glaze: the same sky, softened and darkened, with painted edges
out += '<g clip-path="url(#glaze)"><use href="#paint" filter="url(#frost)"/><rect x="96" y="34" width="896" height="918" fill="#13254F" opacity=".58"/></g>';
let edge = '';
for (let x = 120; x < 972; x += 15) edge += `M${x} ${36 + Math.sin(x * .05) * 2}l14 0 M${x} ${950 + Math.cos(x * .05) * 2}l14 0 `;
for (let y = 60; y < 930; y += 15) edge += `M${98 + Math.sin(y * .05) * 2} ${y}l0 14 M${990 + Math.cos(y * .05) * 2} ${y}l0 14 `;
out += `<path d="${edge}" stroke="#9CC3E8" stroke-opacity=".55" stroke-width="6" stroke-linecap="round" fill="none"/>`;
// painted strokes between the items: the dividers are brushwork too
let div = '';
[592, 730].forEach(y => { for (let x = 150; x < 700; x += 22) div += `M${x} ${y + Math.sin(x * .07) * 2}l16 ${(Math.sin(x) * 2).toFixed(1)} `; });
out += `<path d="${div}" stroke="#E8C860" stroke-opacity=".75" stroke-width="5" stroke-linecap="round" fill="none"/>`;
layers.slice(2).forEach(Ly => out += draw(Ly));
document.getElementById('scene').innerHTML = out;

// list badges: a small sun, painted
document.querySelectorAll('svg.badge').forEach(el => {
  let s = '';
  for (let r = 30; r <= 48; r += 8) { const n = Math.round(2 * Math.PI * r / 12); for (let k = 0; k < n; k++) { const t = k / n * Math.PI * 2, x = 52 + Math.cos(t) * r, y = 52 + Math.sin(t) * r, a = t + Math.PI / 2; s += `<path d="M${(x - Math.cos(a) * 6).toFixed(1)} ${(y - Math.sin(a) * 6).toFixed(1)}L${(x + Math.cos(a) * 6).toFixed(1)} ${(y + Math.sin(a) * 6).toFixed(1)}" stroke="${r < 40 ? '#F4C542' : '#9CC3E8'}" stroke-width="6" stroke-linecap="round"/>`; } }
  s += `<circle cx="52" cy="52" r="24" fill="#FFF0A8"/><text class="bn" x="52" y="63" text-anchor="middle">${el.dataset.n}</text>`;
  el.innerHTML = s;
});
</script>
</body>
</html>
