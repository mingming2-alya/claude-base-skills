<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景融合版 A｜全景環繞：整張是桌面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=block">
<link rel="stylesheet" href="../../illustration-renderings/src/base.css">
<style>
  :root{--bg:#F1DCC6;--ink:#3B332D;--ink2:#5E4F45;--sub:#6A5C50;--accent:#B4512F}
</style>
</head>
<body>
<div class="slide">
  <svg class="scene" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs id="defs">
      <!-- the desk is lit from the upper left; the pool of light falls where the text sits -->
      <radialGradient id="desk" cx="560" cy="380" r="1500" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FAEBDC"/><stop offset=".45" stop-color="#F2DDC8"/><stop offset="1" stop-color="#E2C3A6"/>
      </radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#desk)"/>
    <rect width="1920" height="1080" filter="url(#grain)" opacity=".35" style="mix-blend-mode:multiply"/>
    <g id="objs"></g>
  </svg>
  <nav aria-label="章節"><span>報到前</span><b>第一週</b><span>第一個月</span><span>找誰幫忙</span></nav>
  <div class="copy">
    <h2>第一週會遇到的人</h2>
    <p class="key">不用急著學會一切，先認識<em>這三個人</em>就好。</p>
  </div>
  <ul class="items">
    <li><svg class="badge" viewBox="0 0 104 104" data-t="gPeach|#FDF0E4" aria-hidden="true"></svg><div><strong>你的導師</strong><span>有問題先問他，再小的事都可以</span></div></li>
    <li><svg class="badge" viewBox="0 0 104 104" data-t="gSage|#F4F7EC" aria-hidden="true"></svg><div><strong>你的主管</strong><span>週五一起看你的第一個小任務</span></div></li>
    <li><svg class="badge" viewBox="0 0 104 104" data-t="gButter|#FFF7E2" aria-hidden="true"></svg><div><strong>隔壁的夥伴</strong><span>午餐、會議室、印表機，都問他</span></div></li>
  </ul>
</div>
<script src="clay.js"></script>
<script>
// Seen from above: everything lies on the same desk, cut off by all four edges, shadows to the lower right.
let s = '';
// left edge: a succulent in its pot
s += `<g filter="url(#clay)"><circle cx="18" cy="640" r="92" fill="url(#gTerra)"/><circle cx="18" cy="640" r="76" fill="#8A5A3E"/></g>`;
for (let k = 0; k < 11; k++) { const a = k * 0.571 + .2, r = k % 2 ? 58 : 70; s += `<g filter="url(#claySm)"><ellipse cx="${18 + Math.cos(a) * r * .55}" cy="${640 + Math.sin(a) * r * .55}" rx="${r * .5}" ry="16" transform="rotate(${a * 180 / Math.PI} ${18 + Math.cos(a) * r * .55} ${640 + Math.sin(a) * r * .55})" fill="url(#gSage)"/></g>`; }
s += `<g filter="url(#claySm)"><circle cx="18" cy="640" r="22" fill="#B9CFA5"/></g>`;
// top: a welcome card and the lanyard with the new badge
s += `<g transform="rotate(5 1120 120)" filter="url(#clay)"><rect x="1010" y="30" width="230" height="170" rx="18" fill="url(#gCream)"/><path d="M1125 92 c-14 -26 -52 -10 -34 18 l34 32 l34 -32 c18 -28 -20 -44 -34 -18 z" fill="url(#gTerra)"/><rect x="1060" y="160" width="130" height="12" rx="6" fill="#E9D7B8"/></g>`;
s += `<g filter="url(#clay)"><path d="M1488 -60 C1472 70 1500 160 1546 236" stroke="#9EB78C" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M1716 -60 C1712 60 1650 160 1600 236" stroke="#8FAA7E" stroke-width="30" fill="none" stroke-linecap="round"/><rect x="1540" y="222" width="62" height="48" rx="14" fill="url(#gButter)"/></g>`;
s += `<g transform="rotate(-9 1574 420)" filter="url(#clay)">
  <rect x="1454" y="262" width="240" height="300" rx="32" fill="url(#gCream)"/>
  <path d="M1454 294 a32 32 0 0 1 32 -32 h176 a32 32 0 0 1 32 32 v50 h-240 z" fill="url(#gTerra)"/>
  <circle cx="1574" cy="420" r="54" fill="url(#gPeach)"/><circle cx="1574" cy="402" r="22" fill="#FBEBDD"/><path d="M1536 456 q38 -44 76 0 z" fill="#FBEBDD"/>
  <rect x="1504" y="496" width="140" height="18" rx="9" fill="url(#gButter)"/><rect x="1522" y="526" width="104" height="12" rx="6" fill="#E5D6BC"/>
</g>`;
// right edge: the new laptop, open, seen from above
s += `<g transform="rotate(7 1760 690)" filter="url(#clay)">
  <rect x="1566" y="420" width="470" height="56" rx="14" fill="#C9BBA3"/>
  <rect x="1556" y="470" width="490" height="350" rx="30" fill="url(#gBase)"/>
</g>`;
let keys = '';
for (let r = 0; r < 4; r++) for (let c = 0; c < 9; c++) keys += `<rect x="${1590 + c * 46}" y="${498 + r * 42}" width="38" height="32" rx="8" fill="#F8F1E3"/>`;
s += `<g transform="rotate(7 1760 690)">${keys}<rect x="1690" y="690" width="200" height="104" rx="16" fill="#EAE0CC"/></g>`;
s += `<g transform="rotate(-24 1380 610)" filter="url(#claySm)"><rect x="1240" y="598" width="290" height="24" rx="12" fill="url(#gSage)"/><path d="M1530 598 l34 12 l-34 12 z" fill="#E9D7B8"/><rect x="1240" y="598" width="40" height="24" rx="10" fill="#C2624A"/></g>`;
// bottom: sticky notes, the mug, a notebook and pencil, all cut by the edge
s += `<g transform="rotate(-8 900 990)" filter="url(#clay)"><rect x="820" y="910" width="160" height="160" rx="16" fill="url(#gButter)"/><path d="M862 990 q38 34 76 0" stroke="#C88F43" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="872" cy="962" r="7" fill="#C88F43"/><circle cx="928" cy="962" r="7" fill="#C88F43"/></g>`;
s += `<g transform="rotate(10 1060 1040)" filter="url(#clay)"><rect x="990" y="968" width="150" height="150" rx="16" fill="url(#gPeach)"/><path d="M1024 1010 h84 M1024 1040 h60" stroke="#C2624A" stroke-width="8" stroke-linecap="round"/></g>`;
s += `<g filter="url(#clay)"><rect x="1374" y="924" width="96" height="42" rx="21" fill="url(#gTerra)"/><circle cx="1310" cy="958" r="94" fill="url(#gTerra)"/><circle cx="1310" cy="958" r="74" fill="#6E4632"/><circle cx="1310" cy="958" r="58" fill="#8A5A3E"/><ellipse cx="1290" cy="940" rx="20" ry="10" fill="#B58560" opacity=".7"/></g>`;
s += `<g opacity=".55" filter="url(#soft)"><path d="M1296 930 c-24 -34 24 -52 0 -90" stroke="#FFFDF7" stroke-width="14" stroke-linecap="round" fill="none"/></g>`;
s += `<g transform="rotate(-6 200 1040)" filter="url(#clay)"><rect x="-90" y="930" width="470" height="300" rx="26" fill="url(#gSage)"/><rect x="-90" y="930" width="48" height="300" fill="#93AE83"/><rect x="330" y="930" width="22" height="300" fill="url(#gTerra)"/></g>`;
s += `<g transform="rotate(-14 560 990)" filter="url(#claySm)"><rect x="420" y="980" width="300" height="24" rx="12" fill="url(#gButter)"/><path d="M720 980 l40 12 l-40 12 z" fill="#F1D6B3"/><path d="M748 988 l12 4 l-12 4 z" fill="#5E4F45"/><rect x="420" y="980" width="34" height="24" rx="8" fill="#E99F80"/></g>`;
document.getElementById('objs').innerHTML = s;
document.querySelectorAll('svg.badge').forEach(el => { const [f, i] = el.dataset.t.split('|'); el.innerHTML = token(f, i); });
</script>
</body>
</html>
