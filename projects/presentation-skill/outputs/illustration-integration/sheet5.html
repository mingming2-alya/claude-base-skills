<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景：十五種畫風的淺、深兩種底</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#F2EFE8;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:44px 40px 48px}
  h1{font:900 40px/1.2 "Noto Sans TC";letter-spacing:.04em}
  p.sub{margin-top:10px;font:400 22px/1.5 "Noto Sans TC";color:#57534D}
  .grid{margin-top:30px;display:grid;grid-template-columns:repeat(5,1fr);gap:34px 24px}
  figure h3{font:700 23px/1.3 "Noto Sans TC";margin-bottom:8px}
  figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}
  p.tag{margin:4px 0 8px;font:700 17px/1.2 "Noto Sans TC";color:#57534D}
  p.tag i{font-style:normal;color:#8A5A22}
  figcaption{font:400 18px/1.4 "Noto Sans TC";color:#57534D}
</style>
</head>
<body>
  <h1>插畫場景：十五種畫風的淺、深兩種底</h1>
  <p class="sub">版面不動，只換明暗。變暗不等於夜晚：只換光線，或用材質本身的深色款；月亮星星跟著內容走。B 版面寫字的載體跟著變深。每格上淺下深。</p>
  <div class="grid">
    <figure><h3>紙黏土</h3>
      <img src="img/C-scene.jpg" alt=""><p class="tag">淺</p>
      <img src="img/C-scene-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：拉上百葉窗、關掉大燈，只留檯燈與螢幕</figcaption></figure>
    <figure><h3>手繪</h3>
      <img src="img/hand-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/hand-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：深色紙上的白色墨線</figcaption></figure>
    <figure><h3>霓虹</h3>
      <img src="img/neon-C-light.jpg" alt=""><p class="tag">淺　<i>新補</i></p>
      <img src="img/neon-C.jpg" alt=""><p class="tag">深</p>
      <figcaption>淺：店裡燈全開的白漆磚牆，燈管照樣亮</figcaption></figure>
    <figure><h3>01 復古卡通</h3>
      <img src="img/retro-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/retro-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：放映廳暗下來；尾牙在晚上，畫了彎月</figcaption></figure>
    <figure><h3>02 兒童手繪</h3>
      <img src="img/crayon-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/crayon-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：蠟筆畫在黑色圖畫紙上</figcaption></figure>
    <figure><h3>03 素描</h3>
      <img src="img/sketch-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/sketch-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：深灰色紙，白鉛筆描線、炭筆排影</figcaption></figure>
    <figure><h3>04 山洞岩畫</h3>
      <img src="img/cave-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/cave-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：火把照亮的洞穴，白黏土取代炭黑</figcaption></figure>
    <figure><h3>05 埃及壁畫</h3>
      <img src="img/egypt-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/egypt-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：墓室天頂的深藍，不畫星紋</figcaption></figure>
    <figure><h3>06 漢畫像石拓片</h3>
      <img src="img/han-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/han-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：烏金拓，人物凹刻成灰白剪影</figcaption></figure>
    <figure><h3>07 瑪雅抄本</h3>
      <img src="img/maya-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/maya-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：沒上石灰的深色樹皮紙，石灰白勾線</figcaption></figure>
    <figure><h3>08 皮影戲</h3>
      <img src="img/shadow-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/shadow-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：一盞油燈，只照亮戲偶那一帶</figcaption></figure>
    <figure><h3>09 浮世繪</h3>
      <img src="img/ukiyoe-B.jpg" alt=""><p class="tag">淺</p>
      <img src="img/ukiyoe-B-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：藍摺絵，題箋墨地、字白抜き</figcaption></figure>
    <figure><h3>10 梵谷筆觸</h3>
      <img src="img/vangogh-B-light.jpg" alt=""><p class="tag">淺　<i>新補</i></p>
      <img src="img/vangogh-B.jpg" alt=""><p class="tag">深　<i>重畫</i></p>
      <figcaption>兩種都是白天：晴天麥田；深鈷藍天空（重畫）</figcaption></figure>
    <figure><h3>11 吶喊</h3>
      <img src="img/scream-B.jpg" alt=""><p class="tag">淺</p>
      <img src="img/scream-B-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：光線沉下去的峽灣，深色木牌</figcaption></figure>
    <figure><h3>12 8bit 像素</h3>
      <img src="img/pixel-C.jpg" alt=""><p class="tag">淺</p>
      <img src="img/pixel-C-dark.jpg" alt=""><p class="tag">深　<i>新補</i></p>
      <figcaption>深：地下關卡，老 RPG 的深藍視窗</figcaption></figure>
  </div>
</body>
</html>
