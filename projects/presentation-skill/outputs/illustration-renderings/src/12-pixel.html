<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景（8bit 像素）｜資安闖關地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=block">
<link rel="stylesheet" href="base.css">
<style>
  :root{--bg:#D9E9EE;--ink:#1D2730;--ink2:#2E3B46;--sub:#4C5B68;--accent:#1F5C99}
  svg rect{shape-rendering:crispEdges}
  ul.items.four li{grid-template-columns:88px 1fr}
  ul.items.four .badge{width:88px;height:88px}
  .talk{position:absolute;left:974px;top:697px;font:700 30px/1 "Noto Sans TC";color:#1D2730;letter-spacing:.06em}
</style>
</head>
<body>
<div class="slide">
  <svg class="scene" id="scene" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <nav aria-label="章節"><span>為什麼要考</span><b>四個關卡</b><span>過關之後</span><span>求助管道</span></nav>
  <div class="copy">
    <h2>資安闖關地圖</h2>
    <p class="key">四關都過，才拿得到<em>正式帳號</em>。</p>
  </div>
  <ul class="items four">
    <li><svg class="badge" viewBox="0 0 88 88" data-n="1" data-c="#F2B84B" aria-hidden="true"></svg><div><strong>認出釣魚信</strong><span>寄件人和連結，先看再點</span></div></li>
    <li><svg class="badge" viewBox="0 0 88 88" data-n="2" data-c="#86CFA3" aria-hidden="true"></svg><div><strong>開啟雙重驗證</strong><span>密碼外洩也登不進去</span></div></li>
    <li><svg class="badge" viewBox="0 0 88 88" data-n="3" data-c="#93C7EA" aria-hidden="true"></svg><div><strong>密碼交給管理器</strong><span>每個系統一組，不用背</span></div></li>
    <li><svg class="badge" viewBox="0 0 88 88" data-n="4" data-c="#F3957A" aria-hidden="true"></svg><div><strong>回報可疑狀況</strong><span>一鍵通知資安小組</span></div></li>
  </ul>
  <div class="talk">出發吧！</div>
</div>
<script>
// Everything is drawn on an 8px (or 6px) pixel grid from small sprite maps.
let seed = 7;
const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t ^= t + Math.imul(t ^ t >>> 7, 61 | t); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;
function px(x, y, s, rows, pal) {
  let out = '';
  rows.forEach((row, j) => {
    let i = 0;
    while (i < row.length) {
      const ch = row[i];
      if (!pal[ch]) { i++; continue; }
      let k = i; while (k < row.length && row[k] === ch) k++;
      out += R(x + i * s, y + j * s, (k - i) * s, s, pal[ch]);
      i = k;
    }
  });
  return out;
}
const DIG = {
  1: ['..#..', '.##..', '..#..', '..#..', '..#..', '..#..', '.###.'],
  2: ['.###.', '#...#', '....#', '...#.', '..#..', '.#...', '#####'],
  3: ['####.', '....#', '....#', '.###.', '....#', '....#', '####.'],
  4: ['...#.', '..##.', '.#.#.', '#..#.', '#####', '...#.', '...#.'],
};
const D = '#2B2F36';
let g = '<defs><pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#0E2030" opacity=".035"/></pattern></defs>';

// far and near hills: low under the text, rising toward the goal
function ridge(color, amp, f, ph) {
  let out = '';
  for (let x = 0; x < 1920; x += 16) {
    const env = 0.06 + 0.94 * Math.pow(x / 1920, 1.6);
    const h = Math.max(16, Math.round(amp * env * (0.72 + 0.28 * Math.sin(x * f + ph)) / 16) * 16);
    out += R(x, 930 - h, 16, h, color);
  }
  return out;
}
g += ridge('#C5DFD7', 430, 0.006, 1.3);
g += ridge('#ABD2BF', 270, 0.011, 4.1);

// clouds
const cloud = ['.....WWWW.......', '...WWWWWWWW.....', '..WWWWWWWWWWWW..', '.WWWWWWWWWWWWWW.', 'WWWWWWWWWWWWWWWW', '.SSSSSSSSSSSSSS.'];
[[1160, 128, 10], [1520, 236, 8], [1716, 92, 9]].forEach(([x, y, s]) => g += px(x, y, s, cloud, { W: '#F5F9F7', S: '#C3DBE4' }));

// ground: grass edge, dirt, speckles, flowers
g += R(0, 930, 1920, 150, '#C99A5B') + R(0, 930, 1920, 16, '#6DB36A') + R(0, 946, 1920, 8, '#4F9A55');
for (let x = 0; x < 1920; x += 40) g += R(x + 8, 922, 8, 8, '#6DB36A');
for (let i = 0; i < 240; i++) g += R(Math.floor(rand() * 240) * 8, 966 + Math.floor(rand() * 13) * 8, 8, 8, rand() < .5 ? '#B3854A' : '#D8AD6F');
const flower = ['.P.', 'PYP', '.P.', '.G.'];
[[180, 898], [420, 898], [610, 898], [760, 898]].forEach(([x, y], i) => g += px(x, y, 8, flower, { P: i % 2 ? '#F3957A' : '#F5F9F7', Y: '#F2B84B', G: '#4F9A55' }));

// signpost pointing at the first level
g += px(808, 858, 8, ['DDDDDDDD..', 'DWWWWWWWD.', 'DWWWWDWWWD', 'DWDDDDDWWD', 'DWWWWDWWWD', 'DDDDDDDD..', '...DD.....', '...DD.....', '...DD.....'], { D: '#6B4A2B', W: '#E2B877' });

// stone stairs: one platform per level
const stone = { L: '#E4DACB', F: '#C6BBAA', Dk: '#8F8371' };
const block = ['LLLLLK', 'LFFFFK', 'LFFFFK', 'LFFFFK', 'LFFFFK', 'KKKKKK'];
const plats = [[1104, 834], [1296, 738], [1488, 642], [1680, 546]];
plats.forEach(([x, top], n) => {
  for (let y = top; y < 930; y += 48) for (let b = 0; b < 3; b++) g += px(x + b * 48, y, 8, block, { L: stone.L, F: stone.F, K: stone.Dk });
  g += R(x - 4, top - 8, 152, 16, '#6DB36A') + R(x - 4, top + 8, 152, 6, '#4F9A55') + R(x + 12, top - 16, 8, 8, '#6DB36A') + R(x + 100, top - 16, 8, 8, '#6DB36A');
  g += R(x + 44, top + 22, 56, 72, '#3A3128') + R(x + 48, top + 26, 48, 64, '#F3EBDD');
  g += px(x + 52, top + 30, 8, DIG[n + 1], { '#': '#3A3128' });
});

// level 1: a letter on a fishing hook
const env = ['DDDDDDDDDDDDDD', 'DWWWWWWWWWWWWD', 'DFWWWWWWWWWWFD', 'DWFWWWWWWWWFWD', 'DWWFWWWWWWFWWD', 'DWWWFFWWFFWWWD', 'DWWWWWFFWWWWWD', 'DWWWWWWWWWWWWD', 'DWWWWWWWWWWWWD', 'DDDDDDDDDDDDDD'];
g += R(1179, 600, 6, 84, '#6B7480') + px(1161, 672, 6, ['...L', 'L..L', 'L..L', '.LL.'], { L: '#6B7480' });
g += px(1134, 700, 6, env, { D, W: '#FFFDF6', F: '#9AA3AD' });
g += px(1200, 684, 6, ['.RRR.', 'RRWRR', 'RRWRR', 'RRRRR', 'RRWRR', '.RRR.'], { R: '#E0453A', W: '#FFFDF6' });

// level 2: a phone that confirms the sign-in
const phone = ['DDDDDDDD', 'DSSSSSSD', 'DSSSSSSD', 'DSSSSSGD', 'DSSSSGSD', 'DGSSGSSD', 'DSGGSSSD', 'DSSSSSSD', 'DSSSSSSD', 'DSSSSSSD', 'DDDDDDDD', 'DDDBBDDD', 'DDDDDDDD'];
g += px(1344, 612, 6, phone, { D, S: '#A8DDF0', G: '#2E9D5B', B: '#6B7480' });

// level 3: a padlock
const lock = ['...AAAA...', '..A....A..', '.A......A.', '.A......A.', '.A......A.', 'DDDDDDDDDD', 'DYYYYYYYYD', 'DYYYDDYYYD', 'DYYYDDYYYD', 'DYYYYDYYYD', 'DYYYYYYYYD', 'DDDDDDDDDD'];
g += px(1530, 522, 6, lock, { A: '#8D99A6', D, Y: '#F2B84B' });

// level 4: an alarm bell, and the treasure: the real account
const bell = ['....DD....', '...DYYD...', '..DYYYYD..', '..DYYYYD..', '..DYYYYD..', '.DYYYYYYD.', '.DYYYYYYD.', 'DYYYYYYYYD', 'DDDDDDDDDD', '....DD....'];
g += px(1688, 404, 6, bell, { D, Y: '#F2C14E' }) + px(1664, 422, 6, ['D.', '.D', 'D.'], { D }) + px(1760, 422, 6, ['.D', 'D.', '.D'], { D });
const chest = ['.DDDDDDDDDD.', 'DBBBBBBBBBBD', 'DBBBBBBBBBBD', 'DDDDDGGDDDDD', 'DBBBBGGBBBBD', 'DBBBBBBBBBBD', 'DBBBBBBBBBBD', 'DBBBBBBBBBBD', 'DDDDDDDDDDDD'];
g += px(1748, 492, 6, chest, { D, B: '#A0602F', G: '#F2C14E' });
const spark = ['.Y.', 'YYY', '.Y.'];
[[1734, 462], [1826, 470], [1792, 438]].forEach(([x, y]) => g += px(x, y, 6, spark, { Y: '#F2C14E' }));

// coins over the gaps
const coin = ['..YY..', '.YLLY.', 'YLYYOY', 'YLYYOY', 'YLYYOY', 'YLYYOY', '.YOOY.', '..YY..'];
[[1257, 700], [1449, 604], [1641, 508]].forEach(([x, y]) => g += px(x, y, 5, coin, { Y: '#F2B84B', L: '#FFE6A0', O: '#C98A2B' }));

// a pine at the edge
const pine = ['.....GG.....', '....GGGG....', '...GGHGGG...', '....GGGG....', '..GGGGHGGG..', '.GGHGGGGGGG.', '...GGGGGG...', '..GGGGGHGGG.', '.GGGGGGGGGGG', 'GGGHGGGGGGGG', '.....TT.....', '.....TT.....', '.....TT.....'];
g += px(1832, 826, 8, pine, { G: '#3F8A57', H: '#62AE6E', T: '#7A5232' });

// the hero, shield up
const hero = ['....HHHH....', '...HHHHHH...', '...HSSSSH...', '...SESSES...', '...SSSSSS...', '....SSSS....', '..TTTTTTTT..', '.STTTTTTTTSA', '.STTTTTTTAAA', '..TTTTTTTAKA', '..TTTTTTTAAA', '...BBBBBB...', '...PP..PP...', '...PP..PP...', '..OOO..OOO..', '..OOO..OOO..'];
g += px(930, 802, 8, hero, { H: '#4A3424', S: '#F2C29B', E: D, T: '#2F8F8A', A: '#C9D3DC', K: D, B: '#7A5232', P: '#33465A', O: '#4A3424' });

// signature frame: the pixel dialog box with the hero's hearts
function pbox(x, y, w, h) {
  return R(x + 6, y, w - 12, 6, D) + R(x + 6, y + h - 6, w - 12, 6, D) + R(x, y + 6, 6, h - 12, D) + R(x + w - 6, y + 6, 6, h - 12, D) + R(x + 6, y + 6, w - 12, h - 12, '#FFFDF6');
}
g += pbox(836, 680, 280, 72);
g += R(966, 746, 30, 6, '#FFFDF6') + R(960, 746, 6, 6, D) + R(996, 746, 6, 6, D) + R(966, 752, 6, 6, D) + R(972, 752, 18, 6, '#FFFDF6') + R(990, 752, 6, 6, D) + R(972, 758, 6, 6, D) + R(978, 758, 6, 6, '#FFFDF6') + R(984, 758, 6, 6, D) + R(978, 764, 6, 6, D);
const heart = ['.HH.HH.', 'HHHHHHH', 'HHHHHHH', '.HHHHH.', '..HHH..', '...H...'];
[0, 1, 2].forEach(i => g += px(858 + i * 34, 704, 4, heart, { H: '#E0453A' }));
g += px(1090, 732, 4, ['DDD', '.D.'], { D });

g += '<rect width="1920" height="1080" fill="url(#scan)"/>';
document.getElementById('scene').innerHTML = g;

// list badges: numbered blocks
document.querySelectorAll('svg.badge').forEach(el => {
  const c = el.dataset.c, n = el.dataset.n;
  const tile = ['.DDDDDDDDD.', 'DLLLLLLLLLD', 'DLFFFFFFFSD', 'DLFFFFFFFSD', 'DLFFFFFFFSD', 'DLFFFFFFFSD', 'DLFFFFFFFSD', 'DLFFFFFFFSD', 'DLFFFFFFFSD', 'DSSSSSSSSSD', '.DDDDDDDDD.'];
  el.innerHTML = px(0, 0, 8, tile, { D, L: '#FFF6E2', F: c, S: 'rgba(0,0,0,.18)' }) + px(24, 16, 8, DIG[n], { '#': D });
});
</script>
</body>
</html>
