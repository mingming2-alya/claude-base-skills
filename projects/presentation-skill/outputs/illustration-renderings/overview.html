<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景十五種畫風｜總覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#F2EFE8;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:44px 40px 48px}
  h1{font:900 40px/1.2 "Noto Sans TC";letter-spacing:.04em}
  p.sub{margin-top:10px;font:400 22px/1.5 "Noto Sans TC";color:#57534D}
  .grid{margin-top:30px;display:grid;grid-template-columns:repeat(5,1fr);gap:28px 24px}
  figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}
  figcaption{margin-top:10px;font:700 21px/1.3 "Noto Sans TC"}
  figcaption span{display:block;margin-top:4px;font-weight:400;font-size:18px;color:#57534D}
  figcaption i{font-style:normal;color:#8A5A22;font-weight:700}
</style>
</head>
<body>
  <h1>插畫場景：十五種畫風</h1>
  <p class="sub">文字層（字體、字級、版面）全部共用；每種畫風換畫法、底紋、配色與一個招牌框飾。前三張是 v5 已有的畫風，後十二張是新增，題材各自挑選。</p>
  <div class="grid">
    <figure><img src="../style-moodboard-v5/img/01a-illustration-clay.jpg" alt=""><figcaption>紙黏土<span>新人報到第一週｜已有</span></figcaption></figure>
    <figure><img src="../style-moodboard-v5/img/01b-illustration-hand.jpg" alt=""><figcaption>手繪<span>新人報到第一週｜已有</span></figcaption></figure>
    <figure><img src="../style-moodboard-v5/img/01c-illustration-neon.jpg" alt=""><figcaption>霓虹<span>新人報到第一週｜已有</span></figcaption></figure>
    <figure><img src="img/01-retro-cartoon.jpg" alt=""><figcaption>01 復古卡通<span>尾牙當天流程｜步驟</span></figcaption></figure>
    <figure><img src="img/02-crayon.jpg" alt=""><figcaption>02 兒童手繪<span>家庭日一日行程｜條列</span></figcaption></figure>
    <figure><img src="img/03-sketch.jpg" alt=""><figcaption>03 素描<span>新品設計構想｜圖文標註</span></figcaption></figure>
    <figure><img src="img/04-cave.jpg" alt=""><figcaption>04 山洞岩畫<span>團隊分工的四種角色｜條列</span></figcaption></figure>
    <figure><img src="img/05-egypt.jpg" alt=""><figcaption>05 埃及壁畫 <i>建議生圖</i><span>金字塔怎麼蓋｜步驟</span></figcaption></figure>
    <figure><img src="img/06-han-rubbing.jpg" alt=""><figcaption>06 漢畫像石拓片<span>絲路上的物流｜步驟</span></figcaption></figure>
    <figure><img src="img/07-maya.jpg" alt=""><figcaption>07 瑪雅抄本 <i>建議生圖</i><span>年度行事曆｜時間軸</span></figcaption></figure>
    <figure><img src="img/08-shadow-puppet.jpg" alt=""><figcaption>08 皮影戲<span>說好一個故事的三幕｜步驟</span></figcaption></figure>
    <figure><img src="img/09-ukiyoe.jpg" alt=""><figcaption>09 浮世繪<span>東京展會參展準備｜條列</span></figcaption></figure>
    <figure><img src="img/10-vangogh.jpg" alt=""><figcaption>10 梵谷筆觸<span>創意工作坊｜條列</span></figcaption></figure>
    <figure><img src="img/11-scream.jpg" alt=""><figcaption>11 吶喊<span>職場壓力的五個訊號｜條列</span></figcaption></figure>
    <figure><img src="img/12-pixel.jpg" alt=""><figcaption>12 8bit 像素<span>資安闖關地圖｜關卡地圖</span></figcaption></figure>
  </div>
</body>
</html>
