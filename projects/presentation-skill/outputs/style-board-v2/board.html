<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>風格樣張板 v2</title>
<style>
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:#F5F3EC;color:#222C2B;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif}
main{max-width:1664px;margin:auto;padding:clamp(18px,3vw,50px)}
header{border-bottom:1px solid #B8BDB3;padding:0 0 18px;margin-bottom:24px}
h1{font-family:Georgia,"Noto Serif TC","Noto Serif CJK TC",serif;font-size:clamp(27px,3vw,44px);line-height:1.2;margin:0 0 9px}
header p{margin:0;color:#465450;font-size:15px;line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 24px}
.tile{min-width:0;align-self:start;margin:0;scroll-margin:16px}
.tile:target{grid-column:1/-1}
.viewport{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#F5F3EC}
.stage{position:absolute;top:0;left:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;color-scheme:light}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 1px 0}
.caption-title{display:flex;align-items:baseline;gap:8px}
.caption-title b{font:600 13px/1.2 ui-monospace,monospace;color:#58655C}
figcaption strong{font-size:18px;line-height:1.4}
figcaption code{font-size:12px;color:#58655C}
.caption-text{margin:3px 0 0;font-size:13px;color:#465450;line-height:1.5}
.controls,.swatches{display:flex;align-items:center;gap:4px}
.swatches i{width:12px;height:12px;border-radius:50%;border:1px solid #28322C30}
.controls a{margin-left:8px;color:#304C46;font-size:13px;text-underline-offset:3px;white-space:nowrap}
.controls a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.collapse,.tile:target .expand{display:none}.tile:target .collapse{display:inline}
@media(max-width:900px){.grid{grid-template-columns:1fr}.controls{gap:2px}.tile{scroll-margin:8px}}
@media(max-width:520px){main{padding:16px 8px}.grid{gap:22px}figcaption strong{font-size:16px}.swatches i{width:9px;height:9px}.caption-text{font-size:12px}}
/* Reference canvas: 960 × 540. make_board.py converts the same rules to
   container-width units for the gallery and embeds these pixel rules for print. */
.stage {
  --sans: "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  --serif: "Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --latin: "Helvetica Neue",Arial,"Liberation Sans",sans-serif;
  --mono: "IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font: 400 16px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
.stage h3,.stage h4,.stage p,.stage ol {margin:0}
.stage em,.stage i {font-style:normal}
.stage h3 {font:800 50px/1.23 var(--sans);letter-spacing:-1px}
.stage h3 em {white-space:nowrap}
.stage .stat b {display:block;font:700 50px/1.16 var(--latin);white-space:nowrap;letter-spacing:-2px}
.stage .stat span {display:block;margin-top:3px;font:500 14px/1.45 var(--sans)}
.stage .actions {padding:0;list-style:none}
.stage .actions li {display:flex;align-items:center;gap:13px}
.stage .actions i {font:600 13px/1.25 var(--mono);flex:none}
.stage .actions span {font:600 19px/1.4 var(--sans);white-space:nowrap}
.stage .vertical {display:block;text-align:center}
.stage .vertical > span {display:block}

/* 01 — facing columns, an ink-red data panel and a ruled editorial ledger. */
.t-editorial {background:#F4E8D8;color:#39292A}
.ed-top {position:absolute;left:42px;right:42px;top:31px;display:flex;justify-content:space-between;
  border-top:3px solid #562E29;border-bottom:1px solid #9D7D62;padding:9px 0;color:#682F2A;font:700 14px/1.4 var(--serif)}
.ed-lead {position:absolute;left:49px;top:104px;width:510px}
.ed-lead h3 {font:800 58px/1.31 var(--serif)}
.ed-lead em {color:#913526}
.ed-data {position:absolute;left:603px;top:100px;width:314px;height:383px;padding:27px 30px;
  background:#913526;color:#FFF5E2;border-left:8px solid #D4A16B}
.ed-data .stat {padding:17px 0 22px}
.ed-data .stat + .stat {border-top:1px solid #D7A592}
.ed-data .stat b {font:700 66px/1.16 Georgia,var(--serif);letter-spacing:-3px}
.ed-data .stat span {color:#FFEFDF}
.ed-ledger {position:absolute;left:49px;top:318px;width:496px}
.ed-ledger li {padding:9px 0;border-top:1px solid #BB9F84}
.ed-ledger li:last-child {border-bottom:1px solid #BB9F84}
.ed-ledger i {color:#913526}

/* 02 — a cobalt index, the proposition and an independent band for actions. */
.t-swiss {background:#F3F6FB;color:#132846}
.sw-side {position:absolute;inset:0 auto 0 0;width:205px;background:#244FC9;color:white;padding:44px 24px}
.sw-side p {width:146px;font:700 30px/1.25 var(--sans)}
.sw-side strong {position:absolute;left:22px;bottom:88px;font:400 109px/1 var(--latin);letter-spacing:-6px}
.sw-side>span {position:absolute;left:29px;bottom:64px;font:500 15px/1.4 var(--sans)}
.sw-key {position:absolute;left:250px;top:54px;width:655px}
.sw-key h3 {font:400 64px/1.18 var(--sans);letter-spacing:-2px}
.sw-key em {font-weight:900;color:#244FC9}
.sw-steps {position:absolute;left:205px;right:0;top:269px;height:108px;background:#172D51;color:#FFF}
.sw-steps .actions {position:absolute;left:43px;right:37px;top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.sw-steps .actions li {display:block;min-width:0}
.sw-steps i {display:block;color:#ADCAFF;margin-bottom:4px}
.sw-numbers {position:absolute;left:250px;right:44px;top:397px;display:grid;grid-template-columns:1fr 1fr;gap:36px}
.sw-numbers .stat {border-top:2px solid #244FC9;padding-top:9px}
.sw-numbers .stat b {font-size:45px}

/* 03 — the coloured cells carry the reading order without crossing a text cell. */
.t-geo {background:#FBF3D9;color:#192F43}
.ge-title {position:absolute;inset:0 auto auto 0;width:358px;height:208px;background:#087E71;color:#FFF8DC;
  padding:37px 30px;font:800 41px/1.25 var(--sans)}
.ge-shape {position:absolute;left:358px;top:0;width:200px;height:208px;background:#D96749;overflow:hidden}
.ge-shape i {position:absolute;width:202px;height:202px;left:57px;top:67px;background:#E6AF40;border-radius:50%}
.ge-pct {position:absolute;left:588px;top:23px;width:335px}
.ge-pct .stat b {font-size:92px;color:#243F69}
.ge-pct .stat span {font-size:16px}
.ge-disc,.ge-triangle {position:absolute;top:208px;width:179px;height:139px;overflow:hidden}
.ge-disc {left:0;background:#E6AF40}
.ge-disc i {position:absolute;top:22px;left:42px;width:95px;height:95px;border-radius:50%;background:#FFF6DB}
.ge-triangle {left:179px;background:#94C3AE}
.ge-triangle i {position:absolute;left:51px;top:33px;width:0;height:0;border-left:39px solid transparent;border-right:39px solid transparent;border-bottom:71px solid #087E71}
.ge-count {position:absolute;left:0;bottom:0;width:358px;height:193px;background:#243F69;color:#FFF7DF;padding:22px 30px}
.ge-count .stat b {font-size:68px}
.ge-key {position:absolute;left:388px;top:220px;width:535px}
.ge-key h3 {font-size:58px;line-height:1.2}
.ge-key em {color:#9F3628}
.ge-steps {position:absolute;left:389px;right:34px;top:422px}
.ge-steps ol {display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.ge-steps .actions li {display:block;border-top:2px solid #243F69;padding-top:11px}
.ge-steps i {display:block;color:#087064;margin-bottom:4px}
.ge-steps .actions span {font-size:17px}

/* 04 — poster headline and an orange column large enough to carry the data. */
.t-broadsheet {background:#292321;color:#FBEBD5}
.br-title {position:absolute;left:47px;top:38px;border-top:4px solid #ED774D;width:530px;padding-top:12px;
  color:#FBE2C5;font:600 16px/1.4 var(--sans)}
.br-lead {position:absolute;left:44px;bottom:37px;width:528px}
.br-lead h3 {font:900 76px/1.15 var(--sans);letter-spacing:-3px}
.br-lead em {color:#F78960}
.br-column {position:absolute;inset:0 0 0 auto;width:308px;padding:33px 31px;background:#ED774D;color:#30201B}
.br-column .stat {border-top:2px solid #4E2C22;padding:12px 0 19px}
.br-column .stat b {font:800 64px/1.12 var(--latin);letter-spacing:-3px}
.br-column .stat span {font-size:15px}
.br-actions {margin-top:8px;border-top:2px solid #4E2C22;padding-top:11px}
.br-actions li {margin:8px 0}
.br-actions .actions span {font-size:18px}

/* 05 — light, a chapter inscription and three distinct content regions. */
.t-midnight {background-color:#132E43;color:#F4EFDE;background-image:
  radial-gradient(ellipse at 17% 74%,#347473 0%,#204953 25%,transparent 56%),
  radial-gradient(ellipse at 70% 0%,#243954 0%,#112637 76%)}
.mi-frame {position:absolute;inset:20px;border:1px solid #AB9970}
.mi-art {position:absolute;left:22px;bottom:22px;width:292px;height:306px;overflow:hidden}
.mi-art i,.mi-art b {position:absolute;display:block;border:1px solid #AAC0A1;border-radius:50%;opacity:.55}
.mi-art i {width:358px;height:163px;bottom:-61px;left:-49px}
.mi-art b {width:302px;height:128px;bottom:-50px;left:-21px}
.mi-chapter {position:absolute;left:78px;top:91px;color:#E2BE75;font:600 47px/1.32 var(--serif)}
.mi-lead {position:absolute;left:340px;top:73px;width:548px}
.mi-lead p {color:#E1C488;font:500 15px/1.45 var(--serif);margin-bottom:16px}
.mi-lead h3 {font:700 51px/1.3 var(--serif)}
.mi-lead em {color:#E7C177}
.mi-data {position:absolute;left:340px;top:286px;width:540px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mi-data .stat {padding-top:10px;border-top:1px solid #968762}
.mi-data .stat b {font:600 44px/1.18 Georgia,var(--serif);color:#F5EAD2}
.mi-data .stat span {color:#D8E2DD;font-size:13px}
.mi-steps {position:absolute;left:340px;right:74px;top:429px}
.mi-steps ol {display:flex;justify-content:space-between;gap:10px;border-top:1px solid #8C8066;padding-top:12px}
.mi-steps .actions li {gap:7px}.mi-steps i {color:#E2BE75}.mi-steps .actions span {font-weight:500;font-size:15px}

/* 06 — artwork lives inside the right-hand scene. The CSS still life is complete
   on its own; supplied art is clipped to the same region, away from the text. */
.t-clay {color:#49382D;background-color:#F6CBB7;background-image:
  radial-gradient(ellipse at 10% 5%,#FFF3D9 2%,transparent 59%),
  radial-gradient(ellipse at 85% 85%,#EFB4B3 0%,transparent 62%)}
.cl-lead {position:absolute;left:39px;top:62px;width:425px}
.cl-lead p {color:#74503C;font-weight:700;margin-bottom:23px}
.cl-lead h3 {font-size:50px;line-height:1.25}
.cl-lead em {color:#9C4830}
.cl-data {position:absolute;left:40px;top:290px;width:422px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cl-data .stat {border-top:2px solid #C48C74;padding-top:11px}
.cl-data .stat b {font-size:45px}
.cl-data .stat span {font-size:12px;color:#664A38}
.cl-actions {position:absolute;left:39px;top:431px;width:425px}
.cl-actions ol {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cl-actions .actions li {justify-content:center;gap:5px;padding:8px 2px;border-radius:21px;background:#FFF3DC;color:#5B3C2C}
.cl-actions .actions i {font-size:11px;color:#93472D}
.cl-actions .actions span {font-size:14px}
.scene {position:absolute;left:497px;top:28px;width:439px;height:484px;border-radius:116px 116px 54px 54px;
  overflow:hidden;background:#E8B7AA;background-image:radial-gradient(ellipse at 25% 16%,#FFF0D5 2%,#F0CCB5 39%,#CDA79F 100%)}
.still-life,.scene-photo {position:absolute;inset:0;width:100%;height:100%}
.scene-photo {object-fit:contain}
.counter {position:absolute;left:-60px;top:294px;width:575px;height:260px;background:linear-gradient(170deg,#AED2C1,#80AA9E 58%,#688F86);border-radius:50% 38% 0 0}
.loyalty {position:absolute;left:222px;top:113px;width:140px;height:103px;transform:rotate(9deg);border-radius:15px;
  background:linear-gradient(140deg,#FFF1DC,#E9C4A1);border:2px solid #E3BC99;box-shadow:7px 12px 16px #7854422B}
.ticket-stripe {position:absolute;top:20px;left:0;right:0;height:14px;background:#CA8B76}
.ticket-dots {position:absolute;left:20px;bottom:19px;display:flex;gap:10px}
.ticket-dots i {display:block;width:17px;height:17px;border-radius:50%;background:#8BB6A6}
.ticket-dots i:last-child {background:#D9AE91}
.saucer {position:absolute;width:241px;height:57px;left:66px;top:328px;border-radius:50%;
  background:radial-gradient(ellipse at 44% 33%,#E7C0A4 36%,#FFE2C1 66%,#BA8F7E 93%);box-shadow:9px 15px 16px #405B543D}
.handle {position:absolute;left:208px;top:247px;width:80px;height:75px;border:13px solid #D08971;border-radius:45%;
  box-shadow:3px 5px 6px #6B695C38,inset 3px 2px 4px #5D74663B}
.cup {position:absolute;left:99px;top:231px;width:144px;height:119px;border-radius:14px 14px 52px 52px;
  background:linear-gradient(110deg,#F0B394 0%,#D68F78 57%,#BC7463 100%);box-shadow:5px 8px 10px #A475633B}
.cup i {position:absolute;left:0;top:-7px;width:144px;height:23px;border:5px solid #F2B69A;border-radius:50%;
  background:radial-gradient(ellipse at 42% 30%,#BD8A58,#82593C 76%)}
.edge-image {position:absolute;max-width:24%;height:auto;max-height:26%;object-fit:contain}
.edge-image.lower {left:0;bottom:0}.edge-image.upper {right:0;top:0}

/* 07 — printed folio, vertical title and a separate red seal. */
.t-scroll {color:#382C21;background:#EBD3AA;background-image:radial-gradient(ellipse at 68% 30%,#F8E9CB,transparent 70%)}
.sc-border {position:absolute;inset:22px;border:3px double #9A6A4D}
.sc-spine {position:absolute;left:27px;top:27px;bottom:27px;width:63px;background:#466055;color:#F7E7C7;
  padding-top:49px;font:600 22px/1.58 var(--serif)}
.sc-title {position:absolute;left:120px;top:57px;width:68px;font:700 34px/1.22 var(--serif)}
.sc-seal {position:absolute;left:131px;bottom:62px;border:2px solid #973E2B;color:#973E2B;padding:5px;font:700 17px/1.2 var(--serif)}
.sc-lead {position:absolute;left:236px;top:88px;width:377px}
.sc-lead h3 {font:700 49px/1.4 var(--serif)}
.sc-lead em {color:#973E2B}
.sc-data {position:absolute;left:660px;top:65px;width:220px;border-left:1px solid #B48B62;padding-left:24px}
.sc-data .stat {padding:9px 0 13px}
.sc-data .stat + .stat {border-top:1px solid #BF9777}
.sc-data .stat b {font:700 43px/1.2 Georgia,var(--serif);color:#843727}
.sc-data .stat span {font-size:13px}
.sc-actions {position:absolute;left:237px;top:326px;right:82px}
.sc-actions li {border-top:1px solid #B48B62;padding:7px 0}
.sc-actions li:last-child {border-bottom:1px solid #B48B62}
.sc-actions .actions i {font:600 15px/1.4 var(--serif);color:#8E3525}
.sc-actions .actions span {font:600 18px/1.4 var(--serif)}

/* 08 — a real part-to-whole chart. Its complement comes from the same example. */
.t-counsel {color:#193851;background:#EDF4F1}
.co-title {position:absolute;inset:0 0 auto;height:66px;padding:20px 44px;background:#193851;color:white;font:600 19px/1.45 var(--sans)}
.co-lead {position:absolute;left:44px;top:93px;width:862px}
.co-lead h3 {font-size:41px;line-height:1.3}
.co-lead em {color:#116A6C}
.co-exhibit {position:absolute;left:44px;top:184px;width:523px;height:272px;padding:23px 24px;background:#D6E8E7}
.co-side {position:absolute;left:604px;top:184px;width:307px}
.co-exhibit h4,.co-side h4 {font:700 19px/1.4 var(--sans)}
.co-readout {display:flex;align-items:baseline;gap:12px;margin-top:8px}
.co-readout strong {font:800 60px/1.16 var(--latin);letter-spacing:-2px;color:#0E6265}
.co-readout span {font:500 15px/1.45 var(--sans)}
.co-bar {height:19px;width:100%;margin:10px 0 8px;background:#A4BCBF}
.co-bar i {display:block;width:72%;height:100%;background:#147879}
.co-key {display:flex;gap:23px;font:500 13px/1.45 var(--sans)}
.co-key span {display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.co-key i {display:block;width:10px;height:10px;background:#147879}
.co-key span + span i {background:#A4BCBF}
.co-exhibit .co-sample {border-top:1px solid #A0B9BB;padding-top:9px;margin-top:13px;font:500 13px/1.45 var(--sans)}
.co-side ol {margin-top:14px}
.co-side li {padding:13px 0;border-top:1px solid #9DB6B3}
.co-side i {color:#116A6C}
.co-source {position:absolute;left:45px;bottom:36px;color:#485F64;font:500 13px/1.4 var(--sans)}

/* 09 — a mosaic with two metrics and a single row of three operation cards. */
.t-bento {color:#273044;background:#DCE9FA}
.be-title {position:absolute;left:39px;top:32px;font:700 24px/1.4 var(--sans)}
.be-mosaic {position:absolute;inset:91px 38px 40px;display:grid;
  grid-template-columns:1.21fr 1fr;grid-template-rows:124px 110px 105px;gap:12px}
.be-hero,.be-pct,.be-count,.be-steps li {border-radius:18px}
.be-hero {grid-column:1;grid-row:1/3;display:flex;align-items:center;background:#4D429A;color:#FFF7E9;padding:24px}
.be-hero h3 {font-size:47px;line-height:1.32}
.be-hero em {color:#D4E7AC}
.be-pct {grid-column:2;grid-row:1;position:relative;padding:14px 22px;background:#9ED4C7}
.be-pct .stat b,.be-count .stat b {font-size:43px}
.be-pct .stat span,.be-count .stat span {font-size:13px}
.be-meter {position:absolute;right:18px;top:25px;width:78px;height:10px;border-radius:6px;background:#D9F1E6;overflow:hidden}
.be-meter i {display:block;width:72%;height:100%;background:#25675B}
.be-count {grid-column:2;grid-row:2;padding:10px 22px;background:#FFF3D9}
.be-steps {grid-column:1/3;grid-row:3}
.be-steps ol {display:grid;height:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.be-steps .actions li {display:block;background:#F7FAFF;padding:14px 19px}
.be-steps i {display:block;color:#584999;margin-bottom:6px}
.be-steps .actions span {font-size:20px}

/* 10 — two print inks. The registration offset is confined to the paper. */
.t-riso {background-color:#F4EAD3;color:#242538;
  background-image:radial-gradient(#D3C9B8 .65px,transparent .85px);background-size:5px 5px}
.ri-paper {position:absolute;left:40px;top:41px;width:538px;height:275px;border:3px solid #293358;
  background:#EFA5B9;box-shadow:8px 8px 0 #5265AC}
.ri-lead {position:absolute;left:65px;top:64px;width:470px}
.ri-lead p {color:#563B4E;font:700 14px/1.4 var(--sans);margin-bottom:19px}
.ri-lead h3 {font:900 48px/1.28 var(--sans)}
.ri-lead em {color:#3B3882}
.ri-stamp {position:absolute;left:501px;top:239px;width:55px;height:55px;display:flex;align-items:center;justify-content:center;
  text-align:center;transform:rotate(-8deg);border:3px double #334D9D;border-radius:50%;color:#334D9D;font:900 14px/1.2 var(--serif)}
.ri-data {position:absolute;left:625px;right:42px;top:43px}
.ri-data .stat {border-top:3px solid #334D9D;padding:8px 0 14px}
.ri-data .stat b {font:900 52px/1.18 var(--latin);color:#334D9D}
.ri-data .stat span {font-size:13px}
.ri-ledger {position:absolute;left:42px;right:42px;top:355px}
.ri-ledger li {border-top:2px solid #334D9D;padding:5px 6px}
.ri-ledger li:last-child {border-bottom:2px solid #334D9D}
.ri-ledger .actions i {border:1px solid #334D9D;padding:1px 5px;color:#334D9D}
.ri-ledger .actions span {font-size:17px}
@media screen{@supports(width:1cqw){.stage{width:100cqw;height:56.25cqw}/* Reference canvas: 960 × 540. make_board.py converts the same rules to
   container-width units for the gallery and embeds these pixel rules for print. */
.stage {
  --sans: "Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",sans-serif;
  --serif: "Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --latin: "Helvetica Neue",Arial,"Liberation Sans",sans-serif;
  --mono: "IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font: 400 1.6666667cqw/1.45 var(--sans);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
.stage h3,.stage h4,.stage p,.stage ol {margin:0}
.stage em,.stage i {font-style:normal}
.stage h3 {font:800 5.2083333cqw/1.23 var(--sans);letter-spacing:-0.1041667cqw}
.stage h3 em {white-space:nowrap}
.stage .stat b {display:block;font:700 5.2083333cqw/1.16 var(--latin);white-space:nowrap;letter-spacing:-0.2083333cqw}
.stage .stat span {display:block;margin-top:0.3125cqw;font:500 1.4583333cqw/1.45 var(--sans)}
.stage .actions {padding:0;list-style:none}
.stage .actions li {display:flex;align-items:center;gap:1.3541667cqw}
.stage .actions i {font:600 1.3541667cqw/1.25 var(--mono);flex:none}
.stage .actions span {font:600 1.9791667cqw/1.4 var(--sans);white-space:nowrap}
.stage .vertical {display:block;text-align:center}
.stage .vertical > span {display:block}

/* 01 — facing columns, an ink-red data panel and a ruled editorial ledger. */
.t-editorial {background:#F4E8D8;color:#39292A}
.ed-top {position:absolute;left:4.375cqw;right:4.375cqw;top:3.2291667cqw;display:flex;justify-content:space-between;
  border-top:0.3125cqw solid #562E29;border-bottom:0.1041667cqw solid #9D7D62;padding:0.9375cqw 0;color:#682F2A;font:700 1.4583333cqw/1.4 var(--serif)}

.ed-lead h3 {font:800 6.0416667cqw/1.31 var(--serif)}
.ed-lead em {color:#913526}
.ed-data {position:absolute;left:62.8125cqw;top:10.4166667cqw;width:32.7083333cqw;height:39.8958333cqw;padding:2.8125cqw 3.125cqw;
  background:#913526;color:#FFF5E2;border-left:0.8333333cqw solid #D4A16B}

.ed-ledger {position:absolute;left:5.1041667cqw;top:33.125cqw;width:51.6666667cqw}

.ed-ledger li:last-child {border-bottom:0.1041667cqw solid #BB9F84}
.ed-ledger i {color:#913526}

/* 02 — a cobalt index, the proposition and an independent band for actions. */
.t-swiss {background:#F3F6FB;color:#132846}
.sw-side {position:absolute;inset:0 auto 0 0;width:21.3541667cqw;background:#244FC9;color:white;padding:4.5833333cqw 2.5cqw}
.sw-side p {width:15.2083333cqw;font:700 3.125cqw/1.25 var(--sans)}
.sw-side strong {position:absolute;left:2.2916667cqw;bottom:9.1666667cqw;font:400 11.3541667cqw/1 var(--latin);letter-spacing:-0.625cqw}
.sw-side>span {position:absolute;left:3.0208333cqw;bottom:6.6666667cqw;font:500 1.5625cqw/1.4 var(--sans)}
.sw-key {position:absolute;left:26.0416667cqw;top:5.625cqw;width:68.2291667cqw}
.sw-key h3 {font:400 6.6666667cqw/1.18 var(--sans);letter-spacing:-0.2083333cqw}
.sw-key em {font-weight:900;color:#244FC9}
.sw-steps {position:absolute;left:21.3541667cqw;right:0;top:28.0208333cqw;height:11.25cqw;background:#172D51;color:#FFF}
.sw-steps .actions {position:absolute;left:4.4791667cqw;right:3.8541667cqw;top:2.0833333cqw;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.5625cqw}
.sw-steps .actions li {display:block;min-width:0}
.sw-steps i {display:block;color:#ADCAFF;margin-bottom:0.4166667cqw}
.sw-numbers {position:absolute;left:26.0416667cqw;right:4.5833333cqw;top:41.3541667cqw;display:grid;grid-template-columns:1fr 1fr;gap:3.75cqw}
.sw-numbers .stat {border-top:0.2083333cqw solid #244FC9;padding-top:0.9375cqw}
.sw-numbers .stat b {font-size:4.6875cqw}

/* 03 — the coloured cells carry the reading order without crossing a text cell. */
.t-geo {background:#FBF3D9;color:#192F43}
.ge-title {position:absolute;inset:0 auto auto 0;width:37.2916667cqw;height:21.6666667cqw;background:#087E71;color:#FFF8DC;
  padding:3.8541667cqw 3.125cqw;font:800 4.2708333cqw/1.25 var(--sans)}
.ge-shape {position:absolute;left:37.2916667cqw;top:0;width:20.8333333cqw;height:21.6666667cqw;background:#D96749;overflow:hidden}
.ge-shape i {position:absolute;width:21.0416667cqw;height:21.0416667cqw;left:5.9375cqw;top:6.9791667cqw;background:#E6AF40;border-radius:50%}
.ge-pct {position:absolute;left:61.25cqw;top:2.3958333cqw;width:34.8958333cqw}
.ge-pct .stat b {font-size:9.5833333cqw;color:#243F69}
.ge-pct .stat span {font-size:1.6666667cqw}
.ge-disc,.ge-triangle {position:absolute;top:21.6666667cqw;width:18.6458333cqw;height:14.4791667cqw;overflow:hidden}
.ge-disc {left:0;background:#E6AF40}
.ge-disc i {position:absolute;top:2.2916667cqw;left:4.375cqw;width:9.8958333cqw;height:9.8958333cqw;border-radius:50%;background:#FFF6DB}
.ge-triangle {left:18.6458333cqw;background:#94C3AE}
.ge-triangle i {position:absolute;left:5.3125cqw;top:3.4375cqw;width:0;height:0;border-left:4.0625cqw solid transparent;border-right:4.0625cqw solid transparent;border-bottom:7.3958333cqw solid #087E71}
.ge-count {position:absolute;left:0;bottom:0;width:37.2916667cqw;height:20.1041667cqw;background:#243F69;color:#FFF7DF;padding:2.2916667cqw 3.125cqw}
.ge-count .stat b {font-size:7.0833333cqw}
.ge-key {position:absolute;left:40.4166667cqw;top:22.9166667cqw;width:55.7291667cqw}
.ge-key h3 {font-size:6.0416667cqw;line-height:1.2}
.ge-key em {color:#9F3628}
.ge-steps {position:absolute;left:40.5208333cqw;right:3.5416667cqw;top:43.9583333cqw}
.ge-steps ol {display:grid;grid-template-columns:repeat(3,1fr);gap:1.5625cqw}
.ge-steps .actions li {display:block;border-top:0.2083333cqw solid #243F69;padding-top:1.1458333cqw}
.ge-steps i {display:block;color:#087064;margin-bottom:0.4166667cqw}
.ge-steps .actions span {font-size:1.7708333cqw}

/* 04 — poster headline and an orange column large enough to carry the data. */
.t-broadsheet {background:#292321;color:#FBEBD5}
.br-title {position:absolute;left:4.8958333cqw;top:3.9583333cqw;border-top:0.4166667cqw solid #ED774D;width:55.2083333cqw;padding-top:1.25cqw;
  color:#FBE2C5;font:600 1.6666667cqw/1.4 var(--sans)}
.br-lead {position:absolute;left:4.5833333cqw;bottom:3.8541667cqw;width:55cqw}
.br-lead h3 {font:900 7.9166667cqw/1.15 var(--sans);letter-spacing:-0.3125cqw}
.br-lead em {color:#F78960}
.br-column {position:absolute;inset:0 0 0 auto;width:32.0833333cqw;padding:3.4375cqw 3.2291667cqw;background:#ED774D;color:#30201B}
.br-column .stat {border-top:0.2083333cqw solid #4E2C22;padding:1.25cqw 0 1.9791667cqw}
.br-column .stat b {font:800 6.6666667cqw/1.12 var(--latin);letter-spacing:-0.3125cqw}
.br-column .stat span {font-size:1.5625cqw}
.br-actions {margin-top:0.8333333cqw;border-top:0.2083333cqw solid #4E2C22;padding-top:1.1458333cqw}
.br-actions li {margin:0.8333333cqw 0}
.br-actions .actions span {font-size:1.875cqw}

/* 05 — light, a chapter inscription and three distinct content regions. */
.t-midnight {background-color:#132E43;color:#F4EFDE;background-image:
  radial-gradient(ellipse at 17% 74%,#347473 0%,#204953 25%,transparent 56%),
  radial-gradient(ellipse at 70% 0%,#243954 0%,#112637 76%)}
.mi-frame {position:absolute;inset:2.0833333cqw;border:0.1041667cqw solid #AB9970}
.mi-art {position:absolute;left:2.2916667cqw;bottom:2.2916667cqw;width:30.4166667cqw;height:31.875cqw;overflow:hidden}
.mi-art i,.mi-art b {position:absolute;display:block;border:0.1041667cqw solid #AAC0A1;border-radius:50%;opacity:.55}
.mi-art i {width:37.2916667cqw;height:16.9791667cqw;bottom:-6.3541667cqw;left:-5.1041667cqw}
.mi-art b {width:31.4583333cqw;height:13.3333333cqw;bottom:-5.2083333cqw;left:-2.1875cqw}
.mi-chapter {position:absolute;left:8.125cqw;top:9.4791667cqw;color:#E2BE75;font:600 4.8958333cqw/1.32 var(--serif)}
.mi-lead {position:absolute;left:35.4166667cqw;top:7.6041667cqw;width:57.0833333cqw}
.mi-lead p {color:#E1C488;font:500 1.5625cqw/1.45 var(--serif);margin-bottom:1.6666667cqw}
.mi-lead h3 {font:700 5.3125cqw/1.3 var(--serif)}
.mi-lead em {color:#E7C177}
.mi-data {position:absolute;left:35.4166667cqw;top:29.7916667cqw;width:56.25cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.5cqw}
.mi-data .stat {padding-top:1.0416667cqw;border-top:0.1041667cqw solid #968762}
.mi-data .stat b {font:600 4.5833333cqw/1.18 Georgia,var(--serif);color:#F5EAD2}
.mi-data .stat span {color:#D8E2DD;font-size:1.3541667cqw}
.mi-steps {position:absolute;left:35.4166667cqw;right:7.7083333cqw;top:44.6875cqw}
.mi-steps ol {display:flex;justify-content:space-between;gap:1.0416667cqw;border-top:0.1041667cqw solid #8C8066;padding-top:1.25cqw}
.mi-steps .actions li {gap:0.7291667cqw}.mi-steps i {color:#E2BE75}.mi-steps .actions span {font-weight:500;font-size:1.5625cqw}

/* 06 — artwork lives inside the right-hand scene. The CSS still life is complete
   on its own; supplied art is clipped to the same region, away from the text. */
.t-clay {color:#49382D;background-color:#F6CBB7;background-image:
  radial-gradient(ellipse at 10% 5%,#FFF3D9 2%,transparent 59%),
  radial-gradient(ellipse at 85% 85%,#EFB4B3 0%,transparent 62%)}
.cl-lead {position:absolute;left:4.0625cqw;top:6.4583333cqw;width:44.2708333cqw}
.cl-lead p {color:#74503C;font-weight:700;margin-bottom:2.3958333cqw}
.cl-lead h3 {font-size:5.2083333cqw;line-height:1.25}
.cl-lead em {color:#9C4830}
.cl-data {position:absolute;left:4.1666667cqw;top:30.2083333cqw;width:43.9583333cqw;display:grid;grid-template-columns:1fr 1fr;gap:2.0833333cqw}
.cl-data .stat {border-top:0.2083333cqw solid #C48C74;padding-top:1.1458333cqw}
.cl-data .stat b {font-size:4.6875cqw}
.cl-data .stat span {font-size:1.25cqw;color:#664A38}
.cl-actions {position:absolute;left:4.0625cqw;top:44.8958333cqw;width:44.2708333cqw}
.cl-actions ol {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0.7291667cqw}
.cl-actions .actions li {justify-content:center;gap:0.5208333cqw;padding:0.8333333cqw 0.2083333cqw;border-radius:2.1875cqw;background:#FFF3DC;color:#5B3C2C}
.cl-actions .actions i {font-size:1.1458333cqw;color:#93472D}
.cl-actions .actions span {font-size:1.4583333cqw}
.scene {position:absolute;left:51.7708333cqw;top:2.9166667cqw;width:45.7291667cqw;height:50.4166667cqw;border-radius:12.0833333cqw 12.0833333cqw 5.625cqw 5.625cqw;
  overflow:hidden;background:#E8B7AA;background-image:radial-gradient(ellipse at 25% 16%,#FFF0D5 2%,#F0CCB5 39%,#CDA79F 100%)}
.still-life,.scene-photo {position:absolute;inset:0;width:100%;height:100%}
.scene-photo {object-fit:contain}
.counter {position:absolute;left:-6.25cqw;top:30.625cqw;width:59.8958333cqw;height:27.0833333cqw;background:linear-gradient(170deg,#AED2C1,#80AA9E 58%,#688F86);border-radius:50% 38% 0 0}
.loyalty {position:absolute;left:23.125cqw;top:11.7708333cqw;width:14.5833333cqw;height:10.7291667cqw;transform:rotate(9deg);border-radius:1.5625cqw;
  background:linear-gradient(140deg,#FFF1DC,#E9C4A1);border:0.2083333cqw solid #E3BC99;box-shadow:0.7291667cqw 1.25cqw 1.6666667cqw #7854422B}
.ticket-stripe {position:absolute;top:2.0833333cqw;left:0;right:0;height:1.4583333cqw;background:#CA8B76}
.ticket-dots {position:absolute;left:2.0833333cqw;bottom:1.9791667cqw;display:flex;gap:1.0416667cqw}
.ticket-dots i {display:block;width:1.7708333cqw;height:1.7708333cqw;border-radius:50%;background:#8BB6A6}
.ticket-dots i:last-child {background:#D9AE91}
.saucer {position:absolute;width:25.1041667cqw;height:5.9375cqw;left:6.875cqw;top:34.1666667cqw;border-radius:50%;
  background:radial-gradient(ellipse at 44% 33%,#E7C0A4 36%,#FFE2C1 66%,#BA8F7E 93%);box-shadow:0.9375cqw 1.5625cqw 1.6666667cqw #405B543D}
.handle {position:absolute;left:21.6666667cqw;top:25.7291667cqw;width:8.3333333cqw;height:7.8125cqw;border:1.3541667cqw solid #D08971;border-radius:45%;
  box-shadow:0.3125cqw 0.5208333cqw 0.625cqw #6B695C38,inset 0.3125cqw 0.2083333cqw 0.4166667cqw #5D74663B}
.cup {position:absolute;left:10.3125cqw;top:24.0625cqw;width:15cqw;height:12.3958333cqw;border-radius:1.4583333cqw 1.4583333cqw 5.4166667cqw 5.4166667cqw;
  background:linear-gradient(110deg,#F0B394 0%,#D68F78 57%,#BC7463 100%);box-shadow:0.5208333cqw 0.8333333cqw 1.0416667cqw #A475633B}
.cup i {position:absolute;left:0;top:-0.7291667cqw;width:15cqw;height:2.3958333cqw;border:0.5208333cqw solid #F2B69A;border-radius:50%;
  background:radial-gradient(ellipse at 42% 30%,#BD8A58,#82593C 76%)}
.edge-image {position:absolute;max-width:24%;height:auto;max-height:26%;object-fit:contain}
.edge-image.lower {left:0;bottom:0}.edge-image.upper {right:0;top:0}

/* 07 — printed folio, vertical title and a separate red seal. */
.t-scroll {color:#382C21;background:#EBD3AA;background-image:radial-gradient(ellipse at 68% 30%,#F8E9CB,transparent 70%)}
.sc-border {position:absolute;inset:2.2916667cqw;border:0.3125cqw double #9A6A4D}
.sc-spine {position:absolute;left:2.8125cqw;top:2.8125cqw;bottom:2.8125cqw;width:6.5625cqw;background:#466055;color:#F7E7C7;
  padding-top:5.1041667cqw;font:600 2.2916667cqw/1.58 var(--serif)}
.sc-title {position:absolute;left:12.5cqw;top:5.9375cqw;width:7.0833333cqw;font:700 3.5416667cqw/1.22 var(--serif)}
.sc-seal {position:absolute;left:13.6458333cqw;bottom:6.4583333cqw;border:0.2083333cqw solid #973E2B;color:#973E2B;padding:0.5208333cqw;font:700 1.7708333cqw/1.2 var(--serif)}
.sc-lead {position:absolute;left:24.5833333cqw;top:9.1666667cqw;width:39.2708333cqw}
.sc-lead h3 {font:700 5.1041667cqw/1.4 var(--serif)}
.sc-lead em {color:#973E2B}
.sc-data {position:absolute;left:68.75cqw;top:6.7708333cqw;width:22.9166667cqw;border-left:0.1041667cqw solid #B48B62;padding-left:2.5cqw}
.sc-data .stat {padding:0.9375cqw 0 1.3541667cqw}
.sc-data .stat + .stat {border-top:0.1041667cqw solid #BF9777}
.sc-data .stat b {font:700 4.4791667cqw/1.2 Georgia,var(--serif);color:#843727}
.sc-data .stat span {font-size:1.3541667cqw}
.sc-actions {position:absolute;left:24.6875cqw;top:33.9583333cqw;right:8.5416667cqw}
.sc-actions li {border-top:0.1041667cqw solid #B48B62;padding:0.7291667cqw 0}
.sc-actions li:last-child {border-bottom:0.1041667cqw solid #B48B62}
.sc-actions .actions i {font:600 1.5625cqw/1.4 var(--serif);color:#8E3525}
.sc-actions .actions span {font:600 1.875cqw/1.4 var(--serif)}

/* 08 — a real part-to-whole chart. Its complement comes from the same example. */
.t-counsel {color:#193851;background:#EDF4F1}
.co-title {position:absolute;inset:0 0 auto;height:6.875cqw;padding:2.0833333cqw 4.5833333cqw;background:#193851;color:white;font:600 1.9791667cqw/1.45 var(--sans)}
.co-lead {position:absolute;left:4.5833333cqw;top:9.6875cqw;width:89.7916667cqw}
.co-lead h3 {font-size:4.2708333cqw;line-height:1.3}
.co-lead em {color:#116A6C}
.co-exhibit {position:absolute;left:4.5833333cqw;top:19.1666667cqw;width:54.4791667cqw;height:28.3333333cqw;padding:2.3958333cqw 2.5cqw;background:#D6E8E7}
.co-side {position:absolute;left:62.9166667cqw;top:19.1666667cqw;width:31.9791667cqw}
.co-exhibit h4,.co-side h4 {font:700 1.9791667cqw/1.4 var(--sans)}
.co-readout {display:flex;align-items:baseline;gap:1.25cqw;margin-top:0.8333333cqw}
.co-readout strong {font:800 6.25cqw/1.16 var(--latin);letter-spacing:-0.2083333cqw;color:#0E6265}
.co-readout span {font:500 1.5625cqw/1.45 var(--sans)}
.co-bar {height:1.9791667cqw;width:100%;margin:1.0416667cqw 0 0.8333333cqw;background:#A4BCBF}
.co-bar i {display:block;width:72%;height:100%;background:#147879}
.co-key {display:flex;gap:2.3958333cqw;font:500 1.3541667cqw/1.45 var(--sans)}
.co-key span {display:flex;align-items:center;gap:0.625cqw;white-space:nowrap;flex:none}
.co-key i {display:block;width:1.0416667cqw;height:1.0416667cqw;background:#147879}
.co-key span + span i {background:#A4BCBF}
.co-exhibit .co-sample {border-top:0.1041667cqw solid #A0B9BB;padding-top:0.9375cqw;margin-top:1.3541667cqw;font:500 1.3541667cqw/1.45 var(--sans)}
.co-side ol {margin-top:1.4583333cqw}
.co-side li {padding:1.3541667cqw 0;border-top:0.1041667cqw solid #9DB6B3}
.co-side i {color:#116A6C}
.co-source {position:absolute;left:4.6875cqw;bottom:3.75cqw;color:#485F64;font:500 1.3541667cqw/1.4 var(--sans)}

/* 09 — a mosaic with two metrics and a single row of three operation cards. */
.t-bento {color:#273044;background:#DCE9FA}
.be-title {position:absolute;left:4.0625cqw;top:3.3333333cqw;font:700 2.5cqw/1.4 var(--sans)}
.be-mosaic {position:absolute;inset:9.4791667cqw 3.9583333cqw 4.1666667cqw;display:grid;
  grid-template-columns:1.21fr 1fr;grid-template-rows:12.9166667cqw 11.4583333cqw 10.9375cqw;gap:1.25cqw}
.be-hero,.be-pct,.be-count,.be-steps li {border-radius:1.875cqw}
.be-hero {grid-column:1;grid-row:1/3;display:flex;align-items:center;background:#4D429A;color:#FFF7E9;padding:2.5cqw}
.be-hero h3 {font-size:4.8958333cqw;line-height:1.32}
.be-hero em {color:#D4E7AC}
.be-pct {grid-column:2;grid-row:1;position:relative;padding:1.4583333cqw 2.2916667cqw;background:#9ED4C7}
.be-pct .stat b,.be-count .stat b {font-size:4.4791667cqw}
.be-pct .stat span,.be-count .stat span {font-size:1.3541667cqw}
.be-meter {position:absolute;right:1.875cqw;top:2.6041667cqw;width:8.125cqw;height:1.0416667cqw;border-radius:0.625cqw;background:#D9F1E6;overflow:hidden}
.be-meter i {display:block;width:72%;height:100%;background:#25675B}
.be-count {grid-column:2;grid-row:2;padding:1.0416667cqw 2.2916667cqw;background:#FFF3D9}
.be-steps {grid-column:1/3;grid-row:3}
.be-steps ol {display:grid;height:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25cqw}
.be-steps .actions li {display:block;background:#F7FAFF;padding:1.4583333cqw 1.9791667cqw}
.be-steps i {display:block;color:#584999;margin-bottom:0.625cqw}
