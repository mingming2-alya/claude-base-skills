<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>明暗兩版配色</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=block">
<style>*{box-sizing:border-box;margin:0;padding:0}body{width:2000px;background:#ECEAE4;color:#22201C;font-family:"Noto Sans TC",sans-serif;padding:40px 40px 44px}
h1{font:900 38px/1.2 "Noto Sans TC"}p.sub{margin-top:8px;font:400 21px/1.5 "Noto Sans TC";color:#57534D}
h2{margin:30px 0 12px;font:900 26px/1.2 "Noto Sans TC"}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
figure img{display:block;width:100%;aspect-ratio:16/9;border:1px solid #CFC9BC}figcaption{margin-top:8px;font:700 19px/1.3 "Noto Sans TC";color:#3A3732}</style></head><body>
<h1>首批兩款的明暗兩版</h1><p class="sub">同一份內容；每款有深色與淺色兩種底，每種底再依主題推薦三組配色。用色角色與範圍見 style-specs。</p>
<h2>Apple 發表｜深色舞台</h2><div class="row">
<figure><img src="img/apple-dark-warm.jpg" alt=""><figcaption>暖橘　漸層最低 6.1:1</figcaption></figure>
<figure><img src="img/apple-dark-ice.jpg" alt=""><figcaption>冰藍　漸層最低 4.4:1</figcaption></figure>
<figure><img src="img/apple-dark-leaf.jpg" alt=""><figcaption>翠綠　漸層最低 7.9:1</figcaption></figure>
</div>
<h2>Apple 發表｜淺色舞台（新）</h2><div class="row">
<figure><img src="img/apple-light-warm.jpg" alt=""><figcaption>暖橘　漸層最低 3.2:1</figcaption></figure>
<figure><img src="img/apple-light-ice.jpg" alt=""><figcaption>冰藍　漸層最低 3.8:1</figcaption></figure>
<figure><img src="img/apple-light-leaf.jpg" alt=""><figcaption>翠綠　漸層最低 3.3:1</figcaption></figure>
</div>
<h2>顧問報告｜淺色紙</h2><div class="row">
<figure><img src="img/counsel-light-green.jpg" alt=""><figcaption>綠</figcaption></figure>
<figure><img src="img/counsel-light-blue.jpg" alt=""><figcaption>藍</figcaption></figure>
<figure><img src="img/counsel-light-ink.jpg" alt=""><figcaption>墨黑</figcaption></figure>
</div>
<h2>顧問報告｜深色石板（新）</h2><div class="row">
<figure><img src="img/counsel-dark-green.jpg" alt=""><figcaption>綠</figcaption></figure>
<figure><img src="img/counsel-dark-blue.jpg" alt=""><figcaption>藍</figcaption></figure>
<figure><img src="img/counsel-dark-paper.jpg" alt=""><figcaption>紙白</figcaption></figure>
</div>
</body></html>
