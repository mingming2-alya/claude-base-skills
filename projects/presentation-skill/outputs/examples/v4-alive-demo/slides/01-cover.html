<style>
.slide {
  --fg: #F4F1EA;
  --sub: #C8C4BA;
  --gold: #E8B86B;
  --serif: "Noto Serif TC", var(--font-serif-fallback);
  --sans: "Noto Sans TC", var(--font-sans-fallback);
  --num: "Archivo", "Noto Sans TC", var(--font-sans-fallback);
  --motion-mode: spring;
  background: #101215;
  color: var(--fg);
  font-family: var(--sans);
}
.slide .scrim {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(94deg, rgba(12, 14, 17, 0.86) 0%, rgba(12, 14, 17, 0.66) 40%, rgba(12, 14, 17, 0.14) 68%, rgba(12, 14, 17, 0) 100%),
    linear-gradient(180deg, rgba(12, 14, 17, 0.78) 0%, rgba(12, 14, 17, 0.34) 14%, rgba(12, 14, 17, 0) 28%, rgba(12, 14, 17, 0.45) 100%);
}
.slide .masthead {
  position: absolute;
  left: 112px;
  right: 112px;
  top: 52px;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(244, 241, 234, 0.18);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--gold);
}
.slide .masthead span.right { color: #EFECE4; font-weight: 600; letter-spacing: 0.04em; }

.slide .hero {
  position: absolute;
  left: 112px;
  top: 230px;
  width: 960px;
  z-index: 3;
}
.slide h1 {
  font-family: var(--serif);
  font-size: 122px;
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.015em;
  color: var(--fg);
}
.slide h1 span { display: block; margin-top: 8px; color: var(--gold); }
.slide .rule { margin-top: 36px; width: 92px; height: 3px; background: var(--gold); }
.slide p.sub {
  margin-top: 28px;
  font-size: 36px;
  font-weight: 500;
  line-height: 1.4;
  color: #DFDCD4;
}

/* Smoked dark glass without expensive backdrop-filter blur -> silky 60fps on mobile */
.slide .kpi-strip {
  position: absolute;
  left: 112px;
  bottom: 88px;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(3, 236px);
  background: rgba(15, 18, 23, 0.86);
  border: 1px solid rgba(244, 241, 234, 0.17);
  box-shadow: inset 0 1px 0 rgba(244, 241, 234, 0.14);
  border-radius: 20px;
  overflow: hidden;
  --spot-border: rgba(232, 184, 107, 0.82);
  --spot-glow: rgba(232, 184, 107, 0.18);
}
.slide .kpi-cell {
  padding: 26px 28px;
  border-right: 1px solid rgba(244, 241, 234, 0.12);
}
.slide .kpi-cell:last-child { border-right: 0; }
.slide .kpi-cell b {
  display: inline-block;
  font-family: var(--num);
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.slide .kpi-cell b.hl { color: var(--gold); }
.slide .kpi-cell b small { font-size: 24px; font-weight: 700; margin-left: 3px; }
.slide .kpi-cell span {
  display: block;
  margin-top: 10px;
  font-size: 20px;
  font-weight: 500;
  color: var(--sub);
}
</style>
<section class="slide canvas" data-nav="none" data-fx="ambient-dust">
  <div class="asset-slot" data-slot="cover-photo" data-mode="dark">
    <img src="assets/editorial-bakery-cover.jpg" alt="清晨陽光灑在手工酸種麵包與可頌上的烘焙工作台">
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <div class="masthead" data-beat="1" data-delay="60" data-from="none">
    <span>2026 Q4 營運提案</span>
    <span class="right">營運企劃組｜2026.11</span>
  </div>

  <!-- Editorial Eye Path: Title -> Gold Rule Wipe -> Subtitle -> Bottom KPI Anchor -->
  <div class="hero">
    <h1 data-beat="1" data-delay="80">星塵烘焙<span>智慧補貨系統</span></h1>
    <div class="rule" data-wipe="right" data-delay="340" data-dur="420"></div>
    <p class="sub" data-beat="2" data-delay="480" data-from="left">預報驅動，把報廢壓進 6% 以內。</p>
  </div>

  <div class="kpi-strip" data-beat="3" data-delay="700" data-spotlight>
    <div class="kpi-cell">
      <b class="hl">4.2<small>%</small></b>
      <span>試點報廢率</span>
    </div>
    <div class="kpi-cell">
      <b>−63<small>%</small></b>
      <span>報廢盤數</span>
    </div>
    <div class="kpi-cell">
      <b>5<small>家</small></b>
      <span>Q4 導入門市</span>
    </div>
  </div>
</section>
