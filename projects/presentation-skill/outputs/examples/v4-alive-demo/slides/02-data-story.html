<style>
.slide {

}

.slide nav.slide-nav {

}

.slide .left {

}
.slide p.lead em { font-style: normal; font-weight: 900; color: var(--mint); }

.slide .evidence {

.slide .r-top {

.slide .tray {

}

  color: #FFA08A;
}

.slide .tray .dot-row i { width: 14px; height: 8px; border-radius: 4px; display: block; }
.slide .tray.kept .dot-row i { background: #64E6AF; }
.slide .tray.saved .dot-row i { background: rgba(255, 130, 102, 0.55); }

.slide .legend {
  margin-top: 24px;

  justify-content: space-between;
  align-items: center;
  padding: 18px 24px;
  border-radius: 16px;

}

.slide .swatch { width: 18px; height: 18px; border-radius: 5px; display: block; }

.slide .swatch.coral { background: var(--coral); }

  margin-top: auto;

  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.slide .comp-box {

  border-radius: 16px;
  background: rgba(255, 255, 255, 0.03);

}

.slide .comp-box .val-line {

  font-family: var(--num);
  font-size: 28px;
  font-weight: 800;
  color: var(--fg);
}

.slide .comp-box.loss .val-line { color: var(--coral); }
.slide .comp-box .rate-hero {

  font-family: var(--num);
  font-size: 32px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.slide .comp-box .rate-hero small {
  display: inline;
  font-size: 22px;
  font-weight: 800;
  color: inherit;
}

.slide .src {
  position: absolute;
  left: 100px;
  bottom: 24px;
  z-index: 2;
  font-size: 18px;
  font-weight: 400;
  color: var(--muted);
}
