<style>
.slide {
  --stage-bg: #0A0C10;
  --fg: #F5F6F8;
  --sub: #A2A6B0;
  --muted: #7C828E;
  --grad: linear-gradient(92deg, #7CEEF9 0%, #4AC3FA 48%, #4BE2A5 100%);
  --sans: "Noto Sans TC", var(--font-sans-fallback);
  --num: "Geist", "Noto Sans TC", var(--font-sans-fallback);
  --motion-mode: spring;
  --spring-response: 0.56;
  --spring-bounce: 0;
  background: var(--stage-bg);
  color: var(--fg);
  font-family: var(--sans);
}
.slide svg.backdrop { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

.slide nav.slide-nav {
  position: absolute;
  left: 0;
  right: 0;
  top: 46px;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 44px;
  font-size: 20px;
  font-weight: 500;
  line-height: 1;
  color: var(--muted);
}
.slide nav.slide-nav b { color: var(--fg); font-weight: 700; }

.slide header {
  position: absolute;
  left: 0;
  right: 0;
  top: 118px;
  z-index: 3;
  text-align: center;
}
.slide h1 {
  font-size: 128px;
  font-weight: 900;
  line-height: 1.04;
  letter-spacing: -0.02em;
  color: var(--fg);
}
.slide h1 span.ver {
  font-family: var(--num);
  font-weight: 800;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  margin-left: 12px;
}
.slide p.tag {
  margin-top: 22px;
  font-size: 42px;
  font-weight: 500;
  line-height: 1.35;
  color: #D2D5DC;
}
.slide p.tag em {
  font-style: normal;
  font-weight: 700;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

.slide .device {
  position: absolute;
  left: 560px;
  top: 446px;
  width: 800px;
  height: 664px;
  z-index: 3;
  border-radius: 48px 48px 0 0;
  background: linear-gradient(180deg, #171B24 0%, #0E1118 62%, #090B10 100%);
  padding: 36px 42px 0;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    0 28px 90px rgba(0, 0, 0, 0.65);
}
.slide .dev-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 22px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
}
.slide .dev-store { font-size: 22px; font-weight: 700; color: #D9DDE5; }
.slide .dev-weather {
  padding: 7px 16px;
  border-radius: 999px;
  background: rgba(74, 195, 250, 0.14);
  border: 1px solid rgba(74, 195, 250, 0.34);
  font-size: 18px;
  font-weight: 700;
  color: #7CEEF9;
}

.slide .dev-body {
  display: grid;
  grid-template-columns: 1.06fr 0.94fr;
  gap: 30px;
  margin-top: 28px;
}
.slide .metric-k { font-size: 19px; font-weight: 500; color: var(--sub); }
.slide .metric-v {
  margin-top: 8px;
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.slide .metric-v b {
  display: inline-block;
  font-family: var(--num);
  font-size: 84px;
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.04em;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.slide .metric-v b small { font-size: 38px; font-weight: 700; color: #4BE2A5; }
.slide .badge-ok {
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(75, 226, 165, 0.16);
  border: 1px solid rgba(75, 226, 165, 0.35);
  font-size: 18px;
  font-weight: 700;
  color: #6CEFB9;
}

.slide .chart-box {
  position: relative;
  margin-top: 24px;
  padding: 18px 20px 14px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.slide .chart-head {
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  font-weight: 600;
  color: var(--sub);
  margin-bottom: 12px;
}
.slide .chart-head em { font-style: normal; color: #6CEFB9; }
.slide .chart-stage { position: relative; width: 330px; height: 156px; }
.slide .trend-token {
  position: absolute;
  left: 0;
  top: 0;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #7CEEF9;
  box-shadow: 0 0 14px #7CEEF9;
  offset-path: path('M 8 56 C 54 68, 94 88, 146 98 C 202 109, 260 116, 322 120');
  --token-dur: 3.4s;
}

.slide .batch-list { display: flex; flex-direction: column; gap: 16px; }
.slide .batch-title { font-size: 19px; font-weight: 700; color: var(--sub); margin-bottom: 2px; }
.slide .batch-row {
  padding: 18px 20px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.slide .batch-row.hl {
  background: rgba(74, 195, 250, 0.08);
  border-color: rgba(74, 195, 250, 0.28);
}
.slide .b-top { display: flex; justify-content: space-between; align-items: baseline; }
.slide .b-top strong { font-size: 22px; font-weight: 700; color: var(--fg); }
.slide .b-top b {
  font-family: var(--num);
  font-size: 24px;
  font-weight: 800;
  color: #7CEEF9;
  font-variant-numeric: tabular-nums;
}
.slide .b-track {
  margin-top: 14px;
  height: 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.09);
  overflow: hidden;
}
.slide .b-fill { height: 100%; border-radius: 999px; background: var(--grad); }

.slide .side { position: absolute; width: 370px; z-index: 3; }
.slide .side.left { left: 96px; text-align: right; }
.slide .side.right { left: 1454px; text-align: left; }
.slide .side .hero-val {
  font-family: var(--num);
  font-size: 56px;
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.03em;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.slide .side .hero-val.accent {
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.slide .side .hero-val small {
  font-family: var(--sans);
  font-size: 26px;
  font-weight: 700;
  margin-left: 6px;
}
.slide .side .hero-title {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.15;
  color: var(--fg);
}
.slide .side .label {
  margin-top: 10px;
  font-size: 24px;
  font-weight: 500;
  color: var(--sub);
}

.slide .app-trigger {
  position: absolute;
  right: 96px;
  bottom: 38px;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(124, 238, 249, 0.36);
  color: #B4F4FC;
  font: 700 19px/1 var(--sans);
  cursor: pointer;
  transition: background .2s ease, transform .2s ease;
}
.slide .app-trigger:hover {
  background: rgba(74, 195, 250, 0.2);
  transform: translateY(-2px);
}
</style>
