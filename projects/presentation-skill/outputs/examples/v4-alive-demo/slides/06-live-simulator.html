<script>
const storesIn = slide.querySelector('#sim-stores');
const rateIn = slide.querySelector('#sim-rate');
const blockStores = slide.querySelector('#block-stores');
const blockRate = slide.querySelector('#block-rate');
const dragCue = slide.querySelector('#drag-cue');
const linkBridge = slide.querySelector('#link-bridge');
const outStores = slide.querySelector('#out-stores');
const outRate = slide.querySelector('#out-rate');
const outScenario = slide.querySelector('#out-scenario');
const outSave = slide.querySelector('#out-save');
const outPayback = slide.querySelector('#out-payback');
const outMargin = slide.querySelector('#out-margin');
const outTrays = slide.querySelector('#out-trays');
const outCapex = slide.querySelector('#out-capex');
const deltaSave = slide.querySelector('#delta-save');
const deltaPayback = slide.querySelector('#delta-payback');
const deltaMargin = slide.querySelector('#delta-margin');
const deltaTrays = slide.querySelector('#delta-trays');
const barSaveTag = slide.querySelector('#bar-save-tag');
const barRatioTag = slide.querySelector('#bar-ratio-tag');
const barOld = slide.querySelector('#bar-old');
const barNew = slide.querySelector('#bar-new');
const numOld = slide.querySelector('#num-old');
const numNew = slide.querySelector('#num-new');
const lblNew = slide.querySelector('#lbl-new');
const heroOut = slide.querySelector('#hero-out');
const barCard = slide.querySelector('#bar-card');
const kCards = [...slide.querySelectorAll('.k-card')];
const presets = [...slide.querySelectorAll('.preset-btn')];
let flashTimer = 0;

function model(stores, rate) {
  const dropRatio = Math.max(0.1, (11.4 - rate) / (11.4 - 4.2));
  const annualSave = Math.round(stores * 34 * dropRatio);
  const oldWaste = Math.round(stores * 53.8);
  const newWaste = Math.max(1, oldWaste - annualSave);
  const capex = stores * 12;
  const payback = Math.max(1.0, (capex / Math.max(1, annualSave)) * 12);
  const margin = 1.8 * dropRatio;
  const trays = Math.round(stores * 15 * dropRatio);
  const pctDrop = Math.round((annualSave / Math.max(1, oldWaste)) * 100);
  return { annualSave, oldWaste, newWaste, capex, payback, margin, trays, pctDrop };
}
const BASE = model(5, 4.2);

function setDelta(el, diff, unit, lowerIsBetter, decimals) {
  if (!el) return;
  const eps = decimals ? 0.05 : 0.5;
  if (Math.abs(diff) < eps) {
    el.className = el.classList.contains('delta-pill') ? 'delta-pill' : 'k-delta';
    el.textContent = '';
    return;
  }
  const good = lowerIsBetter ? diff < 0 : diff > 0;
  const arrow = diff > 0 ? '▲ +' : '▼ −';
  const val = decimals ? Math.abs(diff).toFixed(decimals) : String(Math.round(Math.abs(diff)));
  el.textContent = arrow + val + unit;
  const baseCls = el.classList.contains('delta-pill') ? 'delta-pill' : 'k-delta';
  el.className = baseCls + ' show ' + (good ? 'good' : 'warn');
}

function render(fromUser, source) {
  const stores = Number(storesIn.value);
  const rate = Number(rateIn.value);
  const m = model(stores, rate);
  outStores.innerHTML = stores + '<small>家</small>';
  outRate.innerHTML = rate.toFixed(1) + '<small>%</small>';
  outScenario.textContent = stores + ' 家門市 ・ 目標 ' + rate.toFixed(1) + '%';
  outSave.innerHTML = m.annualSave + '<small>萬／年</small>';
  outPayback.innerHTML = m.payback.toFixed(1) + '<small>個月</small>';
  outMargin.innerHTML = '+' + m.margin.toFixed(1) + '<small>%</small>';
  outTrays.innerHTML = m.trays + '<small>盤／日</small>';
  if (outCapex) outCapex.textContent = m.capex + ' 萬';
  barSaveTag.textContent = '年省 ' + m.annualSave + ' 萬';
  if (barRatioTag) barRatioTag.textContent = '報廢原料支出 −' + m.pctDrop + '%';
  lblNew.textContent = '導入後（' + rate.toFixed(1) + '%）';
  numOld.textContent = m.oldWaste + ' 萬';
  numNew.textContent = m.newWaste + ' 萬';
  const maxBar = Math.max(m.oldWaste, 1);
  barOld.style.width = '92%';
  barNew.style.width = Math.max(10, Math.round((m.newWaste / maxBar) * 92)) + '%';

  setDelta(deltaSave, m.annualSave - BASE.annualSave, ' 萬', false, 0);
  setDelta(deltaPayback, m.payback - BASE.payback, ' 月', true, 1);
  setDelta(deltaMargin, m.margin - BASE.margin, '%', false, 1);
  setDelta(deltaTrays, m.trays - BASE.trays, ' 盤', false, 0);

  presets.forEach(b => {
    const match = Number(b.dataset.stores) === stores && Math.abs(Number(b.dataset.rate) - rate) < 0.05;
    b.classList.toggle('on', match);
  });

  if (fromUser) {
    if (dragCue) dragCue.classList.add('used');
    if (blockStores) blockStores.classList.toggle('ctrl-active', source === 'stores' || source === 'preset');
    if (blockRate) blockRate.classList.toggle('ctrl-active', source === 'rate' || source === 'preset');
    if (heroOut) heroOut.classList.add('flash');
    if (linkBridge) linkBridge.classList.add('pulse');
    if (barCard) barCard.classList.add('k-flash');
    kCards.forEach(c => c.classList.add('k-flash'));
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      if (heroOut) heroOut.classList.remove('flash');
      if (linkBridge) linkBridge.classList.remove('pulse');
      if (barCard) barCard.classList.remove('k-flash');
      kCards.forEach(c => c.classList.remove('k-flash'));
    }, 380);
  }
}

storesIn.addEventListener('input', () => render(true, 'stores'));
rateIn.addEventListener('input', () => render(true, 'rate'));
presets.forEach(b => b.addEventListener('click', () => {
  storesIn.value = b.dataset.stores;
  rateIn.value = b.dataset.rate;
  render(true, 'preset');
}));
render(false, null);
</script>
