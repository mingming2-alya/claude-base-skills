<style>
.slide {
  --ink: #2E221B;
  --ink-2: #544237;
  --muted: #6E5A4C;
  --terra: #AD4A2D;
  --sage: #2F664E;
  --ochre: #96561D;
  --round: "Chiron GoRound TC", var(--font-round-fallback);
  --sans: "Noto Sans TC", var(--font-sans-fallback);
  --num: "Nunito", "Noto Sans TC", var(--font-round-fallback);
  --motion-mode: spring;
  background: #F5E6D6;
  color: var(--ink);
  font-family: var(--sans);
}
.slide .wash {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(251, 241, 230, 0.42) 0%, rgba(251, 241, 230, 0.14) 48%, rgba(251, 241, 230, 0) 64%);
}

.slide nav.slide-nav {
  position: absolute;
  left: 112px;
  top: 48px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 32px;
  font-size: 21px;
  font-weight: 500;
  color: var(--muted);
}
.slide nav.slide-nav b {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-weight: 800;
}
.slide nav.slide-nav b::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--terra);
  display: block;
}

.slide h1 {
  position: absolute;
  left: 112px;
  top: 114px;
  z-index: 3;
  font-family: var(--round);
  font-size: 86px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.slide p.lead {
  position: absolute;
  left: 112px;
  top: 222px;
  z-index: 3;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink-2);
}
.slide p.lead em { font-style: normal; color: var(--terra); }

/* Segmented horizontal bridge rails linking Station 1->2 and Station 2->3 ONLY between reading holds (no distracting racing orb!) */
.slide .time-rail {
  position: absolute;
  top: 386px;
  height: 2.5px;
  z-index: 2;
  pointer-events: none;
}
.slide .time-rail.seg-1 {
  left: 298px;
  width: 660px;
  background: linear-gradient(90deg, rgba(173, 74, 45, 0.44) 0%, rgba(47, 102, 78, 0.46) 100%);
}
.slide .time-rail.seg-2 {
  left: 958px;
  width: 590px;
  background: linear-gradient(90deg, rgba(47, 102, 78, 0.46) 0%, rgba(150, 86, 29, 0.44) 100%);
}

/* Pure GPU clip-path vertical dashed pins (zero dash stretch, zero SVG 0-width bbox bug!) */
.slide .pin-line {
  position: absolute;
  width: 4px;
  z-index: 2;
  pointer-events: none;
  border-left: 2.5px dashed var(--pin-color);
  opacity: 0.72;
}
.slide .pin-dot {
  position: absolute;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  margin-top: -6px;
  border-radius: 50%;
  background: var(--pin-color);
  box-shadow: 0 0 0 4px rgba(255, 251, 247, 0.72);
  z-index: 3;
  pointer-events: none;
}

.slide .station {
  position: absolute;
  top: 368px;
  width: 400px;
  z-index: 3;
  text-align: center;
}
.slide .time-pill {
  display: inline-flex;
  align-items: center;
  padding: 9px 22px;
  border-radius: 999px;
  font-family: var(--num);
  font-size: 21px;
  font-weight: 800;
  line-height: 1;
  color: #FFFBF7;
  box-shadow: 0 8px 18px rgba(80, 48, 28, 0.14);
}
.slide .time-pill.terra { background: var(--terra); }
.slide .time-pill.sage { background: var(--sage); }
.slide .time-pill.ochre { background: var(--ochre); }

.slide .station h3 {
  margin-top: 18px;
  font-family: var(--round);
  font-size: 38px;
  font-weight: 900;
  line-height: 1.2;
  color: var(--ink);
}

.slide .clay-screen {
  position: absolute;
  left: 830px;
  top: 710px;
  width: 154px;
  height: 158px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.slide .clay-screen small { font-size: 18px; font-weight: 700; color: var(--ink-2); }
.slide .clay-screen b {
  display: inline-block;
  margin-top: 4px;
  font-family: var(--num);
  font-size: 46px;
  font-weight: 900;
  line-height: 1;
  color: var(--sage);
  font-variant-numeric: tabular-nums;
}
.slide .clay-screen span {
  margin-top: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: #D6EBDF;
  font-size: 18px;
  font-weight: 800;
  color: #21523D;
}
</style>
<section class="slide canvas" data-nav="inline" data-transition="iris" data-iris-origin="48% 74%" data-focus-plan="1@0-2200, 2@2200-3820, 3@3820-5350" style="--focus-dim-opacity:0.26">
  <div class="asset-slot" data-slot="bakery-clay" data-mode="light">
    <img src="assets/clay-bakery-scene.jpg" alt="手工紙黏土烘焙坊三站場景底圖">
  </div>
  <div class="wash" data-layer="bg" aria-hidden="true"></div>

  <!-- Quiet segmented bridge rails: ONLY draw during brief transitions between stations so reading holds stay 100% still -->
  <div class="time-rail seg-1" data-wipe="right" data-delay="1900" data-dur="380" aria-hidden="true"></div>
  <div class="time-rail seg-2" data-wipe="right" data-delay="3520" data-dur="380" aria-hidden="true"></div>

  <!-- Station 1 (04:00, 0-2.20s): Pin drops -> oven ripple -> 740ms still reading hold -->
  <div class="pin-line" style="left:297px;top:494px;height:70px;--pin-color:#AD4A2D" data-wipe="down" data-delay="680" data-dur="420" aria-hidden="true"></div>
  <span class="pin-dot" style="left:298px;top:566px;--pin-color:#AD4A2D" data-pop data-delay="1060" aria-hidden="true"></span>
  <span class="target-ripple" style="left:298px;top:566px;--ripple-color:#AD4A2D;--ripple-soft:rgba(173,74,45,0.28)" data-ripple data-delay="1060" aria-hidden="true"></span>

  <!-- Station 2 (12:00, 2.20-3.82s): Pin drops -> clay tablet ripple -> 660ms still reading hold -->
  <div class="pin-line" style="left:957px;top:494px;height:144px;--pin-color:#2F664E" data-wipe="down" data-delay="2360" data-dur="440" aria-hidden="true"></div>
  <span class="pin-dot" style="left:958px;top:640px;--pin-color:#2F664E" data-pop data-delay="2760" aria-hidden="true"></span>
  <span class="target-ripple" style="left:958px;top:640px;--ripple-color:#2F664E;--ripple-soft:rgba(47,102,78,0.28)" data-ripple data-delay="2760" aria-hidden="true"></span>

  <!-- Station 3 (15:30, 3.82-5.35s): Pin drops -> bread basket ripple -> still reading hold -> full settle -->
  <div class="pin-line" style="left:1547px;top:494px;height:112px;--pin-color:#96561D" data-wipe="down" data-delay="3980" data-dur="420" aria-hidden="true"></div>
  <span class="pin-dot" style="left:1548px;top:608px;--pin-color:#96561D" data-pop data-delay="4360" aria-hidden="true"></span>
  <span class="target-ripple" style="left:1548px;top:608px;--ripple-color:#96561D;--ripple-soft:rgba(150,86,29,0.28)" data-ripple data-delay="4360" aria-hidden="true"></span>

  <nav class="slide-nav" data-auto-nav aria-label="章節"></nav>

  <h1 data-role="title">清晨到打烊的三個站</h1>
  <p class="lead" data-role="summary">三個時段接力，把報廢壓進 <em>4.2%</em>。</p>

  <!-- 3-station focus relay: active station stands crisp while unvisited stations soften to 0.26, settling 100% balanced at 5.35s -->
  <div class="station" style="left:98px" data-focus="1" data-focus-style="clean">
    <span class="time-pill terra">04:00 烤爐站</span>
    <h3>依天氣自動減量</h3>
  </div>

  <div class="station" style="left:758px" data-focus="2" data-focus-style="clean">
    <span class="time-pill sage">12:00 櫃檯站</span>
    <h3>午間即時看銷速</h3>
  </div>

  <div class="station" style="left:1348px" data-focus="3" data-focus-style="clean">
    <span class="time-pill ochre">15:30 補貨站</span>
    <h3>尖峰前小批補烤</h3>
  </div>

  <div class="clay-screen">
    <small>今日報廢</small>
    <b data-morph="hero-rate">4.2%</b>
    <span>達標</span>
  </div>
</section>
