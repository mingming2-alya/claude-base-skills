<style>
.slide {
  --ink: #2E221B;
  --ink-2: #544237;
  --muted: #6E5A4C;
  --terra: #AD4A2D;
  --sage: #2F664E;
  --ochre: #96561D;
  --round: "Chiron GoRound TC", var(--font-round-fallback);
  --sans: "Noto Sans TC", var(--font-sans-fallback);

  font-family: var(--sans);
}
.slide .wash {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(251, 241, 230, 0.42) 0%, rgba(251, 241, 230, 0.14) 48%, rgba(251, 241, 230, 0) 64%);
}
.slide svg.guides { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

.slide nav.slide-nav {
  position: absolute;
  left: 112px;
  top: 48px;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 32px;
  font-size: 21px;
  font-weight: 500;
  color: var(--muted);
}
.slide nav.slide-nav b {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--ink);
  font-weight: 800;
}
.slide nav.slide-nav b::before {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--terra);
  display: block;
}

.slide h1 {
  position: absolute;
  left: 112px;
  top: 114px;
  z-index: 3;
  font-family: var(--round);
  font-size: 86px;
  font-weight: 900;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.slide p.lead {
  position: absolute;
  left: 112px;
  top: 222px;
  z-index: 3;
  font-size: 32px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--ink-2);
}
.slide p.lead em { font-style: normal; color: var(--terra); }

.slide .station {
  position: absolute;
  top: 368px;
  width: 400px;
  z-index: 3;
  text-align: center;
}
.slide .time-pill {
  display: inline-flex;
  align-items: center;
  padding: 9px 22px;
  border-radius: 999px;
  font-family: var(--num);
  font-size: 21px;
  font-weight: 800;
  line-height: 1;
  color: #FFFBF7;
  box-shadow: 0 8px 18px rgba(80, 48, 28, 0.14);
}
.slide .time-pill.terra { background: var(--terra); }
.slide .time-pill.sage { background: var(--sage); }
.slide .time-pill.ochre { background: var(--ochre); }

.slide .station h3 {
  margin-top: 18px;
  font-family: var(--round);
  font-size: 38px;
  font-weight: 900;
  line-height: 1.2;
  color: var(--ink);
}

.slide .clay-screen {
  position: absolute;
  left: 830px;
  top: 710px;
  width: 154px;
  height: 158px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.slide .clay-screen small { font-size: 18px; font-weight: 700; color: var(--ink-2); }
.slide .clay-screen b {
  display: inline-block;
  margin-top: 4px;
  font-family: var(--num);
  font-size: 46px;
  font-weight: 900;
  line-height: 1;
  color: var(--sage);
  font-variant-numeric: tabular-nums;
}
.slide .clay-screen span {
  margin-top: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: #D6EBDF;
  font-size: 18px;
  font-weight: 800;
  color: #21523D;
}

<section class="slide canvas" data-nav="inline" data-motion-mode="stepped">
  <div class="asset-slot" data-slot="bakery-clay" data-mode="light">

  </div>

  <div class="station rv" style="left:98px" data-delay="120">
    <span class="time-pill terra">04:00 烤爐站</span>
    <h3>依天氣自動減量</h3>
  </div>

  <div class="station rv" style="left:758px" data-delay="240">

</section>
