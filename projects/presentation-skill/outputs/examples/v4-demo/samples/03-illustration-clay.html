<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>插畫場景（紙黏土）｜清晨到打烊的三個站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#F4E5D7;--ink:#2F251F;--sub:#5C4B40;--accent:#A8421E}
  body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .slide{position:relative;width:1920px;height:1080px;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;font-synthesis:none}
  .asset-slot{position:absolute;inset:0;z-index:0;pointer-events:none}
  .asset-slot>svg{width:100%;height:100%;display:block}
  nav.slide-nav{position:absolute;left:96px;top:48px;display:flex;gap:30px;font-weight:500;font-size:21px;line-height:1;color:var(--sub);z-index:3}
  nav.slide-nav b{color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:8px}
  nav.slide-nav b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
  .head{position:absolute;left:96px;top:106px;max-width:1180px;z-index:3}
  h2.title{font:900 76px/1.12 "Chiron GoRound TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
  p.lead{margin-top:16px;font-weight:700;font-size:32px;line-height:1.45;color:var(--ink)}
  p.lead em{font-style:normal;color:var(--accent)}
  .station{position:absolute;width:470px;z-index:3}
  .station .tag{display:inline-block;padding:8px 16px;border-radius:999px;background:#FBF2E9;color:#8D3313;font-weight:700;font-size:20px;line-height:1;margin-bottom:12px}
  .station h3{font-weight:700;font-size:32px;line-height:1.28;color:var(--ink)}
  .station p{margin-top:8px;font-weight:400;font-size:24px;line-height:1.48;color:var(--sub)}
  .st1{left:108px;top:376px}
  .st2{left:726px;top:376px}
  .st3{left:1344px;top:376px}
</style>
</head>
<body>
<section class="slide" data-kind="content" data-nav="inline">
  <div class="asset-slot" data-slot="bakery-morning" data-mode="light">
    <svg viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <radialGradient id="warmLight" cx="18%" cy="14%" r="85%">
          <stop offset="0%" stop-color="#FCF3EA"/>
          <stop offset="55%" stop-color="#F4E5D7"/>
          <stop offset="100%" stop-color="#E7CEBA"/>
        </radialGradient>
        <filter id="claySoft" x="-12%" y="-12%" width="128%" height="128%">
          <feDropShadow dx="10" dy="14" stdDeviation="12" flood-color="#8A5C3D" flood-opacity="0.22"/>
        </filter>
        <linearGradient id="counterTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EBD3BE"/>
          <stop offset="100%" stop-color="#DCB99D"/>
        </linearGradient>
        <linearGradient id="croissant" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#E9A965"/>
          <stop offset="100%" stop-color="#C67638"/>
        </linearGradient>
      </defs>
      <!-- Continuous bakery wall + warm tabletop (one unified place, no hard box split) -->
      <rect width="1920" height="1080" fill="url(#warmLight)"/>
      <!-- Back wall wood shelf bleeding off top-right edge -->
      <rect x="1360" y="138" width="600" height="28" rx="14" fill="#D5AD8C" filter="url(#claySoft)"/>
      <g filter="url(#claySoft)">
        <rect x="1450" y="62" width="64" height="78" rx="18" fill="#8FB39B"/>
        <rect x="1540" y="48" width="72" height="92" rx="22" fill="#E3B98E"/>
        <circle cx="1685" cy="96" r="44" fill="#D98B6C"/>
      </g>
      <!-- Long continuous bakery counter spanning full width at bottom -->
      <path d="M-20 630 H1940 V1100 H-20 Z" fill="url(#counterTop)"/>
      <path d="M-20 630 H1940" stroke="#F8ECDF" stroke-width="6"/>
      <!-- Soft clay connecting track across the 3 stations -->
      <path d="M290 795 C520 795 620 795 940 795 C1240 795 1380 795 1620 795" fill="none" stroke="#C99875" stroke-width="10" stroke-dasharray="18 16" stroke-linecap="round" opacity=".55"/>

      <!-- Station 1: Clay oven + morning forecast tablet -->
      <g transform="translate(150 676)" filter="url(#claySoft)">
        <rect x="0" y="12" width="270" height="220" rx="34" fill="#DFB89A"/>
        <rect x="26" y="44" width="218" height="130" rx="22" fill="#7D5038"/>
        <ellipse cx="95" cy="138" rx="46" ry="24" fill="url(#croissant)"/>
        <ellipse cx="178" cy="138" rx="42" ry="22" fill="url(#croissant)"/>
        <circle cx="236" cy="204" r="10" fill="#A8421E"/>
        <circle cx="204" cy="204" r="10" fill="#7A9E84"/>
      </g>
      <!-- Station 2: Clay checkout register + bread tray -->
      <g transform="translate(768 672)" filter="url(#claySoft)">
        <rect x="16" y="80" width="290" height="152" rx="30" fill="#9BB5A2"/>
        <rect x="46" y="18" width="166" height="98" rx="20" fill="#F8EFE6" stroke="#D3B49C" stroke-width="6"/>
        <rect x="70" y="42" width="76" height="14" rx="7" fill="#7A9E84"/>
        <rect x="70" y="68" width="114" height="14" rx="7" fill="#D5AD8C"/>
        <ellipse cx="256" cy="64" rx="46" ry="26" fill="url(#croissant)"/>
      </g>
      <!-- Station 3: Woven clay basket + fresh mid-day replenishment -->
      <g transform="translate(1394 686)" filter="url(#claySoft)">
        <path d="M18 68 H292 L268 214 C264 234 248 242 228 242 H82 C62 242 46 234 42 214 Z" fill="#C98A5B"/>
        <ellipse cx="102" cy="54" rx="54" ry="34" fill="url(#croissant)"/>
        <ellipse cx="198" cy="48" rx="58" ry="36" fill="#E3A55E"/>
        <ellipse cx="152" cy="68" rx="46" ry="26" fill="#D48447"/>
        <rect x="8" y="60" width="294" height="24" rx="12" fill="#DCA06F"/>
      </g>
      <!-- Left edge bleeding mug so objects surround at least 3 edges -->
      <g transform="translate(-32 760)" filter="url(#claySoft)">
        <rect x="0" y="0" width="108" height="128" rx="28" fill="#D98B6C"/>
        <path d="M104 30 C138 30 138 92 104 92" fill="none" stroke="#D98B6C" stroke-width="18" stroke-linecap="round"/>
      </g>
    </svg>
  </div><!-- /slot -->

  <nav class="slide-nav"><span>現況痛點</span><b>試點成果</b><span>導入節奏</span></nav>
  <header class="head">
    <h2 class="title" data-role="title">清晨到打烊的三個站</h2>
    <p class="lead" data-role="summary">預報系統接住每個時段，讓店裡<em>隨時有熱麵包、打烊不再剩滿架</em>。</p>
  </header>

  <div class="station st1">
    <span class="tag">04:00 烤爐站</span>
    <h3>依天氣自動減量</h3>
    <p>凌晨產出首波備料盤數，雨天自動少烤冷門品，守住原料成本。</p>
  </div>
  <div class="station st2">
    <span class="tag">12:00 櫃檯站</span>
    <h3>午間即時看銷速</h3>
    <p>收銀回傳前四小時賣出比例，熱門品賣超預期立刻亮起補烤提示。</p>
  </div>
  <div class="station st3">
    <span class="tag">15:30 補貨站</span>
    <h3>精準小批補烤</h3>
    <p>下班尖峰前只補高周轉 3 款，把打烊報廢壓在 4.2% 以內。</p>
  </div>
</section>
</body>
</html>
