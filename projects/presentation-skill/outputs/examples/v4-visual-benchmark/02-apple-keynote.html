<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>B｜大膽・Apple 發表（精簡減字版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Geist:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --stage-bg: #0A0C10;
    --fg: #F5F6F8;
    --sub: #A2A6B0;
    --muted: #7C828E;
    --grad: linear-gradient(92deg, #7CEEF9 0%, #4AC3FA 48%, #4BE2A5 100%);
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --num: "Geist", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--stage-bg); }
  .slide {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: var(--stage-bg);
    color: var(--fg);
    font-family: var(--sans);
    font-synthesis: none;
  }
  svg.backdrop { position: absolute; inset: 0; pointer-events: none; }

  nav {
    position: absolute;
    left: 0;
    right: 0;
    top: 46px;
    display: flex;
    justify-content: center;
    gap: 44px;
    font-size: 20px;
    font-weight: 500;
    line-height: 1;
    color: var(--muted);
  }
  nav b { color: var(--fg); font-weight: 700; }

  header {
    position: absolute;
    left: 0;
    right: 0;
    top: 118px;
    text-align: center;
  }
  h1 {
    font-size: 128px;
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: -0.02em;
    color: var(--fg);
  }
  h1 span.ver {
    font-family: var(--num);
    font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-left: 12px;
  }
  p.tag {
    margin-top: 22px;
    font-size: 42px;
    font-weight: 500;
    line-height: 1.35;
    color: #D2D5DC;
  }
  p.tag em {
    font-style: normal;
    font-weight: 700;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* Central precision glass tablet UI */
  .device {
    position: absolute;
    left: 560px;
    top: 446px;
    width: 800px;
    height: 664px;
    border-radius: 48px 48px 0 0;
    background: linear-gradient(180deg, #171B24 0%, #0E1118 62%, #090B10 100%);
    padding: 36px 42px 0;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      0 28px 90px rgba(0, 0, 0, 0.65);
  }
  .dev-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 22px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.09);
  }
  .dev-store { font-size: 22px; font-weight: 700; color: #D9DDE5; }
  .dev-weather {
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(74, 195, 250, 0.14);
    border: 1px solid rgba(74, 195, 250, 0.34);
    font-size: 18px;
    font-weight: 700;
    color: #7CEEF9;
  }

  .dev-body {
    display: grid;
    grid-template-columns: 1.06fr 0.94fr;
    gap: 30px;
    margin-top: 28px;
  }
  .metric-k { font-size: 19px; font-weight: 500; color: var(--sub); }
  .metric-v {
    margin-top: 8px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .metric-v b {
    font-family: var(--num);
    font-size: 84px;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .metric-v b small { font-size: 38px; font-weight: 700; color: #4BE2A5; }
  .badge-ok {
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(75, 226, 165, 0.16);
    border: 1px solid rgba(75, 226, 165, 0.35);
    font-size: 18px;
    font-weight: 700;
    color: #6CEFB9;
  }

  .chart-box {
    margin-top: 24px;
    padding: 18px 20px 14px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .chart-head {
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: 600;
    color: var(--sub);
    margin-bottom: 12px;
  }
  .chart-head em { font-style: normal; color: #6CEFB9; }

  .batch-list { display: flex; flex-direction: column; gap: 16px; }
  .batch-title { font-size: 19px; font-weight: 700; color: var(--sub); margin-bottom: 2px; }
  .batch-row {
    padding: 18px 20px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .batch-row.hl {
    background: rgba(74, 195, 250, 0.08);
    border-color: rgba(74, 195, 250, 0.28);
  }
  .b-top { display: flex; justify-content: space-between; align-items: baseline; }
  .b-top strong { font-size: 22px; font-weight: 700; color: var(--fg); }
  .b-top b {
    font-family: var(--num);
    font-size: 24px;
    font-weight: 800;
    color: #7CEEF9;
    font-variant-numeric: tabular-nums;
  }
  .b-track {
    margin-top: 14px;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }
  .b-fill { height: 100%; border-radius: 999px; background: var(--grad); }

  /* True Apple Keynote callouts: ONLY 2 crisp tiers — ZERO prose paragraphs */
  .side { position: absolute; width: 370px; }
  .side.left { left: 96px; text-align: right; }
  .side.right { left: 1454px; text-align: left; }
  .side .hero-val {
    font-family: var(--num);
    font-size: 56px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .side .hero-val.accent {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .side .hero-val small {
    font-family: var(--sans);
    font-size: 26px;
    font-weight: 700;
    margin-left: 6px;
  }
  .side .hero-title {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--fg);
  }
  .side .label {
    margin-top: 10px;
    font-size: 24px;
    font-weight: 500;
    color: var(--sub);
  }
</style>
</head>
<body>
<div class="slide">
  <svg class="backdrop" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <filter id="blur48" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
        <feGaussianBlur stdDeviation="48"/>
      </filter>
      <filter id="blur14" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
      <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#67E8F9"/>
        <stop offset="42%" stop-color="#38BDF8"/>
        <stop offset="76%" stop-color="#34D399"/>
        <stop offset="100%" stop-color="#FBBF24"/>
      </linearGradient>
    </defs>

    <ellipse cx="960" cy="1080" rx="720" ry="200" fill="#2DD4BF" opacity="0.16" filter="url(#blur48)"/>
    <ellipse cx="740" cy="940" rx="340" ry="180" fill="#38BDF8" opacity="0.14" filter="url(#blur48)"/>
    <rect x="558" y="444" width="804" height="680" rx="50" fill="none" stroke="url(#rimGrad)" stroke-width="34" opacity="0.34" filter="url(#blur48)"/>
    <rect x="558" y="444" width="804" height="680" rx="50" fill="none" stroke="url(#rimGrad)" stroke-width="6" opacity="0.82" filter="url(#blur14)"/>
    <rect x="559" y="445" width="802" height="680" rx="49" fill="none" stroke="url(#rimGrad)" stroke-width="2.5"/>

    <g stroke="rgba(255,255,255,0.24)" stroke-width="1.5">
      <line x1="486" y1="628" x2="556" y2="628"/>
      <line x1="486" y1="858" x2="556" y2="858"/>
      <line x1="1364" y1="628" x2="1434" y2="628"/>
      <line x1="1364" y1="858" x2="1434" y2="858"/>
    </g>
    <g fill="#7CEEF9">
      <circle cx="556" cy="628" r="4"/>
      <circle cx="556" cy="858" r="4"/>
      <circle cx="1364" cy="628" r="4"/>
      <circle cx="1364" cy="858" r="4"/>
    </g>
  </svg>

  <nav aria-label="章節">
    <span>現況痛點</span>
    <b>試點成果</b>
    <span>導入節奏</span>
  </nav>

  <header>
    <h1>星塵預報<span class="ver">2.0</span></h1>
    <p class="tag">凌晨四點，算好<em>剛剛好的出爐量</em>。</p>
  </header>

  <div class="device">
    <div class="dev-top">
      <span class="dev-store">信義旗艦店・今日排程</span>
      <span class="dev-weather">降雨 80%・18°C</span>
    </div>

    <div class="dev-body">
      <div>
        <div class="metric-k">預估報廢率</div>
        <div class="metric-v">
          <b>4.2<small>%</small></b>
          <span class="badge-ok">低於 6% 紅線</span>
        </div>

        <div class="chart-box">
          <div class="chart-head">
            <span>8 週走勢</span>
            <em>4.2% vs 11.4%</em>
          </div>
          <svg width="330" height="156" viewBox="0 0 330 156" aria-hidden="true">
            <defs>
              <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#34D399" stop-opacity="0.34"/>
                <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <line x1="0" y1="78" x2="330" y2="78" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" stroke-dasharray="5 5"/>
            <path d="M 8 36 C 52 26, 80 54, 120 40 C 160 26, 198 50, 242 32 C 274 20, 302 44, 322 30"
                  fill="none" stroke="rgba(255,255,255,0.34)" stroke-width="2" stroke-dasharray="6 5"/>
            <path d="M 8 56 C 54 68, 94 88, 146 98 C 202 109, 260 116, 322 120 L 322 150 L 8 150 Z" fill="url(#areaG)"/>
            <path d="M 8 56 C 54 68, 94 88, 146 98 C 202 109, 260 116, 322 120"
                  fill="none" stroke="#4BE2A5" stroke-width="3.2" stroke-linecap="round"/>
            <circle cx="322" cy="120" r="6" fill="#7CEEF9"/>
            <circle cx="322" cy="120" r="12" fill="#7CEEF9" opacity="0.22"/>
          </svg>
        </div>
      </div>

      <div class="batch-list">
        <div class="batch-title">建議出爐盤數</div>
        <div class="batch-row hl">
          <div class="b-top"><strong>招牌鹽可頌</strong><b>18 盤</b></div>
          <div class="b-track"><div class="b-fill" style="width:86%"></div></div>
        </div>
        <div class="batch-row">
          <div class="b-top"><strong>酸種歐包</strong><b>6 盤</b></div>
          <div class="b-track"><div class="b-fill" style="width:42%"></div></div>
        </div>
        <div class="batch-row">
          <div class="b-top"><strong>職人生吐司</strong><b>10 盤</b></div>
          <div class="b-track"><div class="b-fill" style="width:62%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Crisp 2-tier Apple Keynote callouts (all spoken explanation lives in speaker notes) -->
  <div class="side left" style="top:586px">
    <div class="hero-val accent">−63%</div>
    <div class="label">打烊報廢盤數</div>
  </div>
  <div class="side left" style="top:820px">
    <div class="hero-title">氣象 × 連假</div>
    <div class="label">雨天自動減量</div>
  </div>

  <div class="side right" style="top:586px">
    <div class="hero-val">12<small>分鐘</small></div>
    <div class="label">清晨確認排程</div>
  </div>
  <div class="side right" style="top:820px">
    <div class="hero-val">34<small>萬</small></div>
    <div class="label">單店年省原料</div>
  </div>
</div>
</body>
</html>
