<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>C｜驚喜・插畫場景（真實 AI 紙黏土底圖 × HTML 真文字・精簡減字版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@800;900&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #2E221B;
    --ink-2: #544237;
    --muted: #6E5A4C;
    --terra: #AD4A2D;
    --sage: #2F664E;
    --ochre: #96561D;
    --round: "Chiron GoRound TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --num: "Nunito", "Noto Sans TC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F5E6D6; }
  .slide {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--sans);
    font-synthesis: none;
  }

  .asset-slot { position: absolute; inset: 0; z-index: 0; }
  .asset-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .wash {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(251, 241, 230, 0.42) 0%, rgba(251, 241, 230, 0.14) 48%, rgba(251, 241, 230, 0) 64%);
  }

  svg.guides { position: absolute; inset: 0; z-index: 2; pointer-events: none; }

  nav {
    position: absolute;
    left: 112px;
    top: 48px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 32px;
    font-size: 21px;
    font-weight: 500;
    color: var(--muted);
  }
  nav b {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
    font-weight: 800;
  }
  nav b i { width: 10px; height: 10px; border-radius: 50%; background: var(--terra); display: block; }

  h1 {
    position: absolute;
    left: 112px;
    top: 114px;
    z-index: 3;
    font-family: var(--round);
    font-size: 86px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  p.lead {
    position: absolute;
    left: 112px;
    top: 222px;
    z-index: 3;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--ink-2);
  }
  p.lead em { font-style: normal; color: var(--terra); }

  /* Ultra-airy 2-tier station hooks floating above the 3 clay objects — zero prose paragraphs */
  .station {
    position: absolute;
    top: 368px;
    width: 400px;
    z-index: 3;
    text-align: center;
  }
  .time-pill {
    display: inline-flex;
    align-items: center;
    padding: 9px 22px;
    border-radius: 999px;
    font-family: var(--num);
    font-size: 21px;
    font-weight: 800;
    line-height: 1;
    color: #FFFBF7;
    box-shadow: 0 8px 18px rgba(80, 48, 28, 0.14);
  }
  .time-pill.terra { background: var(--terra); }
  .time-pill.sage { background: var(--sage); }
  .time-pill.ochre { background: var(--ochre); }

  .station h3 {
    margin-top: 18px;
    font-family: var(--round);
    font-size: 38px;
    font-weight: 900;
    line-height: 1.2;
    color: var(--ink);
  }

  .clay-screen {
    position: absolute;
    left: 830px;
    top: 710px;
    width: 154px;
    height: 158px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .clay-screen small { font-size: 18px; font-weight: 700; color: var(--ink-2); }
  .clay-screen b {
    margin-top: 4px;
    font-family: var(--num);
    font-size: 46px;
    font-weight: 900;
    line-height: 1;
    color: var(--sage);
    font-variant-numeric: tabular-nums;
  }
  .clay-screen span {
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #D6EBDF;
    font-size: 18px;
    font-weight: 800;
    color: #21523D;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="asset-slot" data-slot="bakery-clay" data-mode="light">
    <img src="assets/clay-bakery-scene.jpg" alt="手工紙黏土烘焙坊三站場景底圖">
  </div>
  <div class="wash" aria-hidden="true"></div>

  <svg class="guides" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <g stroke-width="2" stroke-dasharray="5 6" fill="none">
      <line x1="298" y1="494" x2="298" y2="564" stroke="#AD4A2D" stroke-opacity="0.55"/>
      <line x1="958" y1="494" x2="958" y2="638" stroke="#2F664E" stroke-opacity="0.55"/>
      <line x1="1548" y1="494" x2="1548" y2="606" stroke="#96561D" stroke-opacity="0.55"/>
    </g>
    <circle cx="298" cy="566" r="5" fill="#AD4A2D"/>
    <circle cx="958" cy="640" r="5" fill="#2F664E"/>
    <circle cx="1548" cy="608" r="5" fill="#96561D"/>
  </svg>

  <nav aria-label="章節">
    <span>現況痛點</span>
    <b><i></i>試點成果</b>
    <span>導入節奏</span>
  </nav>

  <h1>清晨到打烊的三個站</h1>
  <p class="lead">三個時段接力，把報廢壓進 <em>4.2%</em>。</p>

  <div class="station" style="left:98px">
    <span class="time-pill terra">04:00 烤爐站</span>
    <h3>依天氣自動減量</h3>
  </div>

  <div class="station" style="left:758px">
    <span class="time-pill sage">12:00 櫃檯站</span>
    <h3>午間即時看銷速</h3>
  </div>

  <div class="station" style="left:1348px">
    <span class="time-pill ochre">15:30 補貨站</span>
    <h3>尖峰前小批補烤</h3>
  </div>

  <div class="clay-screen">
    <small>今日報廢</small>
    <b>4.2%</b>
    <span>達標</span>
  </div>
</div>
</body>
</html>
