<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>十二款意象總覽</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=block">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:2000px;background:#EEEBE4;font-family:"Noto Sans TC",sans-serif;color:#2A2622;padding:40px 40px 24px}
  .grid{display:grid;grid-template-columns:repeat(3,627px);gap:30px 19px}
  figure img{display:block;width:627px;height:353px;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
  figcaption{display:flex;gap:12px;align-items:baseline;margin-top:10px;font:700 25px/1 "Noto Sans TC"}
  figcaption span{font:500 19px/1 "Noto Sans TC";color:#6E665C}
</style></head><body><div class="grid" id="g"></div>
<script>
const items=[['01a-illustration-clay','01 插畫場景','可切換：黏土・手繪・霓虹'],['02b-blocks-3d-wood','02 積木構成','可切換：2D 幾何・3D 積木'],['03b-ink-oil','03 水彩水墨','可切換：黑白水墨・厚油彩・彩色水彩'],
['04-apple','04 Apple 發表','產品發表・大會開場'],['05-scroll','05 書卷刻本','文化講座・讀書會'],['06a-counsel-boardroom','06 顧問報告 A','深色董事會（待選）'],['06b-counsel-blocks','06 顧問報告 B','色塊策略（待選）'],['06c-counsel-swiss','06 顧問報告 C','瑞士大數字（待選）'],
['07-riso','07 孔版小誌','社群活動・市集'],['08-deco','08 摩登金','尾牙・頒獎・典禮'],['09-everyday','09 日常工作款','週會・進度回報（重做）'],
['10-photo','10 攝影雜誌','年度回顧・電影劇照（重做）'],['11-trend','11 年輕潮流','行銷・社群・招募'],['12-retro','12 在地懷舊','週年回顧・在地文化']];
document.getElementById('g').innerHTML=items.map(([f,n,u])=>`<figure><img src="img/${f}.jpg"><figcaption>${n}<span>${u}</span></figcaption></figure>`).join('');
</script></body></html>
