<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>06c 顧問報告（瑞士大數字）｜選址三方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Archivo:wght@300;500;700;800&display=block">
<style>
  :root{--bg:#F6F5F1;--ink:#111214;--sub:#5B5E64;--red:#D7301B;--redText:#C02A16;--rule:#CFCDC6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Archivo","Noto Sans TC",sans-serif}
  nav{position:absolute;left:120px;top:58px;display:flex;font:500 21px/1 "Noto Sans TC";color:var(--sub);letter-spacing:.06em}
  nav span,nav b{padding-right:40px}
  nav b{color:var(--ink);font-weight:700}
  nav b::before{content:"";display:inline-block;width:12px;height:12px;background:var(--red);margin-right:10px}
  h2{position:absolute;left:118px;top:132px;font:700 72px/1.15 "Noto Sans TC";letter-spacing:.02em}
  .grid{position:absolute;left:120px;top:300px;width:1680px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:40px}
  .c{border-top:3px solid var(--ink);padding-top:22px}
  .c.best{border-top-color:var(--red)}
  .c header{display:flex;justify-content:space-between;font:700 30px/1 "Noto Sans TC";letter-spacing:.06em}
  .c header span{font:500 22px/1 "Noto Sans TC";color:var(--sub)}
  .c.best header span{color:var(--redText);font-weight:700}
  .num{margin-top:18px;font:800 330px/.82 "Archivo";letter-spacing:-.06em}
  .c.best .num{color:var(--red)}
  .c:not(.best) .num{color:#2A2C30}
  .unit{margin-top:22px;font:500 26px/1.5 "Noto Sans TC";color:#33363B}
  .unit b{font:700 26px/1 "Archivo";color:var(--ink)}
  .line{position:absolute;left:120px;top:842px;width:1680px;height:0;border-top:1px solid var(--rule)}
  p.lead{position:absolute;left:120px;top:880px;width:1100px;font:500 34px/1.5 "Noto Sans TC";letter-spacing:.02em}
  p.lead em{font-style:normal;font-weight:900;color:var(--redText)}
  .src{position:absolute;right:120px;top:900px;width:420px;text-align:right;font:400 19px/1.6 "Noto Sans TC";color:var(--sub)}
</style>
</head>
<body>
<div class="slide">
  <nav aria-label="章節"><span>背景</span><b>三個方案</b><span>風險</span><span>下一步</span></nav>
  <h2>三個選址方案</h2>
  <div class="grid">
    <section class="c best"><header>B　台中<span>建議</span></header><div class="num">14</div><p class="unit">個月量產・<b>2028.02</b><br>投資 <b>48</b> 億</p></section>
    <section class="c"><header>A　高雄<span>晚 5 個月</span></header><div class="num">20</div><p class="unit">個月量產・<b>2028.08</b><br>投資 <b>62</b> 億</p></section>
    <section class="c"><header>C　越南<span>晚 11 個月</span></header><div class="num">26</div><p class="unit">個月量產・<b>2029.02</b><br>投資 <b>35</b> 億</p></section>
  </div>
  <div class="line"></div>
  <p class="lead">訂單高峰在第 15 個月（2028 Q1），只有<em>台中</em>在那之前量產。</p>
  <p class="src">人才 30 公里內可招募・審批不需跨國<br>資料：2026 年第三季內部評估</p>
</div>
</body>
</html>
