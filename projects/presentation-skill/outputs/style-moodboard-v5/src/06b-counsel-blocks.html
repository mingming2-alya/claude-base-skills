<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>06b 顧問報告（色塊策略）｜選址三方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Archivo:wght@600;700;800;900&display=block">
<style>
  :root{--bg:#F1EFEA;--ink:#141619;--sub:#585D66;--green:#0D6B4F;--greenText:#0B5E45;--gray:#CFCAC1;--gray2:#B9B3A8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Archivo","Noto Sans TC",sans-serif}
  nav{position:absolute;left:120px;top:58px;display:flex;gap:34px;font:500 21px/1 "Noto Sans TC";color:var(--sub);letter-spacing:.06em}
  nav b{color:var(--ink);font-weight:900}
  h2{position:absolute;left:116px;top:136px;font:900 86px/1.12 "Noto Sans TC";letter-spacing:.01em}
  p.lead{position:absolute;left:120px;top:300px;width:600px;font:500 34px/1.55 "Noto Sans TC";letter-spacing:.02em}
  p.lead em{font-style:normal;font-weight:900;color:var(--greenText)}
  ul{position:absolute;left:120px;top:520px;width:600px;list-style:none;border-top:2px solid var(--ink)}
  li{display:grid;grid-template-columns:120px 1fr;padding:22px 0;border-bottom:1px solid #D3CFC6;font:500 26px/1.4 "Noto Sans TC"}
  li b{font:900 22px/1.6 "Noto Sans TC";letter-spacing:.2em;color:var(--greenText)}
  .src{position:absolute;left:120px;top:1000px;font:400 18px/1 "Noto Sans TC";color:#5D6168;letter-spacing:.04em}
  .blk{position:absolute;bottom:0;width:300px;padding:0 30px 44px;display:flex;flex-direction:column;justify-content:flex-end}
  .blk b{display:block;font:900 128px/.9 "Archivo";letter-spacing:-.04em;white-space:nowrap}
  .blk b span{font:900 30px/1 "Noto Sans TC";letter-spacing:0;margin-left:6px}
  .blk strong{display:block;margin-top:18px;font:900 40px/1.2 "Noto Sans TC";letter-spacing:.06em}
  .blk small{display:block;margin-top:8px;font:500 22px/1.4 "Noto Sans TC"}
  .peak{position:absolute;left:820px;width:1100px;border-top:4px dashed var(--ink)}
  .peak span{position:absolute;left:30px;top:-46px;font:900 24px/1 "Noto Sans TC";letter-spacing:.06em;background:var(--bg);padding:6px 12px}
</style>
</head>
<body>
<div class="slide">
  <nav aria-label="章節"><span>背景</span><b>三個方案</b><span>風險</span><span>下一步</span></nav>
  <h2>三個選址方案</h2>
  <p class="lead">只有<em>台中</em>能在 2028 年第一季的訂單高峰前量產；高雄與越南都會錯過。</p>
  <ul>
    <li><b>人才</b>30 公里內招募得到，產線熟手多</li>
    <li><b>審批</b>不需跨國核准，時程最不會變</li>
    <li><b>投資</b>48 億，介於高雄與越南之間</li>
  </ul>
  <p class="src">資料：2026 年第三季內部評估；金額為新台幣</p>

  <!-- the bar chart is the poster: block height = months to mass production -->
  <section class="blk" style="left:860px;height:504px;background:var(--green);color:#F4F2EC"><b>14<span>個月</span></b><strong>B　台中</strong><small style="color:#CFE5DB">2028.02 量產<br>投資 48 億</small></section>
  <section class="blk" style="left:1180px;height:720px;background:var(--gray)"><b>20<span>個月</span></b><strong>A　高雄</strong><small style="color:#3F444B">2028.08 量產<br>投資 62 億</small></section>
  <section class="blk" style="left:1500px;height:936px;background:var(--gray2)"><b>26<span>個月</span></b><strong>C　越南</strong><small style="color:#33373D">2029.02 量產<br>投資 35 億</small></section>
  <div class="peak" style="top:540px"><span>2028 Q1 訂單高峰</span></div>
</div>
</body>
</html>
