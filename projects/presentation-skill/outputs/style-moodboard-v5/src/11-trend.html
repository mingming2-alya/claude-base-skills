<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>11 年輕潮流｜暑期實習招募</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Gabarito:wght@700;800;900&display=block">
<style>
  :root{--bg:#CFF15A;--ink:#111111;--pink:#FF8AD8;--orange:#FF7A2E;--sky:#7CC6FF;--yellow:#FFE14D;--cream:#FFFBF0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Gabarito","Noto Sans TC",sans-serif}
  nav{position:absolute;left:110px;top:58px;display:flex;gap:14px;font:700 22px/1 "Noto Sans TC";letter-spacing:.04em}
  nav span,nav b{padding:12px 20px;border:3.5px solid var(--ink);border-radius:999px;background:var(--cream)}
  nav b{background:var(--ink);color:var(--bg)}
  h2{position:absolute;left:104px;top:150px;font:900 150px/1 "Noto Sans TC";letter-spacing:-.01em}
  h2 span{display:inline-block;margin-left:22px;font:900 132px/1 "Gabarito";color:var(--cream);-webkit-text-stroke:5px var(--ink);text-shadow:9px 9px 0 var(--ink);transform:rotate(-4deg)}
  p.key{position:absolute;left:110px;top:372px;font:900 64px/1.45 "Noto Sans TC";letter-spacing:.01em}
  p.key mark{background:var(--pink);color:var(--ink);padding:0 14px;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);border-radius:10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .facts{position:absolute;left:110px;top:640px;display:flex;flex-wrap:wrap;gap:16px;width:760px}
  .facts span{padding:14px 22px;border:3.5px solid var(--ink);border-radius:14px;background:var(--cream);font:700 27px/1 "Noto Sans TC";box-shadow:6px 6px 0 var(--ink)}
  .facts b{font:800 28px/1 "Gabarito"}
  .card{position:absolute;width:420px;padding:30px 34px 34px;border:5px solid var(--ink);border-radius:26px;box-shadow:12px 12px 0 var(--ink)}
  .card .ic{width:84px;height:84px;border:4px solid var(--ink);border-radius:20px;background:var(--cream);display:grid;place-items:center}
  .card h3{margin-top:22px;font:900 50px/1.1 "Noto Sans TC";letter-spacing:.02em}
  .card p{margin-top:12px;font:700 26px/1.45 "Noto Sans TC"}
  .card .n{position:absolute;right:28px;top:30px;padding:8px 14px;border:3.5px solid var(--ink);border-radius:999px;background:var(--cream);font:800 22px/1 "Noto Sans TC"}
  .burst{position:absolute;left:1520px;top:70px;width:250px;height:250px;transform:rotate(12deg)}
  .burst div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:900 30px/1.15 "Noto Sans TC"}
  .burst b{display:block;font:900 58px/1 "Gabarito"}
</style>
</head>
<body>
<div class="slide">
  <nav aria-label="章節"><b>計畫介紹</b><span>三種職缺</span><span>怎麼申請</span></nav>
  <h2>暑期實習<span>2027</span></h2>
  <p class="key">三種職缺，<br><mark>總有一個是你</mark>。</p>
  <div class="facts"><span><b>7–8</b> 月・八週</span><span>有薪・可遠端兩天</span><span>每組一位導師</span></div>

  <div class="card" style="left:1000px;top:330px;background:var(--pink);transform:rotate(-6deg)">
    <span class="n">4 人</span>
    <div class="ic"><svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M8 44 L12 32 L36 8 L44 16 L20 40 Z"/><path d="M30 14 L38 22"/></svg></div>
    <h3>設計</h3><p>做出真的會上線的畫面</p>
  </div>
  <div class="card" style="left:1400px;top:430px;background:var(--orange);transform:rotate(4deg)">
    <span class="n">6 人</span>
    <div class="ic"><svg width="56" height="52" viewBox="0 0 56 52" fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M18 12 L6 26 L18 40"/><path d="M38 12 L50 26 L38 40"/><path d="M32 6 L24 46"/></svg></div>
    <h3>工程</h3><p>寫的程式每天有人在用</p>
  </div>
  <div class="card" style="left:1080px;top:690px;background:var(--sky);transform:rotate(-2deg)">
    <span class="n">3 人</span>
    <div class="ic"><svg width="56" height="52" viewBox="0 0 56 52" fill="none" stroke="#111" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"><path d="M8 20 H18 L40 8 V44 L18 32 H8 Z"/><path d="M18 32 L22 46"/><path d="M47 18 Q52 26 47 34"/></svg></div>
    <h3>行銷</h3><p>經營十萬人追蹤的帳號</p>
  </div>

  <div class="burst">
    <svg width="250" height="250" viewBox="0 0 250 250" style="position:absolute;inset:0;overflow:visible">
      <path id="star" fill="#FFE14D" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    </svg>
    <div><span>報名截止<b>3/31</b></span></div>
  </div>
</div>
<script>
// a 16-point burst sticker
let d = '';
for (let i = 0; i < 32; i++) {
  const a = (i / 32) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 98 : 124;
  d += (i ? 'L' : 'M') + (125 + Math.cos(a) * r).toFixed(1) + ' ' + (125 + Math.sin(a) * r).toFixed(1) + ' ';
}
const star = document.getElementById('star');
star.setAttribute('d', d + 'Z');
star.parentNode.insertAdjacentHTML('afterbegin', `<path d="${d}Z" fill="#111" transform="translate(10 10)"/>`);
</script>
</body>
</html>
