<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>06a 顧問報告（深色董事會）｜選址三方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:wght@400;500;600&display=block">
<style>
  :root{--bg:#0B1830;--ivory:#EEE8DA;--gold:#CFAE68;--muted:#9AA5B8;--hair:rgba(238,232,218,.16)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;color:var(--ivory);font-family:"Noto Serif TC",serif;
    background:radial-gradient(1200px 760px at 50% 40%, #13284A 0%, #0B1830 62%, #071122 100%)}
  nav{position:absolute;left:120px;top:58px;display:flex;gap:46px;font:500 21px/1 "Noto Sans TC";letter-spacing:.2em;color:#8893A8}
  nav b{color:var(--gold);font-weight:500;padding-bottom:12px;border-bottom:1px solid var(--gold)}
  h2{position:absolute;left:120px;top:136px;font:700 78px/1.15 "Noto Serif TC";letter-spacing:.1em}
  h2::after{content:"";display:block;width:96px;height:1px;background:var(--gold);margin-top:30px}
  .cols{position:absolute;left:120px;top:330px;width:1680px;display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
  .col{position:relative;padding:34px 40px 30px;border-top:1px solid var(--hair)}
  .col.best{border:1px solid var(--gold);background:linear-gradient(180deg,rgba(207,174,104,.10),rgba(207,174,104,0) 60%)}
  .col .tag{position:absolute;right:30px;top:30px;font:500 18px/1 "Noto Sans TC";letter-spacing:.3em;color:var(--bg);background:var(--gold);padding:8px 12px 8px 16px}
  .col .l{font:400 92px/1 "Cormorant Garamond";color:var(--muted);letter-spacing:.02em}
  .col.best .l{color:var(--gold)}
  .col h3{margin-top:8px;font:700 40px/1.2 "Noto Serif TC";letter-spacing:.14em}
  .col dl{margin-top:28px;display:grid;grid-template-columns:auto 1fr;row-gap:0}
  .col dt,.col dd{padding:16px 0;border-top:1px solid var(--hair);font:500 22px/1.2 "Noto Sans TC";color:var(--muted);letter-spacing:.06em}
  .col dd{text-align:right;font:500 30px/1 "Cormorant Garamond";color:var(--ivory);letter-spacing:.02em}
  .col dd span{font:500 20px/1 "Noto Sans TC";color:var(--muted);margin-left:6px}
  .col.best dd.hot{color:var(--gold)}
  .col.late dd.hot{color:#E59A84}
  p.lead{position:absolute;left:120px;top:922px;width:1300px;font:500 34px/1.5 "Noto Serif TC";letter-spacing:.06em}
  p.lead em{font-style:normal;color:var(--gold);font-weight:700}
  .src{position:absolute;right:120px;top:944px;font:400 18px/1.5 "Noto Sans TC";color:#8893A8;letter-spacing:.06em;text-align:right}
</style>
</head>
<body>
<div class="slide">
  <nav aria-label="章節"><span>背景</span><b>三個方案</b><span>風險</span><span>下一步</span></nav>
  <h2>三個選址方案</h2>
  <div class="cols">
    <section class="col late"><div class="l">A</div><h3>高雄</h3>
      <dl><dt>量產時間</dt><dd class="hot">20<span>個月</span></dd><dt>量產日期</dt><dd>2028.08</dd><dt>投資</dt><dd>62<span>億</span></dd><dt>訂單高峰</dt><dd style="font-family:'Noto Sans TC';font-size:22px;color:#E59A84">晚 5 個月</dd></dl></section>
    <section class="col best"><span class="tag">建議</span><div class="l">B</div><h3>台中</h3>
      <dl><dt>量產時間</dt><dd class="hot">14<span>個月</span></dd><dt>量產日期</dt><dd>2028.02</dd><dt>投資</dt><dd>48<span>億</span></dd><dt>訂單高峰</dt><dd style="font-family:'Noto Sans TC';font-size:22px;color:var(--gold)">趕得上</dd></dl></section>
    <section class="col late"><div class="l">C</div><h3>越南</h3>
      <dl><dt>量產時間</dt><dd class="hot">26<span>個月</span></dd><dt>量產日期</dt><dd>2029.02</dd><dt>投資</dt><dd>35<span>億</span></dd><dt>訂單高峰</dt><dd style="font-family:'Noto Sans TC';font-size:22px;color:#E59A84">晚 11 個月</dd></dl></section>
  </div>
  <p class="lead">三案之中，只有<em>台中</em>趕得上 2028 年第一季的訂單高峰。</p>
  <p class="src">資料：2026 年第三季內部評估<br>金額為新台幣</p>
</div>
</body>
</html>
