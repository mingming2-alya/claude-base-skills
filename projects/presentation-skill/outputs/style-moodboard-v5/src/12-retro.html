<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>13 在地懷舊｜創業五十年</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Chocolate+Classical+Sans&family=Alfa+Slab+One&display=block">
<style>
  :root{--paper:#F1E4C8;--ink:#2A231D;--sub:#6C5D4C;--red:#C23A2E;--teal:#1F7A6E;--mustard:#E2A72E;--navy:#23324F}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Chocolate Classical Sans","Noto Sans TC",sans-serif;font-synthesis:none}
  svg{position:absolute;inset:0}
  nav{position:absolute;left:110px;top:60px;display:flex;gap:12px;font:400 23px/1 "Chocolate Classical Sans";letter-spacing:.08em;color:var(--sub)}
  nav span,nav b{padding:10px 16px;border:2px dashed #B49E7E;border-radius:6px;background:#EBDBB8}
  nav b{font-weight:400;color:#F6EBD3;background:#186559;border:2px solid #186559}
  h2{position:absolute;left:110px;top:156px;font:400 42px/1.2 "Chocolate Classical Sans";letter-spacing:.14em}
  .sign{position:absolute;left:104px;top:160px;padding:34px 48px 38px;background:var(--red);color:#F8EEDB;border-radius:10px;
    box-shadow:inset 0 0 0 6px #C23A2E, inset 0 0 0 9px #F3D9A8, 0 10px 0 #8F2A21}
  .sign p{font:900 108px/1.15 "Noto Sans TC";letter-spacing:.08em}
  p.lead{position:absolute;left:110px;top:440px;font:400 40px/1.5 "Chocolate Classical Sans";letter-spacing:.06em}
  p.lead em{font-style:normal;color:var(--red)}
  .sign em{font-style:normal;color:#FFD36E}
  .tickets{position:absolute;left:110px;top:580px;display:flex;gap:26px}
  .tk{position:relative;width:200px;height:200px;padding:20px 20px 0;background:#E7D2A4;border-radius:10px;box-shadow:0 3px 0 #C5AE80}
  .tk::before,.tk::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
  .tk::before{left:-11px}.tk::after{right:-11px}
  .tk b{display:block;font:400 44px/1 "Alfa Slab One";color:var(--red);letter-spacing:.02em}
  .tk span{display:block;margin-top:44px;font:400 25px/1.4 "Chocolate Classical Sans";letter-spacing:.04em}
  .tk.now{background:var(--mustard)}
  .tk.now b{color:var(--ink)}
  .cal{position:absolute;left:1268px;top:236px;width:500px;height:660px;background:#FBF4E4;border-radius:6px 6px 0 0;text-align:center;overflow:hidden}
  .cal header{background:var(--red);color:#F8EEDB;padding:22px 0 18px;font:400 30px/1.2 "Chocolate Classical Sans";letter-spacing:.3em}
  .cal header b{display:block;font:400 26px/1.2 "Chocolate Classical Sans";letter-spacing:.5em;margin-top:6px;color:#FFD36E;font-weight:400}
  .cal .m{margin-top:26px;font:900 36px/1 "Noto Serif TC";letter-spacing:.3em;color:var(--sub)}
  .cal .d{font:400 280px/1 "Alfa Slab One";color:var(--red);letter-spacing:-.02em;margin-top:6px}
  .cal .w{font:900 36px/1 "Noto Serif TC";letter-spacing:.4em}
  .cal .yi{display:flex;justify-content:center;gap:18px;margin-top:30px;font:400 26px/1 "Chocolate Classical Sans"}
  .cal .yi span{padding:12px 16px;border:2px solid var(--ink)}
  .cal .yi span:first-child{background:var(--ink);color:#FBF4E4}
</style>
</head>
<body>
<div class="slide">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <defs>
      <!-- Taiwanese majolica tile: four quarter discs meet into rings across tiles -->
      <pattern id="tile" width="160" height="160" patternUnits="userSpaceOnUse" x="1100" y="0">
        <rect width="160" height="160" fill="#F2E3C2"/>
        <g fill="#1F7A6E"><path d="M0 0 h46 a46 46 0 0 1 -46 46 z"/><path d="M160 0 v46 a46 46 0 0 1 -46 -46 z"/><path d="M0 160 v-46 a46 46 0 0 1 46 46 z"/><path d="M160 160 h-46 a46 46 0 0 1 46 -46 z"/></g>
        <g fill="#E2A72E"><path d="M0 0 h22 a22 22 0 0 1 -22 22 z"/><path d="M160 0 v22 a22 22 0 0 1 -22 -22 z"/><path d="M0 160 v-22 a22 22 0 0 1 22 22 z"/><path d="M160 160 h-22 a22 22 0 0 1 22 -22 z"/></g>
        <g fill="#C23A2E" stroke="#23324F" stroke-width="2">
          <ellipse cx="80" cy="46" rx="16" ry="30"/><ellipse cx="80" cy="114" rx="16" ry="30"/>
          <ellipse cx="46" cy="80" rx="30" ry="16"/><ellipse cx="114" cy="80" rx="30" ry="16"/>
        </g>
        <circle cx="80" cy="80" r="14" fill="#E2A72E" stroke="#23324F" stroke-width="2"/>
        <g fill="#2E8A7C"><path d="M80 80 L60 60 Q44 56 40 40 Q56 44 60 60 Z"/><path d="M80 80 L100 60 Q104 44 120 40 Q116 56 100 60 Z"/><path d="M80 80 L60 100 Q56 116 40 120 Q44 104 60 100 Z"/><path d="M80 80 L100 100 Q116 104 120 120 Q104 116 100 100 Z"/></g>
        <rect x="3" y="3" width="154" height="154" fill="none" stroke="#23324F" stroke-opacity=".35" stroke-width="2"/>
      </pattern>
      <filter id="wear" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".5" numOctaves="3" seed="9"/>
        <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 2.2 -1.25"/>
      </filter>
      <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A231D" stop-opacity=".22"/><stop offset=".06" stop-color="#2A231D" stop-opacity="0"/></linearGradient>
      <filter id="soft" filterUnits="userSpaceOnUse" x="1100" y="0" width="820" height="1080"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <!-- the tiled wall -->
    <rect x="1100" y="0" width="820" height="1080" fill="url(#tile)"/>
    <rect x="1100" y="0" width="820" height="1080" fill="url(#shade)"/>
    <rect x="1100" y="0" width="12" height="1080" fill="#B49E7E"/>
    <!-- calendar shadow, string and nail -->
    <rect x="1290" y="262" width="500" height="660" fill="#2A231D" opacity=".28" filter="url(#soft)"/>
    <path d="M1458 238 L1518 160 L1578 238" fill="none" stroke="#2A231D" stroke-width="3"/>
    <circle cx="1518" cy="156" r="10" fill="#4A4038"/><circle cx="1515" cy="153" r="3" fill="#8E8376"/>
    <!-- pages under the top page, and its torn edge -->
    <rect x="1272" y="896" width="492" height="16" fill="#EFE5CF"/><rect x="1276" y="912" width="484" height="12" fill="#E4D8BE"/>
    <path id="torn" fill="#FBF4E4"/>
    <rect width="1920" height="1080" filter="url(#wear)" opacity=".5"/>
  </svg>

  <nav aria-label="章節"><span>創業</span><b>五十年</b><span>下一個五十年</span></nav>
  <div class="sign"><p>創業五十年</p></div>
  <p class="lead">五十年，我們<em>還在同一條街</em>。</p>
  <div class="tickets">
    <div class="tk"><b>1976</b><span>鐵皮屋裡<br>開張</span></div>
    <div class="tk"><b>1988</b><span>第一台<br>自動機</span></div>
    <div class="tk"><b>2003</b><span>搬進<br>工業區</span></div>
    <div class="tk now"><b>2026</b><span>第五十年</span></div>
  </div>

  <div class="cal">
    <header>中華民國六十五年<b>一九七六</b></header>
    <p class="m">三月</p>
    <p class="d">12</p>
    <p class="w">星期五</p>
    <div class="yi"><span>宜</span><span>開市</span><span>立券</span><span>交易</span></div>
  </div>
</div>
<script>
// torn bottom edge of the top page
let d = 'M1268 880 ';
for (let x = 1268; x <= 1768; x += 14) d += `L${x} ${(896 + Math.sin(x * 1.7) * 4 + (x % 28 ? 5 : -2)).toFixed(1)} `;
d += 'L1768 880 Z';
document.getElementById('torn').setAttribute('d', d);
</script>
</body>
</html>
