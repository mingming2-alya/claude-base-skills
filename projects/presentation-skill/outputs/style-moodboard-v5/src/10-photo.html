<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>10 攝影雜誌｜年度回顧（電影劇照）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=block">
<style>
  :root{--bar:#050607;--fg:#F4EFE6;--amber:#FFB561}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bar)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bar);color:var(--fg);font-family:"Noto Serif TC",serif}
  svg{position:absolute;left:0;top:138px}
  nav{position:absolute;left:0;right:0;top:58px;display:flex;justify-content:center;gap:56px;font:400 21px/1 "Noto Sans TC";letter-spacing:.3em;color:#8C8A86}
  nav b{color:var(--fg);font-weight:500}
  .title{position:absolute;left:150px;top:262px}
  .title small{display:block;font:500 24px/1 "Noto Sans TC";letter-spacing:.6em;color:rgba(244,239,230,.86);margin-bottom:26px}
  .title h2{font:300 168px/1 "Noto Serif TC";letter-spacing:.32em;text-shadow:0 6px 40px rgba(0,0,0,.45)}
  .acts{position:absolute;right:150px;top:276px;text-align:right;font:500 24px/2.1 "Noto Serif TC";letter-spacing:.18em;color:rgba(244,239,230,.88);text-shadow:0 2px 14px rgba(0,0,0,.55)}
  .acts b{font:600 26px/1 "Cormorant Garamond";letter-spacing:.2em;color:var(--amber);margin-right:18px}
  .sub{position:absolute;left:0;right:0;top:982px;text-align:center;font:500 44px/1.3 "Noto Serif TC";letter-spacing:.08em}
  .sub em{font-style:normal;color:var(--amber)}
  .cap{position:absolute;right:56px;top:1030px;font:400 18px/1 "Noto Sans TC";letter-spacing:.2em;color:#8A8781}
</style>
</head>
<body>
<div class="slide">
  <svg width="1920" height="804" viewBox="0 0 1920 804" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0C2229"/><stop offset=".3" stop-color="#2C4C55"/><stop offset=".55" stop-color="#9A7562"/><stop offset=".68" stop-color="#E9955A"/><stop offset=".74" stop-color="#FFCB8E"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#A86F4F"/><stop offset=".08" stop-color="#4F5552"/><stop offset=".45" stop-color="#1C2D33"/><stop offset="1" stop-color="#081115"/>
      </linearGradient>
      <linearGradient id="glint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2B0"/><stop offset=".5" stop-color="#FF9D52" stop-opacity=".5"/><stop offset="1" stop-color="#FF9D52" stop-opacity="0"/></linearGradient>
      <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FD0FF" stop-opacity="0"/><stop offset=".5" stop-color="#BDEBFF"/><stop offset="1" stop-color="#6FD0FF" stop-opacity="0"/></linearGradient>
      <radialGradient id="vig" cx="55%" cy="58%" r="78%"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
      <linearGradient id="rays" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FFD9A6" stop-opacity=".55"/><stop offset="1" stop-color="#FFD9A6" stop-opacity="0"/></linearGradient>
      <filter id="b80" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="80"/></filter>
      <filter id="b24" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="24"/></filter>
      <filter id="b6" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="b2" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="shimmer" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600">
        <feTurbulence type="fractalNoise" baseFrequency=".004 .11" numOctaves="2" seed="4" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="90" xChannelSelector="R" yChannelSelector="G" result="d"/>
        <feGaussianBlur in="d" stdDeviation="2"/>
      </filter>
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="21"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>
    <!-- sky and the sun sitting on the horizon (rule of thirds) -->
    <rect width="1920" height="600" fill="url(#sky)"/>
    <ellipse cx="1290" cy="470" rx="900" ry="300" fill="#FF9A4E" opacity=".35" filter="url(#b80)"/>
    <g opacity=".5" filter="url(#b24)"><ellipse cx="520" cy="300" rx="520" ry="22" fill="#C98266"/><ellipse cx="1500" cy="250" rx="420" ry="16" fill="#8F6C62"/><ellipse cx="900" cy="390" rx="600" ry="14" fill="#E39A6C"/></g>
    <!-- light shafts -->
    <g filter="url(#b24)" opacity=".55" id="rays"></g>
    <circle cx="1290" cy="560" r="150" fill="#FFD7A0" opacity=".55" filter="url(#b80)"/>
    <circle cx="1290" cy="568" r="34" fill="#FFF4DC" filter="url(#b2)"/>
    <!-- sea -->
    <rect y="596" width="1920" height="208" fill="url(#sea)"/>
    <rect x="0" y="592" width="1920" height="8" fill="#FFC587" opacity=".6" filter="url(#b6)"/>
    <rect x="1250" y="598" width="80" height="210" fill="url(#glint)" filter="url(#shimmer)"/>
    <!-- anamorphic streak and a few ghosts -->
    <rect x="220" y="563" width="2140" height="9" fill="url(#flare)" opacity=".75" filter="url(#b2)"/>
    <rect x="420" y="565" width="1740" height="3" fill="url(#flare)" opacity=".95"/>
    <g fill="#9FDDFF" opacity=".09" filter="url(#b6)"><circle cx="1120" cy="500" r="14"/><circle cx="1010" cy="452" r="26"/><circle cx="860" cy="388" r="40"/></g>
    <!-- foreground rocks and a lone figure, rim lit by the sun -->
    <path d="M0 804 L0 690 C90 676 170 700 250 668 C330 640 420 650 470 664 C520 676 560 650 610 662 C680 680 720 720 800 744 C860 762 930 780 1000 804 Z" fill="#05090B"/>
    <path d="M1600 804 C1660 770 1720 760 1780 740 C1830 724 1880 730 1920 720 L1920 804 Z" fill="#05090B"/>
    <g transform="translate(640 668)">
      <path d="M-9 -112 C-17 -96 -19 -70 -17 -50 L-15 -24 L-12 0 L-4 0 L-2 -38 L3 -38 L5 0 L13 0 L15 -24 L18 -52 C20 -72 17 -96 10 -112 C4 -118 -4 -118 -9 -112 Z" fill="#04080A"/>
      <circle cx="0" cy="-128" r="12" fill="#04080A"/>
      <path d="M14 -110 C19 -96 20 -72 18 -52 L15 -24" stroke="#FF9E5A" stroke-width="2" fill="none" opacity=".75"/>
      <path d="M8 -138 C14 -134 15 -124 11 -117" stroke="#FFB774" stroke-width="2" fill="none" opacity=".8"/>
    </g>
    <!-- grade: teal shadows, warm highlights, then vignette and grain -->
    <rect width="1920" height="804" fill="#0E3A44" opacity=".18" style="mix-blend-mode:soft-light"/>
    <rect width="1920" height="804" fill="url(#vig)"/>
    <rect width="1920" height="804" filter="url(#grain)" opacity=".16" style="mix-blend-mode:overlay"/>
  </svg>

  <nav aria-label="章節"><b>序幕</b><span>第一幕</span><span>第二幕</span><span>第三幕</span></nav>
  <div class="title"><small>年度回顧・二〇二六</small><h2>這一年</h2></div>
  <div class="acts">
    <p><b>I</b>做到的三件事</p>
    <p><b>II</b>沒做好的一件事</p>
    <p><b>III</b>明年想去的地方</p>
  </div>
  <p class="sub">這一年，我們都在<em>現場</em>。</p>
</div>
<script>
// light shafts fanning up from the sun
let r = '';
for (const [a, w] of [[-150, 60], [-128, 36], [-110, 80], [-95, 30], [-75, 70], [-58, 34], [-40, 56]]) {
  const rad = a * Math.PI / 180, L = 900, cx = 1290, cy = 560;
  const x2 = cx + Math.cos(rad) * L, y2 = cy + Math.sin(rad) * L, nx = -Math.sin(rad) * w, ny = Math.cos(rad) * w;
  r += `<polygon points="${cx},${cy} ${x2 + nx},${y2 + ny} ${x2 - nx},${y2 - ny}" fill="url(#rays)"/>`;
}
document.getElementById('rays').innerHTML = r;
</script>
</body>
</html>
