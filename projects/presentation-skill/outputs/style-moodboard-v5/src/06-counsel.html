<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>06 顧問報告｜選址三方案</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=block">
<style>
  :root{--paper:#F4F3EE;--ink:#0E2340;--sub:#56637A;--rule:#C9CED6;--hi:#0A7A5C;--hiText:#0A6B51;--late:#C2412D;--muted:#AEB7C3}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
  .slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Source Serif 4","Noto Sans TC",serif}
  svg{position:absolute;inset:0}
  nav{position:absolute;left:120px;top:56px;display:flex;font:500 21px/1 "Noto Sans TC";letter-spacing:.08em;color:var(--sub)}
  nav span,nav b{padding:0 28px;border-left:1px solid var(--rule)}
  nav span:first-child{padding-left:0;border-left:0}
  nav b{color:var(--ink);font-weight:700}
  h2{position:absolute;left:120px;top:138px;font:700 36px/1.2 "Noto Serif TC";letter-spacing:.12em}
  h2::after{content:"";display:block;width:1100px;height:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding-top:3px;margin-top:22px}
  p.key{position:absolute;left:116px;top:222px;font:900 76px/1.3 "Noto Serif TC";letter-spacing:.02em}
  p.key em{font-style:normal;color:var(--hiText)}
  .hero{position:absolute;left:1330px;top:128px;width:470px;padding-left:44px;border-left:1px solid var(--rule)}
  .hero small{display:block;font:700 20px/1 "Noto Sans TC";letter-spacing:.2em;color:var(--sub)}
  .hero b{display:block;margin-top:6px;font:600 250px/.9 "Source Serif 4";color:var(--hiText);letter-spacing:-.04em;font-variation-settings:"opsz" 60}
  .hero b span{font:700 54px/1 "Noto Serif TC";letter-spacing:.06em;margin-left:10px}
  .hero p{margin-top:14px;font:500 24px/1.55 "Noto Sans TC";color:#34405A;letter-spacing:.02em}
  .lab{position:absolute;font:500 19px/1 "Noto Sans TC";color:var(--sub);letter-spacing:.06em;white-space:nowrap}
  .row{position:absolute;left:120px;width:250px}
  .row strong{display:block;font:700 30px/1.2 "Noto Serif TC";letter-spacing:.06em}
  .row span{display:block;margin-top:6px;font:500 21px/1 "Noto Sans TC";color:var(--sub)}
  .row.best strong{color:var(--hiText)}
  .end{position:absolute;font:600 25px/1 "Source Serif 4";white-space:nowrap}
  .end small{font:500 20px/1 "Noto Sans TC";color:var(--sub);margin-left:10px}
  .end.late{color:var(--late)}
  .end.best{color:var(--hiText)}
  .dl{position:absolute;font:700 21px/1.35 "Noto Sans TC";color:var(--late);letter-spacing:.06em;white-space:nowrap}
  .proof{position:absolute;left:120px;top:932px;width:1680px;display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
  .proof div{padding:22px 30px 0 0;font:500 24px/1.45 "Noto Sans TC"}
  .proof b{display:block;font:700 19px/1 "Noto Sans TC";color:var(--hiText);letter-spacing:.2em;margin-bottom:10px}
  .src{position:absolute;right:120px;top:1030px;font:400 18px/1 "Noto Sans TC";color:#5D697A;letter-spacing:.04em}
</style>
</head>
<body>
<div class="slide">
  <svg width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" id="chart">
    <defs>
      <pattern id="late" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#E9C7BF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#C2412D" stroke-width="3"/></pattern>
    </defs>
  </svg>

  <nav aria-label="章節"><span>背景</span><b>三個方案</b><span>風險</span><span>下一步</span></nav>
  <h2>三個選址方案</h2>
  <p class="key">只有<em>台中</em>，<br>趕得上 2028 年的訂單高峰。</p>
  <div class="hero">
    <small>比次快的方案提早</small>
    <b>6<span>個月</span></b>
    <p>台中 14 個月量產；高雄 20 個月、越南 26 個月，都錯過高峰。</p>
  </div>
  <div id="labels"></div>
  <div class="proof">
    <div><b>人才</b>30 公里內招募得到，產線熟手多</div>
    <div><b>審批</b>不需跨國核准，時程最不會變</div>
    <div><b>投資</b>48 億，介於高雄與越南之間</div>
  </div>
  <p class="src">資料：2026 年第三季內部評估；金額為新台幣</p>
</div>
<script>
// Race to the order peak. Month 0 = decision in Dec 2026; the peak is Mar 2028 (month 15).
const X0 = 420, X1 = 1760, M = 27, x = m => X0 + (m / M) * (X1 - X0);
const rows = [
  { name: '方案 B　台中', sub: '投資 48 億', m: 14, y: 598, best: true, end: '2028.02' },
  { name: '方案 A　高雄', sub: '投資 62 億', m: 20, y: 708, end: '2028.08' },
  { name: '方案 C　越南', sub: '投資 35 億', m: 26, y: 818, end: '2029.02' },
];
const PEAK = 15;
let s = '', L = '';
// time axis
s += `<line x1="${X0}" y1="540" x2="${X1}" y2="540" stroke="#0E2340" stroke-width="1.5"/>`;
for (const [m, t] of [[13, '2028'], [25, '2029']]) {
  s += `<line x1="${x(m)}" y1="534" x2="${x(m)}" y2="546" stroke="#0E2340" stroke-width="1.5"/>`;
  L += `<div class="lab" style="left:${x(m) - 22}px;top:506px">${t}</div>`;
}
for (let m = 0; m <= M; m += 3) s += `<line x1="${x(m)}" y1="560" x2="${x(m)}" y2="880" stroke="#DADDE2" stroke-width="1"/>`;
L += `<div class="lab" style="left:${X0}px;top:506px">2026.12 決策</div>`;
// tracks
for (const r of rows) {
  const late = r.m > PEAK;
  s += `<rect x="${X0}" y="${r.y}" width="${x(r.m) - X0}" height="42" fill="${r.best ? '#0A7A5C' : '#AEB7C3'}"/>`;
  if (late) s += `<rect x="${x(PEAK)}" y="${r.y}" width="${x(r.m) - x(PEAK)}" height="42" fill="url(#late)"/>`;
  if (r.best) s += `<path d="M${x(r.m) - 40} ${r.y + 21} l8 8 l14 -16" fill="none" stroke="#F4F3EE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  L += `<div class="row${r.best ? ' best' : ''}" style="top:${r.y - 4}px"><strong>${r.name}</strong><span>${r.sub}</span></div>`;
  if (r.best) L += `<div class="end best" style="left:${x(PEAK) + 18}px;top:${r.y + 9}px">${r.end}<small>趕上高峰</small></div>`;
  else L += `<div class="end late" style="right:${1920 - x(r.m)}px;top:${r.y - 34}px">${r.end}<small>晚 ${r.m - PEAK} 個月</small></div>`;
}
// the deadline
s += `<line x1="${x(PEAK)}" y1="566" x2="${x(PEAK)}" y2="884" stroke="#C2412D" stroke-width="3"/>`;
s += `<polygon points="${x(PEAK) - 9},560 ${x(PEAK) + 9},560 ${x(PEAK)},572" fill="#C2412D"/>`;
L += `<div class="dl" style="left:${x(PEAK) + 14}px;top:552px">2028 Q1 訂單高峰</div>`;
document.getElementById('chart').insertAdjacentHTML('beforeend', s);
document.getElementById('labels').innerHTML = L;
</script>
</body>
</html>
