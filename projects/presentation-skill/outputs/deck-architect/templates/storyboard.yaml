# storyboard.yaml（deck-architect v5.0）：架構、章節導航、逐頁 slide_plan 分鏡、講者備註與 constraints 的唯一真相來源。
# Gate 1b 簽核本檔（含 slide_plan）與 brief.md；自由編排頁寫於 slides/<NN>-*.html，由 lint.py 與 check.mjs 雙軌把關後再跑 assemble.py。
# 未寫客製檔的頁面由輕底盤元件渲染。

meta:
  title: 2026 年度回顧               # 封面主標
  # kicker: 內部分享                 # 封面小標（可省略）
  subtitle: 從困境到轉型的一年       # 封面副標（可省略）
  presenter: 王小明 · 產品部         # 封面講者（可省略）
  date: 2026.12                      # 封面日期（可省略）
  delivery: talk                     # talk（上台講）/ discuss（會議討論）/ read（自己讀）/ auto（自動播放）
  stage_mode: pitch                  # Gate 1a 拍板：briefing（匯報）/ pitch（提案）/ keynote（發表會）
  # nav_mode: top-bar                # Gate 2b 依 stage_mode × 風格定案：top-bar（頂列）/ minimal-side（右側錨點）/ divider-only（僅扉頁）
  # presenter_tools: [grid, annotator, speaker]  # Layer 1 講者工具（talk/discuss 預設全開；read/auto 預設僅 grid；[] 關閉）
  # modules: [media, linked-highlight]           # 可選白名單：若投影片誤用未宣告模組，assemble.py 會印 [WARN]
  style: counsel                     # Gate 2a/2b 選定後填入（已就緒：workday / counsel / apple / illustration）
  mode: light                        # Gate 2b 依明暗策略填入：light / dark（單頁可用 surface: dark|light|split|photo 覆寫）
  palette: 貼題綠                    # Gate 2b 定案的 OKLCH 配色名稱（寫進 deck.css）
  minutes: 15                        # 總時長（分鐘），lint 會檢查時間預算與節奏
  pages: 12                          # 頁數上限（含封面與自動目錄，不含附件頁），可省略
  # toc: auto                       # 目錄頁：auto（依章數自動，預設）/ none（不要目錄）/ agenda（封面後一頁目錄）/ per-chapter（每章前一頁）
  # format: section                  # 作為大簡報一章（一頁總覽）：不需封面與頁碼
  lang: zh-Hant                      # zh-Hant 時 lint 會自動偵測誤殘留的簡體字

structure:
  start: 主管們知道今年營收持平，但不清楚團隊做了什麼轉型
  destination: 支持明年擴編兩人
  axis: time                         # time / process / causal / abstraction / importance / scale / distance / intensity / custom
  direction: 過去 → 未來
  axis_note: ""
  sensitivity: false                 # 有人際顧慮設 true（禁止價值軸並警告「你們」）

# 來自 brief.md 的限制與地雷：limitations 與補充口徑放 notes 或 appendix 即通過，不強迫塞入主頁畫布
constraints:
  limitations:
    - 預估多承接 15 個客戶為試算目標，尚未計入大型客製專案
  forbidden:
    - 保證零延遲
  must_include:
    - 30 天

# 章節：導航（章節列、目錄、頁籤、data-auto-nav）全由這裡單一來源自動產生
chapters:
  - id: past
    label: 年初的困境
    minutes: 3
  - id: shift
    label: 轉型的半年
    minutes: 7
  - id: next
    label: 明年的方向
    minutes: 4

# 逐頁內容與 slide_plan（Gate 1b 核心分鏡契約）：
# - slide_plan.job：7 類認知任務擇一（magnitude 量體 / delta 對比 / mechanism 機制因果 / triage 狀態拍板 /
#                   demo 實證操演 / resonance 共鳴停頓 / scaffold 教學演練・正反範例・步驟清單）
# - slide_plan.reveal：0-step（進頁從容自動展開）或 step(N)（≥3 依序推導防破梗，N ≤ 5）
# - slide_plan.zones：≤4 個空間分區配比 ＋ 單向視線動線 1→2→3
# - slide_plan.visual_encoding：寫明用哪種幾何／圖解直接取代哪段解釋文字
# - slide_plan.anchors：畫布核心短錨點（每卡 ≤2 層字，背景與口徑說明一律放 notes）
# - signature: true 標記最關鍵的 1 頁（Gate 2a 派 3 位乾淨 Builder 子代理拿這頁真實內容並行比稿）

slides:
  - type: cover

  - type: shock
    role: opener
    text: 如果重來一次，你還會這樣過今年嗎？
    notes: 序幕。請 2–3 位回答，每人 15 秒，不評論。

  - chapter: past
    title: 年初的處境
    layout: number
    value: "0%"
    label: 上半年營收成長
    source: 2026 上半年財務報告
    notes: 先讓大家回到年初的感覺，不要急著解釋原因。背景（被問到再講）：連續兩季持平，三個主要客戶續約延後。

  - chapter: past
    title: 問題出在哪
    layout: point
    key: 客戶要的不是更多功能，是==更快上手==
    support: 訪談 24 位客戶，19 位提到導入太慢

  - chapter: shift
    title: 我們做了什麼
    layout: steps
    items:
      - label: 砍掉 40% 設定步驟
        detail: "移除重複表單\n預設套用標準範本"
      - label: 每位新客戶配導入專員
        detail: 前兩週每日 15 分鐘同步
      - label: 教學影片壓進 3 分鐘
        detail: 每個操作獨立成一支短片

  - chapter: shift
    title: 導入時間
    signature: true
    layout: compare
    slide_plan:                         # Gate 1b 結構化分鏡契約（Builder 與 Critic 的共同驗收依據）
      job: delta                        # magnitude / delta / mechanism / triage / demo / resonance / scaffold
      reveal: 0-step                    # 0-step 或 step(N)
      zones:
        - "1 頁首題目與核心差距摘要 (18%)"
        - "2 左半轉型前 45 天人工時間條 (41%)"
        - "3 右半轉型後 12 天陪跑時間條＋拖曳把 (41%)"
      visual_encoding: "左右比例長度與拖曳分割線直接編碼 45 天 → 12 天縮減幅度，取代流程說明長文"
      anchors:
        - "45 天 → 12 天上線"
        - "專員陪跑兩週"
    director:                           # Gate 2b 選定風格後可補齊模組、原型與動效細節
      hero: 左右拖曳前後對比畫面（45 天人工導入 vs 12 天標準化陪跑）
      module: compare-slider
      archetype: interactive-proof
      choreo: "transition=zoom-rise; 靜態停 50% 即看懂差距，現場可拖曳"
    left:
      heading: 轉型前
      items: [平均 45 天上線, 客戶要自己讀文件]
    right:
      heading: 轉型後
      items: [平均 ==12 天==上線, 專員陪跑兩週]
    source: 2026 內部客戶導入紀錄（N=24）

  - chapter: shift
    title: 客戶怎麼說
    layout: quote
    text: 這是我們第一次在一個月內讓全公司都用起來的系統。
    source: 某製造業客戶 IT 主管

  - type: shock
    text: 下半年，營收成長 38%
    sub: 而且沒有增加任何一位業務
    source: 2026 下半年財務報告
    notes: 停兩秒再說話。

  - chapter: next
    title: 明年需要的支持
    layout: bullets
    items:
      - 導入專員從 2 人擴編到 ==4 人==
      - 目標：新客戶 30 天內完成導入
      - 預估多承接 15 個客戶
    notes: 備註限制：預估多承接 15 個客戶為試算目標，尚未計入大型客製專案。

  - type: closing
    text: 謝謝
    sub: 歡迎提問
