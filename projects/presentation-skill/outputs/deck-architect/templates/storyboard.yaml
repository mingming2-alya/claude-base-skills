# storyboard.yaml（deck-architect v4）：整份簡報唯一的內容來源。
# 修改文字、架構、限制與地雷一律改這裡，再跑 lint.py 與 assemble.py。
# 自由編排頁面放在 slides/<NN>-*.html（或由 file: 指定）；未寫客製檔的頁面由輕底盤元件渲染。

meta:
  title: 2026 年度回顧               # 封面主標
  # kicker: 內部分享                 # 封面小標（可省略）
  subtitle: 從困境到轉型的一年       # 封面副標（可省略）
  presenter: 王小明 · 產品部         # 封面講者（可省略）
  date: 2026.12                      # 封面日期（可省略）
  delivery: talk                     # talk（上台講）/ discuss（會議討論）/ read（自己讀）/ auto（自動播放）
  stage_mode: pitch                  # Step 1a 拍板：briefing（匯報）/ pitch（提案）/ keynote（發表會）
  # nav_mode: top-bar                # Step 3a 依 stage_mode × 風格定案：top-bar（頂列）/ minimal-side（右側錨點）/ divider-only（僅扉頁）
  # presenter_tools: [grid, annotator, speaker]  # Layer 1 講者工具（talk/discuss 預設全開；read/auto 預設僅 grid；[] 關閉）
  # modules: [media, linked-highlight]           # 可選白名單：若投影片誤用未宣告模組，assemble.py 會印 [WARN]
  style: counsel                     # Step 3a 選定後填入（已就緒：workday / counsel / apple / illustration）
  mode: light                        # Step 3a 依明暗策略填入：light / dark（單頁可用 surface: dark|light|split|photo 覆寫）
  palette: 貼題綠                    # Step 3b 選定的三組 OKLCH 配色之一（寫進 deck.css）
  minutes: 15                        # 總時長（分鐘），lint 會檢查時間預算與節奏
  pages: 12                          # 頁數上限（含封面與自動目錄，不含附件頁），可省略
  # format: section                  # 作為大簡報一章（一頁總覽）：不需封面與頁碼
  lang: zh-Hant                      # zh-Hant 時 lint 會自動偵測誤殘留的簡體字

structure:
  start: 主管們知道今年營收持平，但不清楚團隊做了什麼轉型
  destination: 支持明年擴編兩人
  axis: time                         # time / process / causal / abstraction / importance / scale / distance / intensity / custom
  direction: 過去 → 未來
  axis_note: ""
  sensitivity: false                 # 有人際顧慮設 true（禁止價值軸並警告「你們」）

# 來自 brief.md 的限制與地雷：由 lint.py 自動把關
constraints:
  limitations:
    - 預估多承接 15 個客戶為試算目標，尚未計入大型客製專案
  forbidden:
    - 保證零延遲
  must_include:
    - 30 天

# 章節：導航（章節列、目錄、頁籤、data-auto-nav）全由這裡單一來源自動產生
chapters:
  - id: past
    label: 年初的困境
    minutes: 3
  - id: shift
    label: 轉型的半年
    minutes: 7
  - id: next
    label: 明年的方向
    minutes: 4

# 逐頁內容：
# - type: cover / content（預設）/ shock（加 role: opener 可當開場提問）/ closing
# - layout: 14 核心形狀（point / bullets / number / stats / steps / timeline / compare / lanes /
#           table / quote / image / pillars / status-table）＋ 5 圖表形狀（chart-bar / chart-donut /
#           chart-trend / chart-people / chart-map）＋ scene / free
# - file: 指向自由編排片段（例 slides/03-chart.html）；也可依檔名 slides/03-*.html 自動對應
# - signature: true 標記整份簡報的招牌頁（Step 3b 樣張優先挑它）
# - surface: dark|light|split|photo 逐頁極性，Step 3a 依明暗策略補上
# - talk 模式守原則 #26：每組最多兩層字（例：巨數＋標籤），背景與因果說明放 notes
# - series: 同一類頁面寫相同名稱，刻意維持一致結構
# - steps 的 detail 可用 \n 指定斷行
# - appendix: true + id + link 可建立現場點入、按 Esc 返回的附件頁

slides:
  - type: cover

  - type: shock
    role: opener
    text: 如果重來一次，你還會這樣過今年嗎？
    notes: 序幕。請 2–3 位回答，每人 15 秒，不評論。

  - chapter: past
    title: 年初的處境
    layout: number
    value: "0%"
    label: 上半年營收成長
    source: 2026 上半年財務報告
    notes: 先讓大家回到年初的感覺，不要急著解釋原因。背景（被問到再講）：連續兩季持平，三個主要客戶續約延後。

  - chapter: past
    title: 問題出在哪
    layout: point
    key: 客戶要的不是更多功能，是==更快上手==
    support: 訪談 24 位客戶，19 位提到導入太慢

  - chapter: shift
    title: 我們做了什麼
    layout: steps
    items:
      - label: 砍掉 40% 設定步驟
        detail: "移除重複表單\n預設套用標準範本"
      - label: 每位新客戶配導入專員
        detail: 前兩週每日 15 分鐘同步
      - label: 教學影片壓進 3 分鐘
        detail: 每個操作獨立成一支短片

  - chapter: shift
    title: 導入時間
    signature: true
    layout: compare
    director:                           # 極簡分鏡（briefing 僅關鍵頁填寫；pitch/keynote 建議逐頁填寫）
      hero: 左右拖曳前後對比畫面（45 天人工導入 vs 12 天標準化陪跑）  # Step 2 寫：這頁的視覺主角，對應 brief 的說服載體
      module: compare-slider            # Step 2 寫：說服載體需要的內容模組（無則填 none）
      archetype: interactive-proof      # Step 3a 後補：依選定風格的版面語法挑做法，可對應 references/recipes/
      choreo: "transition=zoom-rise; 靜態停 50% 即看懂差距，現場可拖曳"  # Step 3a 後補：依風格 motion_dna 與 visual-guidance 寫轉場與動線
    left:
      heading: 轉型前
      items: [平均 45 天上線, 客戶要自己讀文件]
    right:
      heading: 轉型後
      items: [平均 ==12 天==上線, 專員陪跑兩週]
    source: 2026 內部客戶導入紀錄（N=24）

  - chapter: shift
    title: 客戶怎麼說
    layout: quote
    text: 這是我們第一次在一個月內讓全公司都用起來的系統。
    source: 某製造業客戶 IT 主管

  - type: shock
    text: 下半年，營收成長 38%
    sub: 而且沒有增加任何一位業務
    source: 2026 下半年財務報告
    notes: 停兩秒再說話。

  - chapter: next
    title: 明年需要的支持
    layout: bullets
    items:
      - 導入專員從 2 人擴編到 ==4 人==
      - 目標：新客戶 30 天內完成導入
      - 預估多承接 15 個客戶
    notes: 備註限制：預估多承接 15 個客戶為試算目標，尚未計入大型客製專案。

  - type: closing
    text: 謝謝
    sub: 歡迎提問
